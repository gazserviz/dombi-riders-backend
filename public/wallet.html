<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Портфейл — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/wallet.html" data-title="Портфейл"></div>

<script src="/js/app.js"></script>
<script>
const WT_STATUS = {
  pending: ['Чака одобрение', 'badge-warn'],
  approved: ['Одобрен', 'badge-green'],
  rejected: ['Отхвърлен', 'badge-danger'],
  cancelled: ['Отменен', 'badge-muted'],
};
function wtBadge(status) {
  const [label, cls] = WT_STATUS[status] || [status, 'badge-muted'];
  return `<span class="badge ${cls}">${label}</span>`;
}
function txBadge(t) {
  const positive = Number(t.amount) >= 0;
  return `<span class="badge ${positive ? 'badge-green' : 'badge-danger'}">${positive ? '+' : ''}${fmtMoney(t.amount)}</span>`;
}
const TX_TYPE_LABELS = {
  transfer: 'Превод между потребители',
  admin_adjustment: 'Ръчна корекция от админ',
  adjustment: 'Корекция',
};

let CURRENT_USER = null;
let ALL_USERS = [];

async function loadOwnWallet() {
  const host = document.getElementById('ownWalletHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const data = await Api.get('/api/wallet');
  CURRENT_USER.can_approve_transfers = data.can_approve_transfers;

  host.innerHTML = `
    <div class="stat-card" style="margin-bottom:16px;">
      <div class="label">Текущо салдо</div>
      <div class="value">${fmtMoney(data.balance)}</div>
    </div>
    <h3>История на транзакциите</h3>
    ${data.transactions.length ? `
    <div class="table-wrap"><table>
      <thead><tr><th>Кога</th><th>Вид</th><th>Сума</th><th>Бележка</th></tr></thead>
      <tbody>
        ${data.transactions.map(t => `
          <tr><td>${fmtDateTime(t.created_at)}</td><td>${TX_TYPE_LABELS[t.type] || t.type}</td>
          <td>${txBadge(t)}</td><td>${t.note || '—'}</td></tr>`).join('')}
      </tbody>
    </table></div>` : `<p class="hint">Няма транзакции все още.</p>`}
  `;
  renderApprovePanelVisibility();
}

async function loadMyTransfers() {
  const host = document.getElementById('myTransfersHost');
  const { transfers } = await Api.get('/api/wallet/transfers');
  if (!transfers.length) { host.innerHTML = `<p class="hint">Нямате преводи.</p>`; return; }
  host.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Кога</th><th>От</th><th>Към</th><th>Сума</th><th>Бележка</th><th>Статус</th><th></th></tr></thead>
      <tbody>
        ${transfers.map(t => `
          <tr>
            <td>${fmtDateTime(t.requested_at)}</td>
            <td>${userLabel(t.from_user_id)}</td>
            <td>${userLabel(t.to_user_id)}</td>
            <td>${fmtMoney(t.amount)}</td>
            <td>${t.note || '—'}</td>
            <td>${wtBadge(t.status)}</td>
            <td>${(t.status === 'pending' && t.requested_by === CURRENT_USER.id) ? `<button class="btn btn-ghost btn-sm cancel-transfer-btn" data-id="${t.id}">Отмени</button>` : ''}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  host.querySelectorAll('.cancel-transfer-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await Api.post(`/api/wallet/transfers/${btn.dataset.id}/cancel`, {}); await refreshAll(); }
      catch (err) { alert(err.message); }
    });
  });
}

function userLabel(id) {
  if (id === CURRENT_USER.id) return 'Вие';
  const u = ALL_USERS.find(u => u.id === id);
  return u ? u.full_name : id;
}

function renderApprovePanelVisibility() {
  const panel = document.getElementById('approvePanel');
  if (!panel) return;
  panel.style.display = CURRENT_USER.can_approve_transfers ? '' : 'none';
}

async function loadApproveQueue() {
  if (!CURRENT_USER.can_approve_transfers) return;
  const host = document.getElementById('approveQueueHost');
  const { transfers } = await Api.get('/api/wallet/transfers?scope=all&status=pending');
  if (!transfers.length) { host.innerHTML = `<p class="hint">Няма чакащи преводи за одобрение.</p>`; return; }
  host.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Кога</th><th>От</th><th>Към</th><th>Сума</th><th>Бележка</th><th></th></tr></thead>
      <tbody>
        ${transfers.map(t => `
          <tr>
            <td>${fmtDateTime(t.requested_at)}</td>
            <td>${userLabel(t.from_user_id)}</td>
            <td>${userLabel(t.to_user_id)}</td>
            <td>${fmtMoney(t.amount)}</td>
            <td>${t.note || '—'}</td>
            <td style="white-space:nowrap;">
              <button class="btn btn-primary btn-sm approve-btn" data-id="${t.id}">Одобри</button>
              <button class="btn btn-ghost btn-sm reject-btn" data-id="${t.id}">Отхвърли</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  host.querySelectorAll('.approve-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await Api.post(`/api/wallet/transfers/${btn.dataset.id}/decide`, { approve: true }); await refreshAll(); }
      catch (err) { alert(err.message); }
    });
  });
  host.querySelectorAll('.reject-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const note = prompt('Причина за отхвърляне (по избор):') || '';
      try { await Api.post(`/api/wallet/transfers/${btn.dataset.id}/decide`, { approve: false, decision_note: note }); await refreshAll(); }
      catch (err) { alert(err.message); }
    });
  });
}

async function loadAdminOverview() {
  if (CURRENT_USER.role !== 'admin') return;
  const host = document.getElementById('adminOverviewHost');
  const { wallets } = await Api.get('/api/wallet/users');
  host.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Потребител</th><th>Роля</th><th>Салдо</th></tr></thead>
      <tbody>
        ${wallets.map(w => `<tr><td>${w.full_name}</td><td>${ROLE_LABELS[w.role] || w.role}</td><td>${fmtMoney(w.balance)}</td></tr>`).join('')}
      </tbody>
    </table></div>`;

  const select = document.getElementById('adjUserSelect');
  select.innerHTML = wallets.map(w => `<option value="${w.user_id}">${w.full_name}</option>`).join('');
}

async function refreshAll() {
  // loadOwnWallet сам поставя CURRENT_USER.can_approve_transfers — трябва да
  // приключи първо, за да не тръгне loadApproveQueue() с остаряла стойност.
  await loadOwnWallet();
  await Promise.all([loadMyTransfers(), loadApproveQueue(), loadAdminOverview()]);
}

async function init() {
  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;

  const { users } = await Api.get('/api/wallet/directory');
  ALL_USERS = users;

  // /api/wallet/directory връща само активни потребители, филтрирано на сървъра
  const transferTargets = ALL_USERS.filter(u => u.id !== CURRENT_USER.id);

  document.getElementById('app-content').innerHTML = `
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Моят портфейл</h2></div>
        <div id="ownWalletHost" class="loading">Зареждане…</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Изпрати пари</h2></div>
        <p class="hint">Вътрешен превод между потребители — изисква одобрение от администратор (или упълномощен потребител), преди сумата да се прехвърли реално в салдата.</p>
        <div class="error-box" id="transferError"></div>
        ${transferTargets.length ? `
        <form id="transferForm">
          <div class="field"><label>Към *</label>
            <select name="to_user_id" required>
              ${transferTargets.map(u => `<option value="${u.id}">${u.full_name} (${ROLE_LABELS[u.role] || u.role})</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Сума (лв.) *</label><input name="amount" type="number" step="0.01" min="0.01" required></div>
          <div class="field"><label>Бележка</label><input name="note" placeholder="напр. За гориво"></div>
          <button type="submit" class="btn btn-primary btn-block">Изпрати заявка за превод</button>
        </form>` : `<p class="hint">Няма други активни потребители за превод.</p>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Моите преводи</h2></div>
      <div id="myTransfersHost" class="loading">Зареждане…</div>
    </div>

    <div class="panel" id="approvePanel" style="display:none;">
      <div class="panel-head"><h2>Одобрение на преводи</h2></div>
      <div id="approveQueueHost" class="loading">Зареждане…</div>
    </div>

    ${CURRENT_USER.role === 'admin' ? `
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Всички портфейли</h2></div>
        <div id="adminOverviewHost" class="loading">Зареждане…</div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Ръчна корекция на баланс</h2></div>
        <p class="hint">За начални салда, бонуси или корекции — не е истински банков превод, само вътрешна счетоводна корекция.</p>
        <div class="error-box" id="adjError"></div>
        <div class="success-box" id="adjSuccess"></div>
        <form id="adjForm">
          <div class="field"><label>Потребител *</label><select name="user_id" id="adjUserSelect" required></select></div>
          <div class="field"><label>Сума (лв.) — може да е отрицателна за тегление *</label><input name="amount" type="number" step="0.01" required></div>
          <div class="field"><label>Бележка</label><input name="note" placeholder="напр. Начално салдо"></div>
          <button type="submit" class="btn btn-primary btn-block">Приложи корекция</button>
        </form>
      </div>
    </div>` : ''}
  `;

  const transferForm = document.getElementById('transferForm');
  if (transferForm) transferForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('transferError');
    errorBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    try {
      await Api.post('/api/wallet/transfers', data);
      e.target.reset();
      await refreshAll();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  const adjForm = document.getElementById('adjForm');
  if (adjForm) adjForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('adjError');
    const successBox = document.getElementById('adjSuccess');
    errorBox.classList.remove('show'); successBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    try {
      await Api.post('/api/wallet/adjustments', data);
      successBox.textContent = 'Корекцията е приложена.';
      successBox.classList.add('show');
      e.target.reset();
      await refreshAll();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  await refreshAll();
}
init();
</script>
</body>
</html>
