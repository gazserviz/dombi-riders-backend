<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кандидатури — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/applications.html" data-title="Кандидатури"></div>

<script src="/js/app.js"></script>
<script>
const APP_STATUS = {
  pending: ['Чака преглед', 'badge-warn'],
  link_sent: ['Изпратен линк за довършване', 'badge-muted'],
  details_completed: ['Данните са допълнени', 'badge-warn'],
  approved: ['Одобрена', 'badge-green'],
  rejected: ['Отхвърлена', 'badge-danger'],
};
function appStatusBadge(s) { const [label, cls] = APP_STATUS[s] || [s, 'badge-muted']; return `<span class="badge ${cls}">${label}</span>`; }
const EC_TYPE_LABELS = { labor: 'Трудов', civil: 'Граждански' };
const CITY_LABELS = { sofia: 'София', plovdiv: 'Пловдив', varna: 'Варна', burgas: 'Бургас' };
const VEHICLE_LABELS = { own_car: 'Собствена кола', company_car: 'Фирмена кола', bicycle: 'Колело', scooter: 'Скутер' };
const NATIONALITY_LABELS = { bulgarian: 'България', ukrainian: 'Украйна', uzbek: 'Узбекистан', other: 'Друга' };
const GLOVO_BOLT_LABELS = { yes: 'Да', no: 'Не' };
function photoLink(url) { return url ? `<a href="${url}" target="_blank">Преглед</a>` : '—'; }

let CURRENT_USER = null;
let MANAGERS = [];
let activeStatus = 'pending';
let expandedId = null;

const OPEN_STATUSES = ['pending', 'link_sent', 'details_completed'];

function applicationDetailHtml(app, isAdmin) {
  const suggestedEmail = app.email || '';
  const isOpen = OPEN_STATUSES.includes(app.status);
  const detailsGiven = app.egn || app.id_card_number || app.driver_license_number;
  return `
    <tr><td colspan="6">
      <div class="panel" style="margin:0;background:var(--panel-2);">
        ${['pending', 'link_sent'].includes(app.status) ? `
        <div class="hint" style="margin-bottom:14px;">
          ${detailsGiven ? '' : 'Кандидатурата е само от кратката форма — липсват лична карта/книжка/ЕГН/избор на договор. '}
          Изпрати линк, по който кандидатът сам да ги допълни, преди да одобриш.
          <button type="button" class="btn btn-ghost btn-sm send-link-btn" data-id="${app.id}" style="margin-left:8px;">
            ${app.status === 'link_sent' ? '🔗 Генерирай нов линк' : '🔗 Изпрати линк за довършване'}
          </button>
        </div>` : ''}
        <div class="grid-2">
          <div>
            <div class="table-wrap"><table>
              <tr><td><strong>ЕГН</strong></td><td>${app.egn || '—'}</td></tr>
              <tr><td><strong>Адрес</strong></td><td>${app.address || '—'}</td></tr>
              <tr><td><strong>Град</strong></td><td>${CITY_LABELS[app.city] || '—'}</td></tr>
              <tr><td><strong>Националност</strong></td><td>${app.nationality === 'other' ? (app.nationality_other || 'Друга') : (NATIONALITY_LABELS[app.nationality] || '—')}</td></tr>
              <tr><td><strong>Ще кара с</strong></td><td>${VEHICLE_LABELS[app.work_vehicle_type] || '—'}</td></tr>
              <tr><td><strong>Профил Glovo/Bolt</strong></td><td>${GLOVO_BOLT_LABELS[app.had_glovo_bolt_account] || '—'}${app.glovo_bolt_platform ? ' · ' + app.glovo_bolt_platform : ''}</td></tr>
              <tr><td><strong>Лична карта №</strong></td><td>${app.id_card_number || '—'} ${app.id_card_expiry ? '· валидна до ' + fmtDate(app.id_card_expiry) : ''}</td></tr>
              <tr><td><strong>Снимка ЛК — лице / гръб</strong></td><td>${photoLink(app.id_card_photo_front_url)} / ${photoLink(app.id_card_photo_back_url)}</td></tr>
              <tr><td><strong>Селфи</strong></td><td>${photoLink(app.selfie_photo_url)}</td></tr>
              <tr><td><strong>Книжка №</strong></td><td>${app.driver_license_number || '—'} ${app.driver_license_expiry ? '· валидна до ' + fmtDate(app.driver_license_expiry) : ''}</td></tr>
              <tr><td><strong>Снимка книжка — лице / гръб</strong></td><td>${photoLink(app.driver_license_photo_front_url)} / ${photoLink(app.driver_license_photo_back_url)}</td></tr>
              ${app.nationality && app.nationality !== 'bulgarian' ? `
              <tr><td><strong>${app.nationality === 'ukrainian' ? 'Закрила' : 'Разрешение за пребиваване'}</strong></td><td>${photoLink(app.nationality === 'ukrainian' ? app.protection_status_photo_url : app.residence_permit_photo_url)}</td></tr>
              ${app.nationality !== 'ukrainian' ? `<tr><td><strong>Удостоверение от НАП</strong></td><td>${photoLink(app.nap_certificate_photo_url)}</td></tr>` : ''}` : ''}
              <tr><td><strong>Бележки</strong></td><td>${app.notes || '—'}</td></tr>
            </table></div>
          </div>
          ${(isAdmin && isOpen) ? `
          <div>
            <h3>Одобри кандидатурата</h3>
            <p class="hint">Създава реален профил (роля: шофьор) и чернова на договор (${EC_TYPE_LABELS[app.desired_contract_type] || app.desired_contract_type}${app.desired_hours_per_day ? ' · ' + app.desired_hours_per_day + 'ч' : ''}), готова за разписване.</p>
            <div class="error-box" id="approveError-${app.id}"></div>
            <div class="success-box" id="approveSuccess-${app.id}"></div>
            <form class="approve-form" data-id="${app.id}">
              <div class="field"><label>Имейл за новия профил *</label><input name="email" type="email" required value="${suggestedEmail}"></div>
              <div class="field"><label>Временна парола (по избор — генерира се автоматично, ако е празно)</label><input name="temp_password"></div>
              <div class="field"><label>Мениджър</label>
                <select name="manager_id">
                  <option value="">— няма —</option>
                  ${MANAGERS.map(m => `<option value="${m.id}">${m.full_name} (${ROLE_LABELS[m.role] || m.role})</option>`).join('')}
                </select>
              </div>
              <button type="submit" class="btn btn-primary btn-sm">Одобри и създай профил</button>
            </form>
          </div>` : ''}
          ${(!isAdmin && isOpen) ? `<div><p class="hint">Само администратор може да одобрява кандидатури и да създава профили.</p></div>` : ''}
        </div>
        ${isOpen ? `
        <div style="margin-top:14px;">
          <button type="button" class="btn btn-ghost btn-sm reject-btn" data-id="${app.id}">Отхвърли кандидатурата</button>
        </div>` : ''}
        ${app.status === 'rejected' && app.decision_note ? `<p class="hint" style="margin-top:10px;">Причина: ${app.decision_note}</p>` : ''}
      </div>
    </td></tr>`;
}

function applicationsTable(apps, isAdmin) {
  if (!apps.length) return `<p class="hint">Няма кандидатури в тази категория.</p>`;
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Дата</th><th>Име</th><th>Телефон</th><th>Договор</th><th>Статус</th><th></th></tr></thead>
        <tbody>
          ${apps.map(a => `
            <tr>
              <td>${fmtDate(a.created_at)}</td>
              <td><strong>${a.full_name}</strong>${a.email ? `<div class="sub" style="color:var(--muted);font-size:.78rem;">${a.email}</div>` : ''}</td>
              <td>${a.phone}</td>
              <td>${EC_TYPE_LABELS[a.desired_contract_type] || a.desired_contract_type}${a.desired_hours_per_day ? ' · ' + a.desired_hours_per_day + 'ч' : ''}</td>
              <td>${appStatusBadge(a.status)}</td>
              <td><button type="button" class="btn btn-ghost btn-sm toggle-detail-btn" data-id="${a.id}">${expandedId === a.id ? 'Скрий' : 'Преглед'}</button></td>
            </tr>
            ${expandedId === a.id ? applicationDetailHtml(a, isAdmin) : ''}
          `).join('')}
        </tbody>
      </table>
    </div>`;
}

async function refresh() {
  const host = document.getElementById('tableHost');
  const { applications } = await Api.get(`/api/hr/applications?status=${activeStatus}`);
  const isAdmin = CURRENT_USER.role === 'admin';
  host.innerHTML = applicationsTable(applications, isAdmin);

  host.querySelectorAll('.toggle-detail-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      expandedId = expandedId === btn.dataset.id ? null : btn.dataset.id;
      refresh();
    });
  });
  host.querySelectorAll('.approve-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById(`approveError-${form.dataset.id}`);
      const successBox = document.getElementById(`approveSuccess-${form.dataset.id}`);
      errorBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      if (!data.manager_id) delete data.manager_id;
      if (!data.temp_password) delete data.temp_password;
      try {
        const result = await Api.post(`/api/hr/applications/${form.dataset.id}/approve`, data);
        successBox.innerHTML = `Профилът е създаден.<br>
          Имейл: <strong>${result.profile.email}</strong> · Временна парола: <strong>${result.temp_password}</strong><br>
          Запишете паролата сега — няма да бъде показана отново.<br><br>
          <a href="/employment-contract-print.html?id=${result.contract.id}" target="_blank" class="btn btn-primary btn-sm">📄 Отвори договора → изпрати за подпис</a>`;
        successBox.classList.add('show');
        await refresh();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  });
  host.querySelectorAll('.reject-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const note = prompt('Причина за отхвърляне (по избор):') || '';
      try {
        await Api.post(`/api/hr/applications/${btn.dataset.id}/reject`, { decision_note: note });
        expandedId = null;
        await refresh();
      } catch (err) { alert(err.message); }
    });
  });
  host.querySelectorAll('.send-link-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try {
        const { link } = await Api.post(`/api/hr/applications/${btn.dataset.id}/send-link`, {});
        try { await navigator.clipboard.writeText(link); } catch (e) { /* без достъп до клипборда — показваме линка директно */ }
        prompt('Линкът е копиран (ако браузърът позволи). Изпрати го на кандидата през Viber/SMS/имейл:', link);
        await refresh();
      } catch (err) { alert(err.message); }
    });
  });
}

async function init() {
  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;
  if (!['admin', 'manager'].includes(CURRENT_USER.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате кандидатурите.</div>`;
    return;
  }

  try {
    const { users } = await Api.get('/api/users');
    MANAGERS = users.filter(u => ['admin', 'manager'].includes(u.role));
  } catch (e) { MANAGERS = []; }

  document.getElementById('app-content').innerHTML = `
    <p class="hint" style="margin-bottom:16px;">
      Кандидатури от кратката форма на маркетинг сайта и от подробната форма (<code>/apply.html</code>).
      За кратките кандидатури изпрати линк на кандидата да допълни лична карта/книжка/ЕГН/избор на договор.
      Одобрението създава реален потребителски профил и чернова на трудов/граждански договор.
    </p>
    <div class="tabs">
      <div class="tab active" data-status="pending">Чакащи</div>
      <div class="tab" data-status="link_sent">Изпратен линк</div>
      <div class="tab" data-status="details_completed">Допълнени</div>
      <div class="tab" data-status="approved">Одобрени</div>
      <div class="tab" data-status="rejected">Отхвърлени</div>
    </div>
    <div class="panel">
      <div id="tableHost" class="loading">Зареждане…</div>
    </div>`;

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeStatus = tab.dataset.status;
      expandedId = null;
      refresh();
    });
  });

  await refresh();
}
init();
</script>
</body>
</html>
