<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зачисления — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/assignments.html" data-title="Зачисляване на шофьори"></div>

<script src="/js/app.js"></script>
<script>
const params = new URLSearchParams(location.search);
const preselectedVehicle = params.get('vehicle_id');
let CURRENT_USER = null;
const PURPOSE_LABELS = { dombi_courier:'Куриер на Dombi Riders', other_platform:'Друга платформа', personal_use:'Лично ползване' };

function newFormHtml(vehicles, drivers) {
  return `
    <div class="panel">
      <div class="panel-head"><h2>Ново зачисляване</h2></div>
      <form id="assignForm">
        <div class="field-row">
          <div class="field"><label>Кола *</label>
            <select name="vehicle_id" required>
              <option value="">— избери —</option>
              ${vehicles.map(v => `<option value="${v.id}" ${v.id===preselectedVehicle?'selected':''}>${v.plate_number} — ${v.make} ${v.model}</option>`).join('')}
            </select>
          </div>
          <div class="field"><label>Цел на зачисляването *</label>
            <select name="purpose" id="purposeSelect" required>
              ${Object.entries(PURPOSE_LABELS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}
            </select>
          </div>
        </div>

        <div id="internalDriverField" class="field">
          <label>Шофьор (от HR модула)</label>
          <select name="driver_id">
            <option value="">— избери служител —</option>
            ${drivers.map(d => `<option value="${d.id}">${d.full_name} (${d.phone||'няма тел.'})</option>`).join('')}
          </select>
        </div>

        <div id="externalDriverFields" style="display:none;">
          <div class="field-row">
            <div class="field"><label>Име на наемателя</label><input name="external_name"></div>
            <div class="field"><label>Телефон</label><input name="external_phone"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>ЕГН</label><input name="external_egn"></div>
            <div class="field"><label>№ на шофьорска книжка</label><input name="external_license_number"></div>
          </div>
        </div>

        <div class="field-row">
          <div class="field"><label>Начална дата</label><input name="start_date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="field"><label>Пробег при предаване (км) *</label><input name="start_odometer_km" type="number" required></div>
        </div>

        <div class="hint" style="margin:14px 0 6px;font-weight:600;">Договор за наем (задължителен)</div>
        <div class="field-row">
          <div class="field"><label>Наемна вноска (€) *</label><input name="rate_amount" type="number" step="0.01" min="0" required></div>
          <div class="field"><label>Период на вноската</label>
            <select name="rate_period">
              <option value="week">Седмична</option>
              <option value="month">Месечна</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Депозит (€)</label><input name="deposit_amount" type="number" step="0.01" min="0" value="0"></div>

        <div class="hint" style="margin:14px 0 6px;font-weight:600;">Приемо-предавателен протокол (задължителен)</div>
        <div class="field-row">
          <div class="field"><label>Вид гориво</label>
            <select name="fuel_type" id="assignFuelTypeSelect">
              <option value="petrol">Бензин</option>
              <option value="diesel">Дизел</option>
              <option value="gas_petrol">Газ + Бензин</option>
              <option value="electric">Електрическа</option>
              <option value="hybrid">Хибрид</option>
            </select>
          </div>
          <div class="field"><label id="assignFuelPrimaryLabel">Ниво на гориво (%)</label><input name="fuel_level_pct" type="number" min="0" max="100" value="100"></div>
          <div class="field" id="assignFuelSecondaryField" style="display:none;"><label>Ниво на газ (%)</label><input name="fuel_level_secondary_pct" type="number" min="0" max="100" value="100"></div>
        </div>

        <div class="field"><label>Бележки</label><input name="notes"></div>
        <div class="error-box" id="assignErrorBox"></div>
        <div class="success-box" id="assignSuccessBox"></div>
        <button type="submit" class="btn btn-primary">Зачисли (създава договор + протокол)</button>
      </form>
    </div>`;
}

function listHtml(list) {
  return `
    <div class="panel">
      <div class="panel-head"><h2>Активни и минали зачисления</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Кола</th><th>Шофьор</th><th>Цел</th><th>Период</th><th>Статус</th><th></th></tr></thead>
          <tbody>
            ${list.length ? list.map(a => `
              <tr>
                <td>${a.vehicle_label||a.vehicle_id}</td>
                <td>${a.driver_id ? (a.driver_name||a.driver_id) : (a.external_name+' (външен)')}${a.driver_profile ? driverIdLine(a.driver_profile) : ''}</td>
                <td>${PURPOSE_LABELS[a.purpose]||a.purpose}</td>
                <td>${fmtDate(a.start_date)} — ${a.end_date?fmtDate(a.end_date):'сега'}</td>
                <td>${a.status==='active' ? '<span class="badge badge-green">Активно</span>' : '<span class="badge badge-muted">Приключено</span>'}</td>
                <td>${a.status==='active' ? `<button class="btn btn-ghost btn-sm end-btn" data-id="${a.id}">Прекрати</button>` : ''}</td>
              </tr>`).join('')
            : `<tr><td colspan="6" class="empty-state">Няма зачисления.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>`;
}

async function loadAssignments(vehiclesById) {
  const { assignments } = await Api.get('/api/assignments');
  let usersById = {};
  try { const { users } = await Api.get('/api/users'); usersById = Object.fromEntries(users.map(u=>[u.id,u])); } catch(e){}
  assignments.forEach(a => {
    a.driver_profile = a.driver_id ? (usersById[a.driver_id] || null) : null;
    a.driver_name = a.driver_profile ? a.driver_profile.full_name : null;
    const v = vehiclesById[a.vehicle_id];
    a.vehicle_label = v ? `${v.plate_number} — ${v.make} ${v.model}` : a.vehicle_id;
  });
  document.getElementById('listHost').innerHTML = listHtml(assignments);
  document.querySelectorAll('.end-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Прекратяване на зачисляването?')) return;
      await Api.post(`/api/assignments/${btn.dataset.id}/end`, {});
      init();
    });
  });
}

async function init() {
  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;
  if (!['admin','manager','super_admin'].includes(CURRENT_USER.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да управлявате зачисления.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  const [{ vehicles }, { users }] = await Promise.all([Api.get('/api/vehicles'), Api.get('/api/users')]);
  const drivers = users.filter(u => u.role === 'driver' && u.status === 'active');
  const vehiclesById = Object.fromEntries(vehicles.map(v => [v.id, v]));

  content.innerHTML = `${newFormHtml(vehicles, drivers)}<div id="listHost"></div>`;

  document.getElementById('purposeSelect').addEventListener('change', (e) => {
    const isInternal = e.target.value === 'dombi_courier';
    document.getElementById('internalDriverField').style.display = isInternal ? 'block' : 'none';
    document.getElementById('externalDriverFields').style.display = isInternal ? 'none' : 'block';
  });

  function syncAssignFuelFields() {
    const isGasPetrol = document.getElementById('assignFuelTypeSelect').value === 'gas_petrol';
    document.getElementById('assignFuelSecondaryField').style.display = isGasPetrol ? '' : 'none';
    document.getElementById('assignFuelPrimaryLabel').textContent = isGasPetrol ? 'Ниво на бензин (%)' : 'Ниво на гориво (%)';
  }
  document.getElementById('assignFuelTypeSelect').addEventListener('change', syncAssignFuelFields);
  syncAssignFuelFields();

  document.getElementById('assignForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('assignErrorBox');
    const successBox = document.getElementById('assignSuccessBox');
    errorBox.classList.remove('show'); successBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (data.start_odometer_km) data.start_odometer_km = Number(data.start_odometer_km);
    if (data.rate_amount) data.rate_amount = Number(data.rate_amount);
    if (data.deposit_amount) data.deposit_amount = Number(data.deposit_amount);
    if (data.fuel_level_pct) data.fuel_level_pct = Number(data.fuel_level_pct);
    if (data.fuel_type === 'gas_petrol' && data.fuel_level_secondary_pct) {
      data.fuel_level_secondary_pct = Number(data.fuel_level_secondary_pct);
    } else {
      delete data.fuel_level_secondary_pct;
    }
    if (data.purpose !== 'dombi_courier') { data.driver_id = ''; }
    else { data.external_name = ''; data.external_phone = ''; data.external_egn = ''; data.external_license_number = ''; }
    Object.keys(data).forEach(k => { if (data[k] === '') delete data[k]; });
    try {
      const result = await Api.post('/api/assignments', data);
      successBox.innerHTML = `Зачисляването е успешно. Договорът и протоколът са генерирани автоматично:
        <a href="/contract-print.html?id=${result.contract.id}" target="_blank">📄 Договор за наем</a> ·
        <a href="/protocol-print.html?id=${result.protocol.id}" target="_blank">📄 Приемо-предавателен протокол</a>`;
      successBox.classList.add('show');
      e.target.reset();
      syncAssignFuelFields();
      loadAssignments(vehiclesById);
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  loadAssignments(vehiclesById);
}
init();
</script>
</body>
</html>
