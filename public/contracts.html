<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Договори за наем — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/contracts.html" data-title="Договори за наем"></div>

<script src="/js/app.js"></script>
<script>
const STATUS_LABELS = { draft:['Чернова','badge-muted'], active:['Активен','badge-green'], completed:['Приключен','badge-muted'], terminated:['Прекратен','badge-danger'] };

// "Дължи" колоната показва задължението на наематели, които НЕ са куриери на
// Dombi Riders (за тях наемът се удържа автоматично от заработката всяка
// седмица — виж заплати). За външни наематели (друга платформа / лично
// ползване) сумата се трупа за всеки изминал ден по договорената ставка,
// докато не запишем плащане — виж бутона "Плащане" по-долу.
function balanceCell(c) {
  const b = c.balance;
  if (!b) return c.renter_type === 'dombi_courier' ? '<span class="hint">през заплата</span>' : '—';
  if (b.balance > 0) {
    return `<span style="color:var(--danger);font-weight:700;">Дължи ${fmtMoney(b.balance)}</span>`;
  }
  return `<span style="color:var(--green);font-weight:600;">Платено до ${fmtDate(b.paid_through_date)}</span>`;
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (!['admin','manager','super_admin'].includes(user.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате договори.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  const [{ contracts }, { vehicles }] = await Promise.all([Api.get('/api/contracts'), Api.get('/api/vehicles')]);
  const vehiclesById = Object.fromEntries(vehicles.map(v => [v.id, v]));
  const contractsById = Object.fromEntries(contracts.map(c => [c.id, c]));

  const canEdit = ['admin','manager','super_admin'].includes(user.role);

  content.innerHTML = `
    <div class="toolbar no-print"><div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="printBtn">🖨 Принтирай списъка</button>
      <a href="/contract-new.html" class="btn btn-primary btn-sm">+ Нов договор</a>
    </div>
    <div class="print-header"><h1>Dombi Riders — Договори за наем</h1><p>Генерирано на ${fmtDateTime(new Date())} от ${user.full_name}</p></div>
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>№</th><th>Кола</th><th>Наемател</th><th>Период</th><th>Наем</th><th>Дължи</th><th>Статус</th><th></th></tr></thead>
          <tbody>
            ${contracts.length ? contracts.map(c => {
              const v = vehiclesById[c.vehicle_id];
              const [label, cls] = STATUS_LABELS[c.status] || [c.status, 'badge-muted'];
              return `<tr>
                <td><strong>${c.contract_number}</strong></td>
                <td>${v ? v.plate_number+' — '+v.make+' '+v.model : c.vehicle_id}</td>
                <td>${c.renter_name||'—'}</td>
                <td>${fmtDate(c.start_date)} — ${c.end_date?fmtDate(c.end_date):'—'}</td>
                <td>${fmtMoney(c.rate_amount)} / ${c.rate_period==='week'?'седмица':c.rate_period==='month'?'месец':'ден'}</td>
                <td>${balanceCell(c)}</td>
                <td>${canEdit ? `
                  <select class="statusSelect no-print" data-id="${c.id}" style="width:auto;padding:5px 8px;font-size:.76rem;">
                    ${Object.entries(STATUS_LABELS).map(([val,[lbl]]) => `<option value="${val}" ${c.status===val?'selected':''}>${lbl}</option>`).join('')}
                  </select>
                  <span class="badge ${cls} print-only">${label}</span>
                ` : `<span class="badge ${cls}">${label}</span>`}</td>
                <td class="no-print">
                  <a class="btn btn-ghost btn-sm" href="/contract-print.html?id=${c.id}">🖨 Печат</a>
                  ${canEdit && c.balance ? `<button type="button" class="btn btn-primary btn-sm paymentBtn" data-id="${c.id}" style="margin-left:6px;">💰 Плащане</button>` : ''}
                </td>
              </tr>`;
            }).join('') : `<tr><td colspan="8" class="empty-state">Няма договори за наем.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-overlay" id="paymentModal">
      <div class="modal-box">
        <h3>Запиши плащане</h3>
        <p class="hint" id="paymentModalHint"></p>
        <div class="error-box" id="paymentError"></div>
        <form id="paymentForm">
          <input type="hidden" name="contract_id">
          <div class="field"><label>Сума (€) *</label><input name="amount" type="number" step="0.01" min="0.01" required></div>
          <div class="field"><label>Дата на плащане *</label><input name="payment_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div>
          <div class="field"><label>Бележка</label><input name="description" placeholder="напр. авансово плащане за месец"></div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost btn-sm" id="paymentCancelBtn">Отказ</button>
            <button type="submit" class="btn btn-primary btn-sm">Запази плащането</button>
          </div>
        </form>
      </div>
    </div>`;

  document.getElementById('printBtn')?.addEventListener('click', () => window.print());
  document.querySelectorAll('.statusSelect').forEach(sel => {
    sel.addEventListener('change', async () => {
      sel.disabled = true;
      try {
        await Api.put(`/api/contracts/${sel.dataset.id}`, { status: sel.value });
        init();
      } catch (err) {
        alert(err.message);
        sel.disabled = false;
      }
    });
  });

  // ---- запис на плащане (аванс) по договор за наем на външен наемател ----
  const paymentModal = document.getElementById('paymentModal');
  const paymentForm = document.getElementById('paymentForm');
  const paymentError = document.getElementById('paymentError');
  const paymentModalHint = document.getElementById('paymentModalHint');
  function openPaymentModal(contractId) {
    const c = contractsById[contractId];
    if (!c) return;
    paymentError.classList.remove('show');
    paymentForm.reset();
    paymentForm.contract_id.value = contractId;
    paymentForm.payment_date.value = new Date().toISOString().slice(0, 10);
    const b = c.balance;
    paymentModalHint.textContent = b && b.balance > 0
      ? `${c.renter_name || 'Наемателят'} дължи ${fmtMoney(b.balance)} към днешна дата.`
      : `${c.renter_name || 'Наемателят'} е платил предварително — платено до ${b ? fmtDate(b.paid_through_date) : '—'}.`;
    paymentModal.classList.add('show');
  }
  function closePaymentModal() { paymentModal.classList.remove('show'); }
  document.querySelectorAll('.paymentBtn').forEach(btn => {
    btn.addEventListener('click', () => openPaymentModal(btn.dataset.id));
  });
  document.getElementById('paymentCancelBtn').addEventListener('click', closePaymentModal);
  paymentModal.addEventListener('click', (e) => { if (e.target === paymentModal) closePaymentModal(); });
  paymentForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    paymentError.classList.remove('show');
    const data = Object.fromEntries(new FormData(paymentForm).entries());
    const c = contractsById[data.contract_id];
    if (!c) return;
    const submitBtn = paymentForm.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      await Api.post('/api/payments', {
        vehicle_id: c.vehicle_id,
        contract_id: c.id,
        direction: 'income',
        amount: Number(data.amount),
        payment_date: data.payment_date,
        description: data.description || `Плащане по договор ${c.contract_number}`,
      });
      closePaymentModal();
      init();
    } catch (err) {
      paymentError.textContent = err.message;
      paymentError.classList.add('show');
    } finally {
      submitBtn.disabled = false;
    }
  });
}
init();
</script>
</body>
</html>
