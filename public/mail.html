<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пощенска кутия — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>(function(){try{if(localStorage.getItem('dombi_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<style>
  .mail-list{max-height:640px;overflow-y:auto;}
  .mail-row{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:transparent;border:none;border-bottom:1px solid var(--line);padding:12px 6px;cursor:pointer;color:inherit;font:inherit;}
  .mail-row:last-child{border-bottom:none;}
  .mail-row:hover,.mail-row.active{background:var(--row-hover);}
  .mail-row .mr-body{flex:1;min-width:0;}
  .mail-row .mr-top{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;}
  .mail-row .mr-from{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mail-row.unread .mr-from,.mail-row.unread .mr-subject{font-weight:800;}
  .mail-row .mr-date{color:var(--muted);white-space:nowrap;font-size:.74rem;}
  .mail-row .mr-subject{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
  .mail-row .mr-replied{color:var(--green-2);margin-right:4px;font-weight:700;}
  .mail-row .mr-priority{margin-right:4px;}
  .mail-row.unread .mr-from::before{content:'●';color:var(--green);font-size:.6rem;margin-right:6px;vertical-align:middle;}
  /* кръгла "снимка" на подателя — лого на фирмата (favicon на домейна) за
     служебни адреси, Gravatar за лични/webmail адреси (виж avatarUrlFor и
     PUBLIC_WEBMAIL_DOMAINS по-долу); докато зареди, се вижда цветен кръг с
     инициали отдолу, overlay-нат от самото изображение */
  .mr-avatar-wrap{position:relative;flex-shrink:0;width:34px;height:34px;margin-top:2px;}
  .mr-avatar-fallback{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800;color:#fff;text-transform:uppercase;}
  .mr-avatar-img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;background:#fff;border:1px solid var(--line);}
  /* "✓/✓✓" read-receipt значка в "Изпратени" — виж /api/mail/sent (read поле) */
  .mr-receipt{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:700;white-space:nowrap;}
  .mr-receipt.opened{color:var(--green-2);}
  .mr-receipt.sent{color:var(--muted);}
  .mail-tabs{display:flex;gap:6px;margin-bottom:4px;align-items:center;}
  .mail-tabs button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:600;}
  .mail-tabs button.active{background:var(--panel-2);color:var(--text);border-color:var(--line);}
  .mail-tabs .unread-toggle{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);cursor:pointer;user-select:none;}
  .mail-tab-hint{font-size:.72rem;color:var(--muted);margin:0 0 10px 2px;}
  .mail-detail-head{margin-bottom:14px;}
  .mail-detail-head .subj{font-size:1.05rem;font-weight:800;margin-bottom:6px;}
  .mail-detail-head .meta{font-size:.8rem;color:var(--muted);line-height:1.6;}
  .mail-body-frame{width:100%;height:480px;border:1px solid var(--line);border-radius:10px;background:#fff;}
  .mail-body-text{white-space:pre-wrap;word-break:break-word;font-size:.88rem;line-height:1.6;max-height:480px;overflow-y:auto;padding:14px;background:var(--input-bg);border-radius:10px;border:1px solid var(--line);}
  .attach-list{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;}
  .compose-panel{display:none;}
  .compose-panel.show{display:block;}
</style>
</head>
<body>
<div id="app-shell" data-active="/mail.html" data-title="Пощенска кутия"></div>

<script src="/js/app.js"></script>
<script>
let CURRENT_USER = null;
let MESSAGES = [];
let SELECTED_UID = null;
let SELECTED_FOLDER = null;
let CURRENT_TAB = 'inbox'; // 'inbox' | 'sent'
let FORWARD_ATTACHMENTS = []; // [{filename, contentType, content(base64)}] — попълва се при "Препрати"
let FILTER_UNREAD = false; // "Само непрочетени" — чисто клиентски филтър на вече заредения списък
let REPLY_CONTEXT = null; // {uid, folder} на писмото, на което в момента отговаряме (за \Answered след изпращане)

function arrayBufferToBase64(buf) {
  let binary = '';
  const bytes = new Uint8Array(buf);
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(binary);
}

function fmtBytes(n) {
  if (n == null || isNaN(n)) return '—';
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / (1024 * 1024)).toFixed(2)} MB`;
}

// ---------------------------------------------------------------------------
// компактна MD5 реализация (класическият public-domain JS MD5 алгоритъм,
// RFC1321) — нужна е само за Gravatar hash по-долу (avatarUrlFor); Web
// Crypto API няма вграден MD5. Проверена срещу официалните тестови вектори
// ("" → d41d8cd9..., "abc" → 900150983c...) и срещу примера от документацията
// на Gravatar, преди да влезе в употреба тук.
// ---------------------------------------------------------------------------
function md5(str) {
  function rotl(n, c) { return (n << c) | (n >>> (32 - c)); }
  function cmn(q, a, b, x, s, t) {
    a = (((a + q) | 0) + ((x + t) | 0)) | 0;
    return (((rotl(a, s) | 0) + b) | 0);
  }
  function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
  function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
  function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
  function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
  const bytes = new TextEncoder().encode(str);
  const bitLen = bytes.length * 8;
  const padded = new Uint8Array((((bytes.length + 8) >> 6) + 1) * 64);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  const view = new DataView(padded.buffer);
  view.setUint32(padded.length - 8, bitLen >>> 0, true);
  view.setUint32(padded.length - 4, Math.floor(bitLen / 4294967296), true);
  let a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
  for (let i = 0; i < padded.length; i += 64) {
    const x = [];
    for (let j = 0; j < 16; j++) x[j] = view.getUint32(i + j * 4, true);
    const oa = a, ob = b, oc = c, od = d;
    a = ff(a, b, c, d, x[0], 7, -680876936); d = ff(d, a, b, c, x[1], 12, -389564586);
    c = ff(c, d, a, b, x[2], 17, 606105819); b = ff(b, c, d, a, x[3], 22, -1044525330);
    a = ff(a, b, c, d, x[4], 7, -176418897); d = ff(d, a, b, c, x[5], 12, 1200080426);
    c = ff(c, d, a, b, x[6], 17, -1473231341); b = ff(b, c, d, a, x[7], 22, -45705983);
    a = ff(a, b, c, d, x[8], 7, 1770035416); d = ff(d, a, b, c, x[9], 12, -1958414417);
    c = ff(c, d, a, b, x[10], 17, -42063); b = ff(b, c, d, a, x[11], 22, -1990404162);
    a = ff(a, b, c, d, x[12], 7, 1804603682); d = ff(d, a, b, c, x[13], 12, -40341101);
    c = ff(c, d, a, b, x[14], 17, -1502002290); b = ff(b, c, d, a, x[15], 22, 1236535329);
    a = gg(a, b, c, d, x[1], 5, -165796510); d = gg(d, a, b, c, x[6], 9, -1069501632);
    c = gg(c, d, a, b, x[11], 14, 643717713); b = gg(b, c, d, a, x[0], 20, -373897302);
    a = gg(a, b, c, d, x[5], 5, -701558691); d = gg(d, a, b, c, x[10], 9, 38016083);
    c = gg(c, d, a, b, x[15], 14, -660478335); b = gg(b, c, d, a, x[4], 20, -405537848);
    a = gg(a, b, c, d, x[9], 5, 568446438); d = gg(d, a, b, c, x[14], 9, -1019803690);
    c = gg(c, d, a, b, x[3], 14, -187363961); b = gg(b, c, d, a, x[8], 20, 1163531501);
    a = gg(a, b, c, d, x[13], 5, -1444681467); d = gg(d, a, b, c, x[2], 9, -51403784);
    c = gg(c, d, a, b, x[7], 14, 1735328473); b = gg(b, c, d, a, x[12], 20, -1926607734);
    a = hh(a, b, c, d, x[5], 4, -378558); d = hh(d, a, b, c, x[8], 11, -2022574463);
    c = hh(c, d, a, b, x[11], 16, 1839030562); b = hh(b, c, d, a, x[14], 23, -35309556);
    a = hh(a, b, c, d, x[1], 4, -1530992060); d = hh(d, a, b, c, x[4], 11, 1272893353);
    c = hh(c, d, a, b, x[7], 16, -155497632); b = hh(b, c, d, a, x[10], 23, -1094730640);
    a = hh(a, b, c, d, x[13], 4, 681279174); d = hh(d, a, b, c, x[0], 11, -358537222);
    c = hh(c, d, a, b, x[3], 16, -722521979); b = hh(b, c, d, a, x[6], 23, 76029189);
    a = hh(a, b, c, d, x[9], 4, -640364487); d = hh(d, a, b, c, x[12], 11, -421815835);
    c = hh(c, d, a, b, x[15], 16, 530742520); b = hh(b, c, d, a, x[2], 23, -995338651);
    a = ii(a, b, c, d, x[0], 6, -198630844); d = ii(d, a, b, c, x[7], 10, 1126891415);
    c = ii(c, d, a, b, x[14], 15, -1416354905); b = ii(b, c, d, a, x[5], 21, -57434055);
    a = ii(a, b, c, d, x[12], 6, 1700485571); d = ii(d, a, b, c, x[3], 10, -1894986606);
    c = ii(c, d, a, b, x[10], 15, -1051523); b = ii(b, c, d, a, x[1], 21, -2054922799);
    a = ii(a, b, c, d, x[8], 6, 1873313359); d = ii(d, a, b, c, x[15], 10, -30611744);
    c = ii(c, d, a, b, x[6], 15, -1560198380); b = ii(b, c, d, a, x[13], 21, 1309151649);
    a = ii(a, b, c, d, x[4], 6, -145523070); d = ii(d, a, b, c, x[11], 10, -1120210379);
    c = ii(c, d, a, b, x[2], 15, 718787259); b = ii(b, c, d, a, x[9], 21, -343485551);
    a = (a + oa) | 0; b = (b + ob) | 0; c = (c + oc) | 0; d = (d + od) | 0;
  }
  function toHexLE(n) {
    let s = '';
    for (let i = 0; i < 4; i++) s += ((n >> (i * 8)) & 0xff).toString(16).padStart(2, '0');
    return s;
  }
  return toHexLE(a) + toHexLE(b) + toHexLE(c) + toHexLE(d);
}

// лични/webmail домейни → показваме Gravatar (снимка на самия човек), вместо
// favicon-а на Gmail/Yahoo/abv.bg и т.н. за всеки изпращач от там, което би
// било едно и също лого навсякъде и безполезно за разпознаване на подателя
const PUBLIC_WEBMAIL_DOMAINS = new Set([
  'gmail.com', 'googlemail.com', 'yahoo.com', 'yahoo.co.uk', 'outlook.com', 'hotmail.com',
  'live.com', 'icloud.com', 'me.com', 'aol.com', 'abv.bg', 'mail.bg', 'gbg.bg', 'protonmail.com', 'proton.me',
]);

function initialsFor(name, email) {
  const base = (name && name.trim()) || (email || '');
  const parts = base.replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2);
  return (parts[0][0] + parts[parts.length - 1][0]);
}

// стабилен цвят по email (за фон на fallback инициалите) — не истинска
// случайност, а хеш, за да е винаги еднакъв цвят за един и същ подател
const AVATAR_PALETTE = ['#4dff7a', '#4d9fff', '#ff9f4d', '#ff4d8f', '#9f4dff', '#4dffe0', '#ffd24d', '#ff6b6b'];
function colorFor(seed) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
  return AVATAR_PALETTE[Math.abs(h) % AVATAR_PALETTE.length];
}

// избира "снимка" на подателя: лого на фирмата (Google favicon service, по
// домейн) за служебни адреси, Gravatar (по MD5 на имейла) за лични/webmail —
// виж бележката за PUBLIC_WEBMAIL_DOMAINS по-горе. И двете са ВЪНШНИ, публични
// услуги без нужда от API ключ; при липсваща снимка услугите си имат собствен
// fallback (identicon/generic favicon), а ние отгоре пазим и цветните
// инициали като последен fallback чрез onerror в renderList().
function avatarUrlFor(email) {
  const addr = (email || '').trim().toLowerCase();
  const domain = addr.split('@')[1] || '';
  if (domain && !PUBLIC_WEBMAIL_DOMAINS.has(domain)) {
    return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
  }
  if (addr) {
    return `https://www.gravatar.com/avatar/${md5(addr)}?d=404&s=64`;
  }
  return null;
}

// лек "приоритет" флаг — чисто клиентска евристика по ключови думи в темата,
// без да пипа подредбата на списъка (нарочно не пресортираме — да не бърка
// потребителя), само показва ⚡ до писма, които звучат спешно/важно
const PRIORITY_KEYWORDS = /спешно|спешен|важно|важен|незабавно|urgent|asap|deadline/i;
function isPriority(subject) {
  return PRIORITY_KEYWORDS.test(subject || '');
}

function renderMailReceipt(m) {
  if (CURRENT_TAB !== 'sent' || !m.read) return '';
  if (m.read.opened) {
    const when = m.read.openedAt ? fmtDateTime(m.read.openedAt) : '';
    return `<span class="mr-receipt opened" title="Отворено от получателя${when ? ' · ' + when : ''} (ориентировъчно — виж бележката над списъка)">✓✓ Прочетено</span>`;
  }
  return `<span class="mr-receipt sent" title="Изпратено, но все още няма данни, че е отворено от получателя">✓ Изпратено</span>`;
}

function renderList() {
  const host = document.getElementById('mailListHost');
  const list = FILTER_UNREAD ? MESSAGES.filter(m => !m.seen) : MESSAGES;
  if (!list.length) {
    const emptyMsg = FILTER_UNREAD
      ? 'Няма непрочетени писма.'
      : (CURRENT_TAB === 'sent' ? 'Няма изпратени писма.' : 'Няма писма във входящата кутия.');
    host.innerHTML = `<p class="hint">${emptyMsg}</p>`;
    return;
  }
  host.innerHTML = list.map(m => {
    const avatarAddr = CURRENT_TAB === 'sent' ? (m.to || '') : (m.from || '');
    const avatarName = CURRENT_TAB === 'sent' ? (m.to || '') : m.fromName;
    const initials = escapeHtml(initialsFor(avatarName, avatarAddr));
    const bg = colorFor(avatarAddr || avatarName || '?');
    const avatarSrc = avatarUrlFor(avatarAddr);
    const priorityFlag = isPriority(m.subject) ? '<span class="mr-priority" title="Звучи спешно/важно (по темата)">⚡</span>' : '';
    return `
    <button type="button" class="mail-row ${m.seen ? '' : 'unread'} ${m.uid === SELECTED_UID && m.folder === SELECTED_FOLDER ? 'active' : ''}" data-uid="${m.uid}" data-folder="${m.folder}">
      <span class="mr-avatar-wrap">
        <span class="mr-avatar-fallback" style="background:${bg};">${initials}</span>
        ${avatarSrc ? `<img class="mr-avatar-img" src="${avatarSrc}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
      </span>
      <span class="mr-body">
        <span class="mr-top">
          <span class="mr-from">${priorityFlag}${CURRENT_TAB === 'sent' ? ('До: ' + (m.to || '—')) : escapeHtml(m.fromName)}</span>
          <span class="mr-date">${m.date ? fmtDateTime(m.date) : ''}</span>
        </span>
        <span class="mr-subject">${m.answered ? '<span class="mr-replied" title="Отговорено">↩</span>' : ''}${escapeHtml(m.subject)}</span>
        ${renderMailReceipt(m)}
      </span>
    </button>
  `; }).join('');
  host.querySelectorAll('.mail-row').forEach(btn => {
    btn.addEventListener('click', () => openMessage(Number(btn.dataset.uid), btn.dataset.folder));
  });
}

// silent=true (за автоматичното периодично опресняване по-долу) — не пипа
// индикатора за зареждане, за да не трепти списъкът пред очите на
// потребителя на всеки 45 сек.; грешки при тих опит просто се подминават
// (следващият ръчен "Обнови" или следващият тих опит ще я покаже отново)
async function loadMessages(silent) {
  const host = document.getElementById('mailListHost');
  const errorBox = document.getElementById('listError');
  if (!silent) {
    errorBox.classList.remove('show');
    host.innerHTML = `<div class="loading">Зареждане…</div>`;
  }
  const endpoint = CURRENT_TAB === 'sent' ? '/api/mail/sent' : '/api/mail/inbox';
  try {
    const { messages } = await Api.get(`${endpoint}?limit=50`);
    MESSAGES = messages;
    renderList();
  } catch (err) {
    if (silent) return;
    host.innerHTML = '';
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  }
}

// пощата "се чекира сама" — тихо презареждане на текущия таб на интервал,
// вместо да се разчита само на ръчния бутон "Обнови"; индикаторът в
// sidebar-а (виж startNotificationBadges в app.js) върши същото за броя
// непрочетени на всички останали страници, тук опресняваме и самия списък,
// докато потребителят реално гледа пощенската кутия.
const MAIL_AUTO_REFRESH_MS = 45000;
let mailAutoRefreshTimer = null;
function startMailAutoRefresh() {
  if (mailAutoRefreshTimer) clearInterval(mailAutoRefreshTimer);
  mailAutoRefreshTimer = setInterval(() => loadMessages(true), MAIL_AUTO_REFRESH_MS);
}

function updateTabHint() {
  const host = document.getElementById('mailTabHint');
  if (!host) return;
  host.textContent = CURRENT_TAB === 'sent'
    ? '✓✓ Прочетено се появява само ако получателят отвори писмото И позволи автоматично сваляне на изображения в пощата си — не е 100% точно (някои пощи го правят автоматично при получаване, други изобщо го блокират).'
    : '';
}

function switchTab(tab) {
  if (tab === CURRENT_TAB) return;
  CURRENT_TAB = tab;
  SELECTED_UID = null;
  SELECTED_FOLDER = null;
  document.querySelectorAll('.mail-tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('mailDetailHost').innerHTML = `<p class="hint">Изберете писмо от списъка вляво.</p>`;
  updateTabHint();
  loadMessages();
}

function renderMessageDetail(msg) {
  const host = document.getElementById('mailDetailHost');
  // "Изпратени" — нарочно НЕ показваме HTML версията тук, дори да има: тя
  // носи нашия собствен read-receipt pixel (виж trackingPixelUrl в
  // lib/mail.js), а sandbox="" не пречи на зареждане на изображения — ако
  // покажехме я, прегледът на СОБСТВЕНО изпратено писмо би го отбелязал
  // погрешно като "прочетено от получателя". В "Изпратени" винаги текст.
  const useHtml = !!msg.html && CURRENT_TAB !== 'sent';
  const bodyHtml = useHtml
    ? `<iframe class="mail-body-frame" sandbox=""></iframe>`
    : `<div class="mail-body-text"></div>`;
  host.innerHTML = `
    <div class="mail-detail-head">
      <div class="subj">${escapeHtml(msg.subject)}</div>
      <div class="meta">
        От: ${escapeHtml(msg.from)}<br>
        До: ${escapeHtml(msg.to || '—')}<br>
        Дата: ${msg.date ? fmtDateTime(msg.date) : '—'}
      </div>
    </div>
    ${bodyHtml}
    ${msg.attachments.length ? `
      <div class="attach-list">
        ${msg.attachments.map(a => `
          <a class="btn btn-ghost btn-sm" href="/api/mail/message/${msg.uid}/attachment/${a.index}?folder=${encodeURIComponent(msg.folder)}" download>
            📎 ${escapeHtml(a.filename)} (${fmtBytes(a.size)})
          </a>`).join('')}
      </div>` : ''}
    <div style="margin-top:16px;display:flex;gap:8px;">
      ${CURRENT_TAB === 'sent' ? '' : '<button class="btn btn-primary btn-sm" id="replyBtn">↩ Отговори</button>'}
      <button class="btn btn-ghost btn-sm" id="forwardBtn">↪ Препрати</button>
      ${CURRENT_TAB === 'sent' ? '' : '<button class="btn btn-ghost btn-sm" id="markUnreadBtn">✉️ Маркирай като непрочетено</button>'}
    </div>
  `;
  if (useHtml) {
    // sandbox="" (без allow-scripts/allow-same-origin) — писмото не може да
    // изпълни JS нито да чете/пише каквото и да е в родителската страница,
    // дори ако съдържа злонамерен код; безопасно за преглед на чужд HTML.
    host.querySelector('.mail-body-frame').srcdoc = msg.html;
  } else {
    host.querySelector('.mail-body-text').textContent = msg.text || '(празно писмо)';
  }
  const replyBtn = document.getElementById('replyBtn');
  if (replyBtn) {
    replyBtn.addEventListener('click', () => openCompose({
      to: msg.from,
      subject: /^re:/i.test(msg.subject) ? msg.subject : `Re: ${msg.subject}`,
      inReplyTo: msg.messageId,
      references: [msg.references, msg.messageId].filter(Boolean).join(' '),
      replyToUid: msg.uid,
      replyToFolder: msg.folder,
    }));
  }
  document.getElementById('forwardBtn').addEventListener('click', () => forwardMessage(msg));
  const markUnreadBtn = document.getElementById('markUnreadBtn');
  if (markUnreadBtn) {
    markUnreadBtn.addEventListener('click', () => markMessageUnread(msg.uid, msg.folder));
  }
}

// ръчно "Маркирай като непрочетено" — обратното на автоматичното маркиране
// при отваряне (виж openMessage); връща писмото обратно в непрочетените и
// в sidebar-а (следващото тихо опресняване на badge-а, виж startNotificationBadges)
async function markMessageUnread(uid, folder) {
  const btn = document.getElementById('markUnreadBtn');
  if (btn) btn.disabled = true;
  try {
    await Api.post(`/api/mail/message/${uid}/seen`, { folder, seen: false });
    const m = MESSAGES.find(x => x.uid === uid && x.folder === folder);
    if (m) m.seen = false;
    renderList();
    document.getElementById('mailDetailHost').innerHTML = `<p class="hint">Изберете писмо от списъка вляво.</p>`;
    SELECTED_UID = null;
    SELECTED_FOLDER = null;
  } catch (err) {
    alert(`Грешка: ${err.message}`);
    if (btn) btn.disabled = false;
  }
}

// подготвя ново писмо с цитираното оригинално съобщение и (ако има) с
// прикачените му файлове, свалени и готови да се приложат наново
async function forwardMessage(msg) {
  const btn = document.getElementById('forwardBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  FORWARD_ATTACHMENTS = [];
  try {
    if (msg.attachments.length) {
      btn.textContent = 'Зареждане на прикачени файлове…';
      for (const a of msg.attachments) {
        const res = await fetch(`/api/mail/message/${msg.uid}/attachment/${a.index}?folder=${encodeURIComponent(msg.folder)}`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error(`Неуспешно сваляне на ${a.filename}`);
        const buf = await res.arrayBuffer();
        FORWARD_ATTACHMENTS.push({ filename: a.filename, contentType: a.contentType, content: arrayBufferToBase64(buf) });
      }
    }
    const quoted = `\n\n---------- Препратено съобщение ----------\nОт: ${msg.from}\nДата: ${msg.date ? fmtDateTime(msg.date) : '—'}\nТема: ${msg.subject}\nДо: ${msg.to || '—'}\n\n${msg.text || '(писмото няма текстово съдържание — виж оригинала в Zoho Webmail)'}`;
    openCompose({
      subject: /^fwd:/i.test(msg.subject) ? msg.subject : `Fwd: ${msg.subject}`,
      text: quoted,
      keepForwardAttachments: true,
    });
  } catch (err) {
    FORWARD_ATTACHMENTS = [];
    alert(`Грешка при подготовка на препращането: ${err.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function openMessage(uid, folder) {
  SELECTED_UID = uid;
  SELECTED_FOLDER = folder;
  renderList();
  const host = document.getElementById('mailDetailHost');
  host.innerHTML = `<div class="loading">Зареждане на писмото…</div>`;
  try {
    const { message } = await Api.get(`/api/mail/message/${uid}?folder=${encodeURIComponent(folder)}`);
    renderMessageDetail(message);
    const m = MESSAGES.find(x => x.uid === uid && x.folder === folder);
    if (m) { m.seen = true; renderList(); }
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

function renderForwardAttachmentsNotice() {
  const host = document.getElementById('composeAttachNotice');
  if (!FORWARD_ATTACHMENTS.length) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="hint">📎 Ще бъдат приложени: ${FORWARD_ATTACHMENTS.map(a => a.filename).join(', ')}
    <button type="button" class="btn btn-ghost btn-sm" id="clearForwardAttachBtn" style="margin-left:8px;">Премахни</button></div>`;
  document.getElementById('clearForwardAttachBtn').addEventListener('click', () => {
    FORWARD_ATTACHMENTS = [];
    renderForwardAttachmentsNotice();
  });
}

function openCompose(prefill) {
  prefill = prefill || {};
  if (!prefill.keepForwardAttachments) FORWARD_ATTACHMENTS = [];
  REPLY_CONTEXT = (prefill.replyToUid && prefill.replyToFolder) ? { uid: prefill.replyToUid, folder: prefill.replyToFolder } : null;
  const panel = document.getElementById('composePanel');
  panel.classList.add('show');
  document.getElementById('composeTo').value = prefill.to || '';
  document.getElementById('composeCc').value = prefill.cc || '';
  document.getElementById('composeSubject').value = prefill.subject || '';
  document.getElementById('composeText').value = prefill.text || '';
  document.getElementById('composeInReplyTo').value = prefill.inReplyTo || '';
  document.getElementById('composeReferences').value = prefill.references || '';
  document.getElementById('composeError').classList.remove('show');
  renderForwardAttachmentsNotice();
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function init() {
  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;
  if (!['admin', 'super_admin'].includes(CURRENT_USER.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате пощенската кутия.</div>`;
    return;
  }

  document.getElementById('app-content').innerHTML = `
    <div class="toolbar">
      <button class="btn btn-primary btn-sm" id="composeBtn">✉️ Ново писмо</button>
      <button class="btn btn-ghost btn-sm" id="refreshBtn">🔄 Обнови</button>
      <div class="spacer"></div>
      <a class="btn btn-ghost btn-sm" href="https://mail.zoho.eu" target="_blank" rel="noopener noreferrer">↗ Отвори в Zoho Webmail</a>
    </div>

    <div class="panel compose-panel" id="composePanel">
      <div class="panel-head"><h2>Ново писмо</h2></div>
      <div class="error-box" id="composeError"></div>
      <form id="composeForm">
        <input type="hidden" id="composeInReplyTo">
        <input type="hidden" id="composeReferences">
        <div class="field"><label>До * (може повече от един, разделени със запетая)</label><input type="text" id="composeTo" required placeholder="driver1@example.com, driver2@example.com"></div>
        <div class="field"><label>Копие (Cc)</label><input type="text" id="composeCc" placeholder="по избор, разделени със запетая"></div>
        <div class="field"><label>Тема *</label><input type="text" id="composeSubject" required></div>
        <div class="field"><label>Съобщение *</label><textarea id="composeText" rows="8" required></textarea></div>
        <div id="composeAttachNotice"></div>
        <div style="display:flex;gap:10px;margin-top:12px;">
          <button type="submit" class="btn btn-primary btn-sm">Изпрати</button>
          <button type="button" class="btn btn-ghost btn-sm" id="cancelComposeBtn">Отказ</button>
        </div>
      </form>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Писма</h2></div>
        <div class="mail-tabs">
          <button type="button" data-tab="inbox" class="active">Входящи</button>
          <button type="button" data-tab="sent">Изпратени</button>
          <label class="unread-toggle"><input type="checkbox" id="unreadOnlyToggle"> Само непрочетени</label>
        </div>
        <p class="mail-tab-hint" id="mailTabHint"></p>
        <div class="error-box" id="listError"></div>
        <div class="mail-list" id="mailListHost"><div class="loading">Зареждане…</div></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Писмо</h2></div>
        <div id="mailDetailHost"><p class="hint">Изберете писмо от списъка вляво.</p></div>
      </div>
    </div>
  `;

  document.getElementById('composeBtn').addEventListener('click', () => openCompose());
  document.getElementById('cancelComposeBtn').addEventListener('click', () => {
    document.getElementById('composePanel').classList.remove('show');
    FORWARD_ATTACHMENTS = [];
    REPLY_CONTEXT = null;
  });
  document.getElementById('refreshBtn').addEventListener('click', loadMessages);
  document.querySelectorAll('.mail-tabs button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  document.getElementById('unreadOnlyToggle').addEventListener('change', (e) => {
    FILTER_UNREAD = e.target.checked;
    renderList();
  });
  document.getElementById('composeForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('composeError');
    errorBox.classList.remove('show');
    const submitBtn = e.target.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      await Api.post('/api/mail/send', {
        to: document.getElementById('composeTo').value.trim(),
        cc: document.getElementById('composeCc').value.trim() || undefined,
        subject: document.getElementById('composeSubject').value.trim(),
        text: document.getElementById('composeText').value,
        inReplyTo: document.getElementById('composeInReplyTo').value || undefined,
        references: document.getElementById('composeReferences').value || undefined,
        attachments: FORWARD_ATTACHMENTS.length ? FORWARD_ATTACHMENTS : undefined,
        replyToUid: REPLY_CONTEXT ? REPLY_CONTEXT.uid : undefined,
        replyToFolder: REPLY_CONTEXT ? REPLY_CONTEXT.folder : undefined,
      });
      document.getElementById('composePanel').classList.remove('show');
      FORWARD_ATTACHMENTS = [];
      // локално отбелязваме оригинала като "отговорено" (↩ в списъка), без да
      // чакаме следващото опресняване — виж \Answered в lib/mail.js sendMail()
      if (REPLY_CONTEXT) {
        const m = MESSAGES.find(x => x.uid === REPLY_CONTEXT.uid && x.folder === REPLY_CONTEXT.folder);
        if (m) { m.answered = true; renderList(); }
        REPLY_CONTEXT = null;
      }
      alert('Писмото е изпратено.');
      if (CURRENT_TAB === 'sent') loadMessages();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    } finally {
      submitBtn.disabled = false;
    }
  });

  updateTabHint();
  await loadMessages();
  startMailAutoRefresh();
}
init();
</script>
</body>
</html>
