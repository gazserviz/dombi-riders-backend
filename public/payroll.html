<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заплати — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>(function(){try{if(localStorage.getItem('dombi_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div id="app-shell" data-active="/payroll.html" data-title="Заплати"></div>

<script src="/js/app.js"></script>
<script>
const PAID_LABELS = { true: ['Платено', 'badge-green'], false: ['Неплатено', 'badge-warn'] };
function paidBadge(paid) { const [label, cls] = PAID_LABELS[!!paid]; return `<span class="badge ${cls}">${label}</span>`; }
const PLATFORM_LABELS = { bolt: 'Bolt', glovo: 'Glovo' };
function platformBreakdownLine(e) {
  const pb = e.platform_breakdown;
  if (!pb || !Object.keys(pb).length) return '';
  return `<small>${Object.entries(pb).map(([k, v]) => `${PLATFORM_LABELS[k] || k}: ${fmtMoney(v)}`).join(' · ')}</small>`;
}
// за прозрачност показваме как точно е смятана процентната удръжка (вж.
// computeContractDeduction в lib/db.js) — "10% от 559.39 € = 55.94 €" вместо
// гола сума, за да може шофьорът да я провери сам при подписване
function deductionRateLine(e) {
  if (e.deduction_source !== 'percentage' || e.deduction_rate == null) return '';
  return `<small>${e.deduction_rate}% от ${fmtMoney(e.gross_earnings)}</small>`;
}
function signBadge(status) {
  if (status === 'signed_in_person' || status === 'signed_remote') return '<span class="badge badge-green">Потвърдено</span>';
  return '<span class="badge badge-muted">Непотвърдено</span>';
}

let CURRENT_USER = null;
let DIRECTORY = [];
// имена по ID за ВСИЧКИ служители (вкл. спрени/неактивни) — DIRECTORY идва от
// /api/wallet/directory, което показва само status:'active', затова таблицата
// с исторически седмични заплати на спрян служител иначе показва суровото ID
// вместо името му (виж loadPayrollStats)
let ALL_NAMES_BY_ID = {};
// пълни профили (за ЕГН/Bolt/Glovo ID под името в разбивката по служител —
// виж driverIdLine в app.js), само за admin/manager (виж init())
let ALL_PROFILES_BY_ID = {};
let selectedProfileId = null;
let earningsVisible = true;
// активният трудов договор на избрания служител в ръчната форма "Въведи
// седмица" — пазим го, за да преизчисляваме предложената удръжка на живо
// при промяна на заработката, ако договорът е процентен (вж.
// suggestDeductionFromGross по-долу и computeContractDeduction в lib/db.js)
let activeContractForEntryForm = null;
function suggestedDeductionFor(contract, gross) {
  if (!contract) return 0;
  if (contract.deduction_type !== 'percentage') return Number(contract.weekly_deduction_amount || 0);
  let rate = Number(contract.deduction_percentage || 0);
  if (contract.deduction_threshold_amount != null && contract.deduction_percentage_above_threshold != null
      && Number(gross || 0) >= Number(contract.deduction_threshold_amount)) {
    rate = Number(contract.deduction_percentage_above_threshold);
  }
  return Math.round(Number(gross || 0) * (rate / 100) * 100) / 100;
}

// 'admin'/'super_admin' може директно да маркира платено и да одобрява
// заявки за корекция (вж. 'payroll':'finalize' в permissions-catalog.js);
// 'manager' вижда записите, но промяна по вече записана седмица минава през
// заявка за одобрение (вж. openCorrectionRequestForm по-долу).
function canFinalizePayroll() { return ['admin', 'super_admin'].includes(CURRENT_USER.role); }
// бекендът вече разрешава 'request_correction' и на admin (вж.
// permissions-catalog.js, defaultRoles: ['admin','manager']) — бутонът тук
// преди беше заключен само за manager, без причина; разширено по изрично
// искане на потребителя "ако има нужда да се коригира да има възможност"
function canRequestCorrection() { return ['admin', 'manager', 'super_admin'].includes(CURRENT_USER.role); }

// изваден от loadEntries() в самостоятелна функция, за да може СЪЩАТА таблица
// (седмица/поръчки/заработка по платформа/удръжка/наем/нето + бутони за
// подпис/плащане/корекция) да се използва и в разгъващ се ред под служителя
// в "БЪРЗО ИЗПЛАЩАНЕ" (виж loadQuickPayDetail по-долу), не само в панела
// "Седмици на избрания служител" най-долу на страницата
function entriesTableHtml(entries, earningsVisible) {
  if (!entries.length) return `<p class="hint">Няма въведени седмици за този служител.</p>`;
  return `
    <div class="table-wrap"><table>
      <thead><tr>
        <th>Седмица</th><th>Брой поръчки</th><th>Оценъчен пробег</th>
        ${earningsVisible ? '<th>Заработка</th><th>Удръжка</th><th>Наем на кола</th><th>Нето</th>' : ''}
        <th>Потвърждение</th><th>Изплащане</th><th></th>
      </tr></thead>
      <tbody>
        ${entries.map(e => `
          <tr>
            <td>${weekRangeLabel(e.week_start, e.week_end)}</td>
            <td><strong>${e.order_count}</strong></td>
            <td>${e.estimated_km != null ? `${e.estimated_km} км` : '—'}</td>
            ${earningsVisible ? `
            <td><div class="stack">${fmtMoney(e.gross_earnings)}${platformBreakdownLine(e)}</div></td>
            <td><div class="stack">${fmtMoney(e.deduction_amount)}${deductionRateLine(e)}</div></td>
            <td>${fmtMoney(e.car_rent_amount)}</td>
            <td><strong>${fmtMoney(e.net_amount)}</strong></td>` : ''}
            <td><div class="stack">${signBadge(e.signature_status)}${e.signed_by_name ? `<small>${e.signed_by_name} · ${fmtDate(e.signed_at)}</small>` : ''}</div></td>
            <td>${paidBadge(e.paid)}</td>
            <td style="white-space:nowrap;">
              ${e.signature_status === 'none' ? `<button type="button" class="btn btn-primary btn-sm sign-btn" data-id="${e.id}">Подпиши</button>` : ''}
              ${(canFinalizePayroll() && !e.paid) ? `<button type="button" class="btn btn-ghost btn-sm mark-paid-btn" data-id="${e.id}">Маркирай платено</button>` : ''}
              ${canRequestCorrection() ? `<button type="button" class="btn btn-ghost btn-sm request-correction-btn" data-id="${e.id}">Заяви корекция</button>` : ''}
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>
    <div class="correctionFormHost"></div>`;
}

// wire-ва бутоните в HTML-а, върнат от entriesTableHtml() вътре в container;
// onChange() се вика след плащане/подпис (реално променя записа) — ПРИ заявка
// за корекция НЕ, защото тя сама по себе си не променя нищо до одобрение
function wireEntriesTable(container, entries, onChange) {
  container.querySelectorAll('.sign-btn').forEach(btn => {
    btn.addEventListener('click', () => openSignDialog(btn.dataset.id, onChange));
  });
  container.querySelectorAll('.mark-paid-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      try { await Api.post(`/api/hr/payroll/${btn.dataset.id}/mark-paid`, { paid: true }); await onChange(); }
      catch (err) { alert(err.message); }
    });
  });
  container.querySelectorAll('.request-correction-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const entry = entries.find(e => e.id === btn.dataset.id);
      openCorrectionRequestForm(entry, container.querySelector('.correctionFormHost'), onChange);
    });
  });
}

async function loadEntries() {
  const host = document.getElementById('entriesHost');
  const isAdmin = ['admin', 'manager', 'super_admin'].includes(CURRENT_USER.role);
  const profileId = isAdmin ? selectedProfileId : CURRENT_USER.id;
  if (!profileId) { host.innerHTML = `<p class="hint">Изберете служител.</p>`; return; }

  const { entries, earnings_visible } = await Api.get(`/api/hr/payroll?profile_id=${profileId}`);
  earningsVisible = earnings_visible !== false;
  host.innerHTML = entriesTableHtml(entries, earningsVisible);
  wireEntriesTable(host, entries, loadEntries);
}

// ---------------------------------------------------------------------------
// ЗАЯВКИ ЗА КОРЕКЦИЯ — мениджър предлага промяна по вече записана седмица,
// админ одобрява/отказва (вж. /api/hr/payroll/correction-requests* в
// server.js). Показваме секция с опашка само ако има какво да се види —
// за админ: чакащи за одобрение; за мениджър: собствените му заявки.
// ---------------------------------------------------------------------------
// host/onDone се подават изрично (вместо твърд document.getElementById('correctionFormHost'))
// защото от 2026-10-04 формата може да се отвори и вътре в разгънат ред на
// "БЪРЗО ИЗПЛАЩАНЕ" (виж loadQuickPayDetail по-долу) — там може да има
// няколко разгънати служителя едновременно, затова елементите вътре се
// адресират през host.querySelector, не през глобални id-та.
function openCorrectionRequestForm(entry, host, onDone) {
  onDone = onDone || loadEntries;
  if (!host || !entry) return;
  host.innerHTML = `
    <div class="panel" style="margin-top:10px;">
      <div class="panel-head"><h3>Заяви корекция — ${weekRangeLabel(entry.week_start, entry.week_end)}</h3></div>
      <p class="hint">Промяната НЕ се прилага веднага — изпраща се за одобрение от администратор.</p>
      <div class="error-box" data-role="correctionError"></div>
      <div class="field-row">
        <div class="field"><label>Брой поръчки</label><input data-role="corrOrders" type="number" min="0" value="${entry.order_count}"></div>
        <div class="field"><label>Заработка (€)</label><input data-role="corrGross" type="number" step="0.01" value="${entry.gross_earnings}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Удръжка (€)</label><input data-role="corrDeduction" type="number" step="0.01" value="${entry.deduction_amount}"></div>
        <div class="field"><label>Наем на кола (€)</label><input data-role="corrCarRent" type="number" step="0.01" value="${entry.car_rent_amount}"></div>
      </div>
      <div class="field"><label>Причина за корекцията *</label><textarea data-role="corrReason" rows="2" placeholder="напр. грешно въведена заработка от файла"></textarea></div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-primary btn-sm" data-role="corrSubmitBtn">Изпрати заявка</button>
        <button type="button" class="btn btn-ghost btn-sm" data-role="corrCancelBtn">Откажи</button>
      </div>
    </div>`;
  const q = (role) => host.querySelector(`[data-role="${role}"]`);
  q('corrCancelBtn').addEventListener('click', () => { host.innerHTML = ''; });
  q('corrSubmitBtn').addEventListener('click', async () => {
    const errorBox = q('correctionError');
    errorBox.classList.remove('show');
    const reason = q('corrReason').value.trim();
    if (!reason) { errorBox.textContent = 'Въведете причина за корекцията.'; errorBox.classList.add('show'); return; }
    const changes = {
      order_count: Number(q('corrOrders').value),
      gross_earnings: Number(q('corrGross').value),
      deduction_amount: Number(q('corrDeduction').value),
      car_rent_amount: Number(q('corrCarRent').value),
    };
    try {
      await Api.post('/api/hr/payroll/correction-requests', { payroll_entry_id: entry.id, requested_changes: changes, reason });
      host.innerHTML = `<p class="hint">Заявката е изпратена за одобрение.</p>`;
      await loadCorrectionRequests();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });
}

function correctionDiffLine(req) {
  const labels = { order_count: 'поръчки', gross_earnings: 'заработка', deduction_amount: 'удръжка', car_rent_amount: 'наем кола' };
  return Object.entries(req.requested_changes || {})
    .filter(([k, v]) => Number(req.before?.[k]) !== Number(v))
    .map(([k, v]) => `${labels[k] || k}: ${fmtMoney(req.before?.[k])} → <strong>${fmtMoney(v)}</strong>`)
    .join(', ') || 'няма промяна в сумите';
}

const CORRECTION_STATUS_BADGE = {
  pending: '<span class="badge badge-warn">Чака одобрение</span>',
  approved: '<span class="badge badge-green">Одобрена</span>',
  rejected: '<span class="badge badge-muted">Отказана</span>',
};

async function loadCorrectionRequests() {
  const panel = document.getElementById('correctionRequestsPanel');
  const host = document.getElementById('correctionRequestsHost');
  if (!panel || !host) return;
  const isAdmin = canFinalizePayroll();
  const { requests } = await Api.get(`/api/hr/payroll/correction-requests${isAdmin ? '?status=pending' : ''}`);
  if (!requests.length) {
    panel.style.display = isAdmin ? 'none' : (canRequestCorrection() ? 'block' : 'none');
    host.innerHTML = `<p class="hint">Няма изпратени заявки.</p>`;
    document.getElementById('correctionBadge').textContent = '';
    return;
  }
  panel.style.display = 'block';
  document.getElementById('correctionBadge').textContent = isAdmin ? ` (${requests.length})` : '';
  host.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Служител</th><th>Седмица</th><th>Промяна</th><th>Причина</th><th>Статус</th>${isAdmin ? '<th></th>' : ''}</tr></thead>
    <tbody>${requests.map(r => `
      <tr>
        <td>${ALL_NAMES_BY_ID[r.profile_id] || (DIRECTORY.find(u => u.id === r.profile_id) || {}).full_name || r.profile_id}</td>
        <td>${weekRangeLabel(r.week_start, r.week_end)}</td>
        <td><small>${correctionDiffLine(r)}</small></td>
        <td><small>${r.reason || ''}</small></td>
        <td>${CORRECTION_STATUS_BADGE[r.status] || r.status}</td>
        ${isAdmin ? `<td style="white-space:nowrap;">
          <button type="button" class="btn btn-primary btn-sm corr-approve-btn" data-id="${r.id}">Одобри</button>
          <button type="button" class="btn btn-ghost btn-sm corr-reject-btn" data-id="${r.id}">Откажи</button>
        </td>` : ''}
      </tr>`).join('')}
    </tbody></table></div>`;
  host.querySelectorAll('.corr-approve-btn').forEach(btn => btn.addEventListener('click', () => decideCorrection(btn.dataset.id, true)));
  host.querySelectorAll('.corr-reject-btn').forEach(btn => btn.addEventListener('click', () => decideCorrection(btn.dataset.id, false)));
}

async function decideCorrection(id, approve) {
  try {
    await Api.post(`/api/hr/payroll/correction-requests/${id}/decide`, { approve });
    await loadCorrectionRequests();
    await loadQuickPayReport();
    if (selectedProfileId) await loadEntries();
  } catch (err) { alert(err.message); }
}

// ---------------------------------------------------------------------------
// "БЪРЗО ИЗПЛАЩАНЕ" — основният работен изглед при влизане в страницата:
// филтър по период/град/мениджър/статус + компактна таблица с чекбоксове +
// едно копче за масово изплащане. Замества нуждата да се скролва надолу до
// старата статистика и да се избира служител по един, за да се провери/
// изплати (вж. оплакването на потребителя за "прекалено много скролване").
// ---------------------------------------------------------------------------
let QUICK_PAY_CITIES = [];
let QUICK_PAY_MANAGERS = [];

function populateQuickPayFilters() {
  const citySelect = document.getElementById('qpCity');
  const managerSelect = document.getElementById('qpManager');
  citySelect.innerHTML = `<option value="">Всички градове</option>` + QUICK_PAY_CITIES.map(c => `<option value="${c}">${c}</option>`).join('');
  managerSelect.innerHTML = `<option value="">Всички мениджъри</option>` + QUICK_PAY_MANAGERS.map(m => `<option value="${m.id}">${m.full_name}</option>`).join('');
}

async function initQuickPayPanel() {
  const from = document.getElementById('qpFrom');
  const to = document.getElementById('qpTo');
  from.value = addDaysStr(currentWeekStart(), -7 * 8);
  to.value = todayStr();
  mountPeriodPicker(document.getElementById('qpPeriodPicker'), from, to, { useMonthPreset: true, onApply: loadQuickPayReport });

  try {
    const { employees } = await Api.get('/api/hr/personnel');
    QUICK_PAY_CITIES = [...new Set(employees.map(e => e.city).filter(Boolean))].sort();
    QUICK_PAY_MANAGERS = employees.filter(e => ['manager', 'admin', 'super_admin'].includes(e.role));
  } catch (e) { /* незадължително — филтрите просто остават празни */ }
  populateQuickPayFilters();

  ['qpCity', 'qpManager', 'qpStatus'].forEach(id => document.getElementById(id).addEventListener('change', loadQuickPayReport));
  document.getElementById('qpRefreshBtn').addEventListener('click', loadQuickPayReport);
  document.getElementById('qpSelectAllUnpaid').addEventListener('click', () => {
    document.querySelectorAll('.qp-row-check').forEach(cb => { if (cb.dataset.unpaid === '1') cb.checked = true; });
    updateQuickPaySelection();
  });
  document.getElementById('qpPayBtn').addEventListener('click', payQuickPaySelection);
  await loadQuickPayReport();
}

function updateQuickPaySelection() {
  const checked = Array.from(document.querySelectorAll('.qp-row-check:checked'));
  const sum = checked.reduce((s, cb) => s + Number(cb.dataset.unpaidAmount || 0), 0);
  const btn = document.getElementById('qpPayBtn');
  btn.disabled = checked.length === 0;
  btn.textContent = checked.length ? `Изплати избраните (${checked.length}) — ${fmtMoney(sum)}` : 'Изплати избраните';
}

async function payQuickPaySelection() {
  const checked = Array.from(document.querySelectorAll('.qp-row-check:checked'));
  const ids = checked.flatMap(cb => JSON.parse(cb.dataset.unpaidIds || '[]'));
  if (!ids.length) return;
  if (!confirm(`Маркирай ${ids.length} седмичен(ни) запис(а) като платени?`)) return;
  const btn = document.getElementById('qpPayBtn');
  btn.disabled = true;
  try {
    await Api.post('/api/hr/payroll/bulk-pay', { ids });
    await loadQuickPayReport();
  } catch (err) { alert(err.message); }
  finally { btn.disabled = false; }
}

async function loadQuickPayReport() {
  const host = document.getElementById('qpReportHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const params = new URLSearchParams();
  const from = document.getElementById('qpFrom').value;
  const to = document.getElementById('qpTo').value;
  const city = document.getElementById('qpCity').value;
  const managerId = document.getElementById('qpManager').value;
  const status = document.getElementById('qpStatus').value;
  if (from) params.set('week_start', from);
  if (to) params.set('week_end', to);
  if (city) params.set('city', city);
  if (managerId) params.set('manager_id', managerId);
  if (status) params.set('status', status);
  try {
    const { rows, totals } = await Api.get(`/api/hr/payroll/report?${params}`);
    document.getElementById('qpTotalsHost').innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Общо за периода</div><div class="value">${fmtMoney(totals.total_net)}</div></div>
        <div class="stat-card"><div class="label">Изплатено</div><div class="value green">${fmtMoney(totals.paid_amount)}</div></div>
        <div class="stat-card"><div class="label">Остава да се плати</div><div class="value ${totals.unpaid_amount > 0 ? 'warn' : ''}">${fmtMoney(totals.unpaid_amount)}</div></div>
      </div>`;
    if (!rows.length) { host.innerHTML = `<p class="hint">Няма записи за избрания филтър.</p>`; return; }
    host.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th></th><th></th><th>Служител</th><th>Град</th><th>Мениджър</th><th>Седмици</th><th>Общо нето</th><th>Платено</th><th>Остава</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr class="qp-main-row">
          <td>${r.unpaid_amount > 0.005 ? `<input type="checkbox" class="qp-row-check" data-unpaid="1" data-unpaid-amount="${r.unpaid_amount}" data-unpaid-ids='${JSON.stringify(r.unpaid_entry_ids)}'>` : ''}</td>
          <td><button type="button" class="btn btn-ghost btn-sm qp-expand-toggle" data-id="${r.profile_id}" title="Заработки по седмици и платформи" style="padding:1px 7px;font-size:.72rem;">${QP_EXPANDED.has(r.profile_id) ? '▾' : '▸'}</button></td>
          <td><a class="employee-name-link" href="/personnel-detail.html?id=${r.profile_id}">${r.full_name}</a></td>
          <td>${r.city || '—'}</td>
          <td>${r.manager_name || '—'}</td>
          <td>${r.weeks_count}</td>
          <td><strong>${fmtMoney(r.total_net)}</strong></td>
          <td>${fmtMoney(r.paid_amount)}</td>
          <td>${r.unpaid_amount > 0.005 ? `<strong style="color:var(--warn);">${fmtMoney(r.unpaid_amount)}</strong>` : fmtMoney(r.unpaid_amount)}</td>
        </tr>
        <tr class="qp-detail-row" data-profile="${r.profile_id}" style="display:${QP_EXPANDED.has(r.profile_id) ? '' : 'none'};">
          <td colspan="9" style="background:var(--panel-2,rgba(255,255,255,.02));">
            <div class="qp-detail-host" data-profile="${r.profile_id}">${QP_EXPANDED.has(r.profile_id) ? '<div class="loading">Зареждане…</div>' : ''}</div>
          </td>
        </tr>`).join('')}
      </tbody></table></div>`;
    host.querySelectorAll('.qp-row-check').forEach(cb => cb.addEventListener('change', updateQuickPaySelection));
    updateQuickPaySelection();
    host.querySelectorAll('.qp-expand-toggle').forEach(btn => {
      btn.addEventListener('click', () => toggleQuickPayDetail(btn.dataset.id));
    });
    // презарежда вече разгънатите (напр. след плащане/одобрена корекция),
    // за да не се налага администраторът да ги отваря наново всеки път
    QP_EXPANDED.forEach(profileId => loadQuickPayDetail(profileId));
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

// ---------------------------------------------------------------------------

function setupSignatureCanvas(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#15181f';
  let drawing = false, hasStroke = false;
  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return { x: (point.clientX - rect.left) * scaleX, y: (point.clientY - rect.top) * scaleY };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e) { if (!drawing) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); hasStroke = true; }
  function end() { drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);
  return {
    clear() { ctx.clearRect(0, 0, canvas.width, canvas.height); hasStroke = false; },
    hasSignature: () => hasStroke,
    toDataUrl: () => canvas.toDataURL('image/png'),
  };
}

      <canvas id="signCanvas" width="320" height="130" style="display:block;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair;max-width:100%;"></canvas>

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result); // "data:<mime>;base64,...."
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadPayrollStats() {
  const host = document.getElementById('payrollStatsHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const from = document.getElementById('statsFrom').value;
  const to = document.getElementById('statsTo').value;
  try {
    // без profile_id -> връща записите на ВСИЧКИ служители (само за админ/мениджър)
    const { entries } = await Api.get('/api/hr/payroll');
    const periodEntries = entries.filter(e => (!from || e.week_start >= from) && (!to || e.week_start <= to));
    const totalOrders = periodEntries.reduce((s, e) => s + Number(e.order_count || 0), 0);
    const totalGross = periodEntries.reduce((s, e) => s + Number(e.gross_earnings || 0), 0);
    const totalDeduction = periodEntries.reduce((s, e) => s + Number(e.deduction_amount || 0), 0);
    const totalCarRent = periodEntries.reduce((s, e) => s + Number(e.car_rent_amount || 0), 0);
    const totalNet = periodEntries.reduce((s, e) => s + Number(e.net_amount || 0), 0);
    const totalPaid = periodEntries.filter(e => e.paid).reduce((s, e) => s + Number(e.net_amount || 0), 0);
    const totalUnpaid = totalNet - totalPaid;

    const platformTotals = {};
    periodEntries.forEach(e => {
      if (!e.platform_breakdown) return;
      Object.entries(e.platform_breakdown).forEach(([k, v]) => { platformTotals[k] = (platformTotals[k] || 0) + Number(v || 0); });
    });

    // разбивка по служител — кой колко има за периода и какво остава да му се плати
    const byProfile = new Map();
    periodEntries.forEach(e => {
      if (!byProfile.has(e.profile_id)) byProfile.set(e.profile_id, { orders: 0, gross: 0, deduction: 0, carRent: 0, net: 0, paid: 0, weeks: 0 });
      const row = byProfile.get(e.profile_id);
      row.orders += Number(e.order_count || 0);
      row.gross += Number(e.gross_earnings || 0);
      row.deduction += Number(e.deduction_amount || 0);
      row.carRent += Number(e.car_rent_amount || 0);
      row.net += Number(e.net_amount || 0);
      if (e.paid) row.paid += Number(e.net_amount || 0);
      row.weeks += 1;
    });
    const nameById = Object.keys(ALL_NAMES_BY_ID).length
      ? ALL_NAMES_BY_ID
      : Object.fromEntries(DIRECTORY.map(u => [u.id, u.full_name]));
    const profileRows = [...byProfile.entries()]
      .map(([id, r]) => ({ id, name: nameById[id] || id, ...r, unpaid: r.net - r.paid }))
      .sort((a, b) => b.unpaid - a.unpaid);

    host.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Служители с данни</div><div class="value">${byProfile.size}</div></div>
        <div class="stat-card"><div class="label">Общо поръчки</div><div class="value">${totalOrders}</div></div>
        <div class="stat-card"><div class="label">Обща заработка (шофьори)</div><div class="value">${fmtMoney(totalGross)}</div></div>
        <div class="stat-card"><div class="label">Приход за фирмата (удръжки)</div><div class="value green">${fmtMoney(totalDeduction)}</div></div>
        <div class="stat-card"><div class="label">Приход от наем на коли</div><div class="value green">${fmtMoney(totalCarRent)}</div></div>
        <div class="stat-card"><div class="label">Изплатено на служители</div><div class="value green">${fmtMoney(totalPaid)}</div></div>
        <div class="stat-card"><div class="label">Остава да се плати</div><div class="value ${totalUnpaid > 0 ? 'warn' : ''}">${fmtMoney(totalUnpaid)}</div></div>
      </div>
      ${Object.keys(platformTotals).length ? `<p class="hint">По платформа: ${Object.entries(platformTotals).map(([k, v]) => `<strong>${PLATFORM_LABELS[k] || k}</strong>: ${fmtMoney(v)}`).join(' · ')}</p>` : ''}
      <p class="hint">„Приход за фирмата“ и „Приход от наем на коли“ са само седмичните удръжки от шофьорите — не е пълна печалба/загуба на фирмата (не включва разходи по коли, сервиз, партньорски комисионни и др.). Наемът на коли постъпва и в <a href="/cashier.html">общата каса</a>. За пълния отчет с всички разходи виж <a href="/finance.html">Счетоводство</a>.</p>
      ${profileRows.length ? `
      <div class="table-wrap" style="margin-top:10px;"><table>
        <thead><tr><th>Служител</th><th>Седмици</th><th>Поръчки</th><th>Заработка</th><th>Удръжка</th><th>Наем на кола</th><th>За изплащане</th><th>Платено</th><th>Остава</th></tr></thead>
        <tbody>
          ${profileRows.map(r => `
            <tr>
              <td><a class="employee-name-link" href="/personnel-detail.html?id=${r.id}">${r.name}</a>${driverIdLine(ALL_PROFILES_BY_ID[r.id] || {})}</td>
              <td>${r.weeks}</td>
              <td>${r.orders}</td>
              <td>${fmtMoney(r.gross)}</td>
              <td>${fmtMoney(r.deduction)}</td>
              <td>${fmtMoney(r.carRent)}</td>
              <td><strong>${fmtMoney(r.net)}</strong></td>
              <td>${fmtMoney(r.paid)}</td>
              <td>${r.unpaid > 0.005 ? `<strong style="color:var(--warn);">${fmtMoney(r.unpaid)}</strong>` : fmtMoney(r.unpaid)}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>` : `<p class="hint">Няма записи за избрания период.</p>`}
    `;
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

      <div class="panel-head"><h2>🔔 Заявки за корекция<span id="correctionBadge"></span></h2></div>
      <p class="hint">${canFinalizePayroll() ? 'Промени по вече записани седмици, предложени от колеги — изискват твоето одобрение.' : 'Собствените ти изпратени заявки за корекция.'}</p>
      <div id="correctionRequestsHost" class="loading">Зареждане…</div>
    </div>` : ''}

    ${isAdmin ? `
    <details id="advancedToolsDetails">
      <summary class="panel-head" style="cursor:pointer;"><h2 style="display:inline;">Разширени инструменти — ръчно въвеждане, импорт, пълна статистика</h2></summary>

    <div class="panel" id="settingsPanel">
      <div class="panel-head"><h2>Настройки — оценъчен пробег</h2></div>
      <p class="hint">Средна стойност километри на поръчка, по която се изчислява „Оценъчен пробег“ в седмичните протоколи — пробегът НЕ е от одометър/GPS, а оценка по формулата брой поръчки × тази стойност. Използва се, за да могат подписаните от шофьорите седмични протоколи да служат като документална база за фактурите по гориво и части.</p>
      <div class="error-box" id="settingsError"></div>
      <form id="settingsForm" class="field-row">
        <div class="field"><label>Км на поръчка</label><input name="avg_km_per_order" type="number" step="0.1" min="0" id="avgKmInput"></div>
        <div class="field" style="align-self:flex-end;"><button type="submit" class="btn btn-primary btn-sm">Запази</button></div>
      </form>
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Избери служител</h2></div>
        <div class="field"><select id="employeeSelect">
          <option value="">— избери —</option>
          ${DIRECTORY.map(u => `<option value="${u.id}">${u.full_name}</option>`).join('')}
        </select></div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Въведи седмица</h2></div>
        <div class="error-box" id="entryError"></div>
        <form id="entryForm">
          <div id="entryPeriodPicker"></div>
          <div class="field-row">
            <div class="field"><label>Начало на седмица *</label><input name="week_start" type="date" required></div>
            <div class="field"><label>Край на седмица *</label><input name="week_end" type="date" required></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Брой поръчки *</label><input name="order_count" type="number" min="0" required></div>
            <div class="field"><label>Заработка (€)</label><input name="gross_earnings" type="number" step="0.01" min="0"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Удръжка по договор (€) — по подразбиране от трудовия договор, може да се промени ръчно</label><input name="deduction_amount" type="number" step="0.01" min="0"></div>
            <div class="field"><label>Наем на кола (€) — по подразбиране от активния договор за наем, може да се промени ръчно</label><input name="car_rent_amount" type="number" step="0.01" min="0"></div>
          </div>
          <p class="hint">И двете се удържат от заработката на шофьора. Наемът на колата се отчита към статистиката на колата и постъпва автоматично в <a href="/cashier.html">общата каса</a>.</p>
          <button type="submit" class="btn btn-primary btn-sm">Запази седмицата</button>
        </form>
      </div>
    </div>

    <div class="panel" id="importPanel">
      <div class="panel-head"><h2>Импорт от Bolt / Glovo (реален седмичен файл)</h2></div>
      <p class="hint">Качете оригиналния .xlsx експорт от Bolt Food или Glovo (Freestreets BG) за дадена седмица — системата ще опита да съпостави куриерите със съществуващи профили по телефон и ще предложи преглед преди запис. Заработката се изчислява като сумата, изкарана от шофьора вкл. бакшишите, без ДДС.</p>
      <div class="error-box" id="importError"></div>
      <div id="importUnavailable" class="hint" style="display:none;color:var(--warn,#c99);">Импортът не е наличен в момента (липсва пакетът за четене на Excel файлове в тази среда).</div>
      <div id="importControls" class="field-row">
        <div class="field"><label>Платформа *</label>
          <select id="importPlatform"><option value="glovo">Glovo</option><option value="bolt">Bolt Food</option></select>
        </div>
        <div class="field"><label>Файл (.xlsx) *</label><input id="importFile" type="file" accept=".xlsx,.xls"></div>
      </div>
      <div id="importWeekFields" style="display:none;">
        <div id="importPeriodPicker"></div>
        <div class="field-row">
          <div class="field"><label>Начало на седмица *</label><input id="importWeekStart" type="date"></div>
          <div class="field"><label>Край на седмица *</label><input id="importWeekEnd" type="date"></div>
        </div>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="importPreviewBtn">Прегледай файла</button>
      <div id="importPreviewHost" style="margin-top:14px;"></div>
    </div>

    <div class="panel" id="importHistoryPanel">
      <div class="panel-head"><h2>История на качванията</h2></div>
      <div id="importHistoryHost" class="loading">Зареждане…</div>
    </div>

    <div class="panel" id="statsPanel">
      <div class="panel-head"><h2>Статистика за периода (всички служители)</h2></div>
      <div id="statsPeriodPicker"></div>
      <div class="field-row">
        <div class="field"><label>От (седмица, начало)</label><input type="date" id="statsFrom"></div>
        <div class="field"><label>До (седмица, начало)</label><input type="date" id="statsTo"></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="statsRefreshBtn">Обнови</button>
      <div id="payrollStatsHost" style="margin-top:14px;" class="loading">Зареждане…</div>
    </div>
    </details>` : ''}

    <div class="panel">
      <div class="panel-head"><h2>${isAdmin ? 'Седмици на избрания служител' : 'Моите седмици'}</h2></div>
      <div id="entriesHost" class="loading">${isAdmin ? 'Изберете служител отгоре.' : 'Зареждане…'}</div>
    </div>
    <div id="signModalHost"></div>
  `;

  if (isAdmin) {
    await initQuickPayPanel();
    await loadCorrectionRequests();
    await initSettingsPanel();
    await initImportPanel();
    await loadPayrollImportHistory();
    await initPayrollStatsPanel();
    const select = document.getElementById('employeeSelect');
    select.addEventListener('change', async () => {
      selectedProfileId = select.value || null;
      if (!selectedProfileId) { document.getElementById('entriesHost').innerHTML = `<p class="hint">Изберете служител.</p>`; return; }
      document.getElementById('entriesHost').innerHTML = `<div class="loading">Зареждане…</div>`;
      // предложи удръжка по подразбиране от активния трудов договор, и наем по
      // подразбиране от активния договор за наем на кола на избрания служител
      try {
        const { employment_contracts, rental_contracts } = await Api.get(`/api/hr/personnel/${selectedProfileId}`);
        const active = employment_contracts.find(c => c.status === 'active') || employment_contracts[0];
        activeContractForEntryForm = active || null;
        const deductionField = document.querySelector('#entryForm input[name="deduction_amount"]');
        const grossField = document.querySelector('#entryForm input[name="gross_earnings"]');
        if (deductionField) deductionField.dataset.auto = '1';
        if (active && deductionField && !deductionField.value) {
          deductionField.value = suggestedDeductionFor(active, grossField ? grossField.value : 0);
        }
        const activeRental = (rental_contracts || []).find(c => c.status === 'active');
        const rentField = document.querySelector('#entryForm input[name="car_rent_amount"]');
        // договорът за наем на кола може да е на седмица, месец или ден
        // (виж contract-new.html/assignments.html) — тук винаги удържаме
        // СЕДМИЧНО от заплатата, затова конвертираме към седмичен еквивалент;
        // преди този фикс полето взимаше суровия rate_amount, което за
        // месечен наем удържаше 4+ пъти повече от реалната седмична вноска
        // (напр. €600/месец се удържаше като €600/седмица вместо ~€140).
        if (activeRental && rentField && !rentField.value) {
          const RATE_PERIOD_DAYS = { day: 1, week: 7, month: 30 };
          const days = RATE_PERIOD_DAYS[activeRental.rate_period] || 7;
          rentField.value = Math.round((Number(activeRental.rate_amount || 0) / days) * 7 * 100) / 100;
        }
      } catch (e) { /* незадължително */ }
      await loadEntries();
    });

    const startField = document.querySelector('#entryForm input[name="week_start"]');
    const endField = document.querySelector('#entryForm input[name="week_end"]');
    mountPeriodPicker(document.getElementById('entryPeriodPicker'), startField, endField);
    // по подразбиране предходната (последната приключила) седмица — най-често
    // въвежданата — за по-бързо навигиране, вместо да се тръгва от празно
    startField.value = previousWeekStart();
    endField.value = addDaysStr(startField.value, 6);

    // при процентна удръжка заработката се въвежда в СЪЩАТА форма, затова
    // предложената удръжка трябва да се преизчислява на живо докато пишете
    // заработката — само докато полето за удръжка остава недокоснато
    // ("автоматично"); щом администраторът го редактира ръчно, спираме да го
    // пипаме (вж. deductionField.dataset.auto).
    const grossField = document.querySelector('#entryForm input[name="gross_earnings"]');
    const deductionField = document.querySelector('#entryForm input[name="deduction_amount"]');
    if (deductionField) deductionField.addEventListener('input', () => { deductionField.dataset.auto = '0'; });
    if (grossField) grossField.addEventListener('input', () => {
      if (deductionField && deductionField.dataset.auto === '1' && activeContractForEntryForm) {
        deductionField.value = suggestedDeductionFor(activeContractForEntryForm, grossField.value);
      }
    });

    document.getElementById('entryForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('entryError');
      errorBox.classList.remove('show');
      if (!selectedProfileId) { errorBox.textContent = 'Изберете служител.'; errorBox.classList.add('show'); return; }
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.profile_id = selectedProfileId;
      try {
        await Api.post('/api/hr/payroll', data);
        await loadEntries();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  } else {
    await loadEntries();
  }
}
init();
</script>
</body>
</html>
