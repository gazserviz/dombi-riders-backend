<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Партньорски комисионни — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>(function(){try{if(localStorage.getItem('dombi_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div id="app-shell" data-active="/partners.html" data-title="Партньорски комисионни"></div>

<script src="/js/app.js"></script>
<script>
const COMP_TYPE_LABELS = { percentage: 'Процент', fixed: 'Фиксирана сума', tiered_percentage: 'Стъпаловиден процент', per_active_driver: 'На активен шофьор' };
const PERIOD_LABELS = { day: 'ден', week: 'седмица', month: 'месец' };

let CURRENT_USER = null;
let PARTNERS = [];
let selectedId = null;
let LAST_STATS = null;
let searchTimer = null;
let lastSearchQuery = '';

function compSummary(c) {
  if (!c || !c.active) return '<span class="badge badge-muted">Не е зададена</span>';
  if (c.comp_type === 'fixed' && c.fixed_amount) {
    return `<span class="badge badge-green">${fmtMoney(c.fixed_amount)} / ${PERIOD_LABELS[c.fixed_period] || c.fixed_period}</span>`;
  }
  if (c.comp_type === 'percentage' && c.percentage) {
    return `<span class="badge badge-green">${c.percentage}%</span>`;
  }
  if (c.comp_type === 'tiered_percentage' && c.tiers && c.tiers.length) {
    return `<span class="badge badge-green">Стъпаловиден (${c.tiers.length} транша)</span>`;
  }
  if (c.comp_type === 'per_active_driver' && c.per_driver_amount) {
    return `<span class="badge badge-green">${fmtMoney(c.per_driver_amount)} / активен шофьор (&gt; ${c.qualifying_threshold != null ? c.qualifying_threshold : 30} € седмично)</span>`;
  }
  return '<span class="badge badge-muted">Не е зададена</span>';
}

async function loadPartners() {
  const host = document.getElementById('partnersHost');
  const { partners } = await Api.get('/api/hr/partners');
  PARTNERS = partners;
  if (!partners.length) {
    host.innerHTML = `<p class="hint">Няма зададени партньори все още — потърсете служител по-долу и задайте му комисионна. Може да е всеки, без значение от ролята му в системата.</p>`;
    return;
  }
  host.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr><th>Партньор</th><th>Роля</th><th>Екип (шофьори)</th><th>Комисионна</th><th></th></tr></thead>
      <tbody>
        ${partners.map(p => `
          <tr>
            <td><div class="stack"><strong>${escapeHtml(p.full_name)}</strong><small>${escapeHtml(p.email)}</small></div></td>
            <td>${ROLE_LABELS[p.role] || p.role}</td>
            <td>${p.team_size}</td>
            <td>${compSummary(p.commission)}</td>
            <td><button type="button" class="btn btn-ghost btn-sm select-partner-btn" data-id="${p.id}" data-name="${escapeHtml(p.full_name)}">Настрой →</button></td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  host.querySelectorAll('.select-partner-btn').forEach(btn => {
    btn.addEventListener('click', () => selectPartner(btn.dataset.id, btn.dataset.name));
  });
}

// търсене/добавяне на НОВ партньор — всеки служител, без значение от ролята
// му; показва първите, ако полето е празно, за да не остава страницата без
// видим бутон "Добави", преди да е въведено нещо (виж аналогичната логика
// в fixed-salaries.html)
async function runSearch(q) {
  lastSearchQuery = q || '';
  const host = document.getElementById('searchResults');
  const { results } = await Api.get(`/api/hr/partners/search?q=${encodeURIComponent(q || '')}`);
  if (!results.length) { host.innerHTML = '<p class="hint">Няма съвпадения.</p>'; return; }
  host.innerHTML = `
    ${!q ? '<p class="hint">Първите служители — потърсете по-горе за по-точен резултат.</p>' : ''}
    <div class="table-wrap"><table>
      <tbody>
        ${results.map(r => `
          <tr>
            <td><div class="stack"><strong>${escapeHtml(r.full_name)}</strong><small>${escapeHtml(r.email)} · ${ROLE_LABELS[r.role] || r.role}</small></div></td>
            <td style="text-align:right;"><button type="button" class="btn btn-ghost btn-sm search-pick-btn" data-id="${r.id}" data-name="${escapeHtml(r.full_name)}">${r.has_commission ? 'Отвори →' : '+ Добави партньор'}</button></td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
  host.querySelectorAll('.search-pick-btn').forEach(btn => {
    btn.addEventListener('click', () => selectPartner(btn.dataset.id, btn.dataset.name));
  });
}

function fillCommissionForm(c) {
  const form = document.getElementById('commissionForm');
  form.comp_type.value = (c && c.comp_type) || 'percentage';
  form.percentage.value = (c && c.percentage != null) ? c.percentage : '';
  form.fixed_amount.value = (c && c.fixed_amount != null) ? c.fixed_amount : '';
  form.fixed_period.value = (c && c.fixed_period) || 'month';
  form.per_driver_amount.value = (c && c.per_driver_amount != null) ? c.per_driver_amount : '';
  form.qualifying_threshold.value = (c && c.qualifying_threshold != null) ? c.qualifying_threshold : 30;
  form.team_qualifying_goal.value = (c && c.team_qualifying_goal != null) ? c.team_qualifying_goal : '';
  form.notes.value = (c && c.notes) || '';
  form.active.checked = c ? c.active !== false : true;
  renderTierRows((c && c.tiers) || []);
  toggleCompFields();
}

// стъпаловидна комисионна — динамични редове {от заработка на екипа €, %}
function renderTierRows(tiers) {
  const host = document.getElementById('tierRowsHost');
  const rows = tiers.length ? tiers : [{ from: 0, rate: '' }];
  host.innerHTML = rows.map((t, i) => `
    <div class="field-row tier-row" style="align-items:flex-end;">
      <div class="field"><label>${i === 0 ? 'От (€)' : 'От (€)'}</label><input type="number" step="0.01" min="0" class="tier-from" value="${t.from != null ? t.from : ''}"></div>
      <div class="field"><label>Процент (%)</label><input type="number" step="0.01" min="0" max="100" class="tier-rate" value="${t.rate != null ? t.rate : ''}"></div>
      <div class="field"><button type="button" class="btn btn-ghost btn-sm remove-tier-btn">✕</button></div>
    </div>`).join('');
  host.querySelectorAll('.remove-tier-btn').forEach(btn => {
    btn.addEventListener('click', () => { btn.closest('.tier-row').remove(); });
  });
}

function collectTiers() {
  return [...document.querySelectorAll('#tierRowsHost .tier-row')]
    .map(row => ({ from: Number(row.querySelector('.tier-from').value || 0), rate: Number(row.querySelector('.tier-rate').value || 0) }))
    .filter(t => t.rate > 0);
}

function toggleCompFields() {
  const form = document.getElementById('commissionForm');
  const type = form.comp_type.value;
  document.getElementById('percentageField').style.display = type === 'percentage' ? '' : 'none';
  document.getElementById('fixedFields').style.display = type === 'fixed' ? '' : 'none';
  document.getElementById('tieredFields').style.display = type === 'tiered_percentage' ? '' : 'none';
  document.getElementById('perActiveDriverFields').style.display = type === 'per_active_driver' ? '' : 'none';
  document.getElementById('perActiveDriverHint').style.display = type === 'per_active_driver' ? '' : 'none';
  document.getElementById('teamGoalField').style.display = type === 'per_active_driver' ? 'none' : '';
}

async function loadStats() {
  const statsHost = document.getElementById('statsHost');
  statsHost.innerHTML = `<div class="loading">Зареждане…</div>`;
  const from = document.getElementById('statsFrom').value;
  const to = document.getElementById('statsTo').value;
  const qs = new URLSearchParams();
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);
  const stats = await Api.get(`/api/hr/partners/${selectedId}/stats?${qs.toString()}`);
  const isPerActiveDriver = stats.commission && stats.commission.comp_type === 'per_active_driver';
  const isTiered = stats.commission && stats.commission.comp_type === 'tiered_percentage';
  const goalLine = stats.team_qualifying_goal != null
    ? `<p class="hint">🎯 Цел за екипа: ${fmtMoney(stats.team_qualifying_goal)} — ${stats.goal_met ? '<strong style="color:var(--green,#4dff7a)">постигната ✓, комисионната се дължи</strong>' : '<strong>все още не е постигната — комисионна не се дължи за този период</strong>'}.</p>`
    : '';
  statsHost.innerHTML = `
    <p class="hint">⚠️ Базата за изчисление засега е заработката (заплати) на екипа за периода — приблизителна демонстрационна стойност, докато не бъде готов импортът на реалните таблици с поръчки/приходи. Не е окончателна счетоводна сума.</p>
    ${goalLine}
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Шофьори в екипа</div><div class="value">${stats.team_size}</div></div>
      <div class="stat-card"><div class="label">Отчетени седмици</div><div class="value">${stats.weeks_covered}</div></div>
      <div class="stat-card"><div class="label">Общо поръчки</div><div class="value">${stats.total_orders}</div></div>
      <div class="stat-card"><div class="label">Заработка на екипа</div><div class="value">${fmtMoney(stats.total_gross_earnings)}</div></div>
      ${isPerActiveDriver ? `<div class="stat-card"><div class="label">Активни шофьор-седмици (&gt; ${stats.qualifying_threshold} €)</div><div class="value">${stats.total_qualifying_driver_weeks}</div></div>` : ''}
      <div class="stat-card"><div class="label">Дължима комисионна</div><div class="value green">${fmtMoney(stats.commission_owed)}</div></div>
    </div>
    ${isTiered && stats.tier_breakdown && stats.tier_breakdown.length ? `
    <div class="table-wrap" style="margin-top:14px;">
      <table>
        <thead><tr><th>Транш</th><th>Ставка</th><th>Сума в транша</th><th>Дължимо</th></tr></thead>
        <tbody>
          ${stats.tier_breakdown.map(t => `
            <tr>
              <td>${fmtMoney(t.from)} – ${t.to != null ? fmtMoney(t.to) : '∞'}</td>
              <td>${t.rate}%</td>
              <td>${fmtMoney(t.amount_in_tier)}</td>
              <td><strong>${fmtMoney(t.owed)}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}
    ${isPerActiveDriver && stats.per_active_driver_breakdown && stats.per_active_driver_breakdown.length ? `
    <div class="table-wrap" style="margin-top:14px;">
      <table>
        <thead><tr><th>Седмица</th><th>Шофьори в екипа тази седмица</th><th>Активни (&gt; ${stats.qualifying_threshold} €)</th></tr></thead>
        <tbody>
          ${stats.per_active_driver_breakdown.map(w => `
            <tr>
              <td>${weekRangeLabel(w.week_start)}</td>
              <td>${w.team_size_that_week}</td>
              <td><strong>${w.qualifying_count}</strong></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : ''}`;
  LAST_STATS = stats;
}

function paymentsHtml(payments) {
  if (!payments.length) return '<p class="hint">Няма платени комисионни за този партньор все още.</p>';
  return `
    <div class="table-wrap"><table>
      <thead><tr><th>Платено на</th><th>Период</th><th>Сума</th><th>Бележка</th></tr></thead>
      <tbody>
        ${payments.map(p => `
          <tr>
            <td>${fmtDateTime(p.paid_at)}</td>
            <td>${fmtDate(p.period_from)} – ${fmtDate(p.period_to)}</td>
            <td><strong>${fmtMoney(p.amount)}</strong></td>
            <td>${p.note || ''}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
}

async function loadPayments() {
  const host = document.getElementById('paymentsHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const { payments } = await Api.get(`/api/hr/partners/${selectedId}/commission-payments`);
  host.innerHTML = paymentsHtml(payments);
}

function prefillPaymentForm() {
  const form = document.getElementById('paymentForm');
  if (!form) return;
  const from = document.getElementById('statsFrom').value;
  const to = document.getElementById('statsTo').value;
  if (from) form.period_from.value = from;
  if (to) form.period_to.value = to;
  if (LAST_STATS && LAST_STATS.commission_owed != null) form.amount.value = LAST_STATS.commission_owed;
}

// приема и id, и (незадължително) вече известно име — за мигновен loading
// текст, докато заявката върви; работи еднакво за ред от таблицата
// "Партньори" и за резултат от търсачката (вкл. служител без комисионна
// все още) — винаги взима пресни данни от /api/hr/partners/:id.
async function selectPartner(id, name) {
  selectedId = id;
  document.getElementById('detailHost').style.display = '';
  document.getElementById('detailTitle').textContent = `Партньор: ${name || '…'}`;
  const { profile, commission, team } = await Api.get(`/api/hr/partners/${id}`);
  document.getElementById('detailTitle').textContent = `Партньор: ${profile.full_name}`;
  document.getElementById('teamSizeHint').textContent = team.length
    ? `Текущ екип: ${team.length} зачислен(и) шофьор(и).`
    : 'Все още няма зачислени шофьори към този профил (виж „Досиета на служители“ → „Зачисли към мениджър“).';
  fillCommissionForm(commission);
  await loadStats();
  prefillPaymentForm();
  await loadPayments();
}

async function init() {
  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;
  if (!['admin', 'super_admin'].includes(CURRENT_USER.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Само администратор управлява партньорските комисионни.</div>`;
    return;
  }

  document.getElementById('app-content').innerHTML = `
    <p class="hint">Реферални/посреднически партньори — може да е всеки служител, без значение от ролята му в системата (включително шофьор или администратор). Компенсацията им е процент, фиксирана сума или стъпаловиден процент на период, изчислена от екипа шофьори, зачислени към тях (виж „Досиета на служители“ → „Зачисли към мениджър“).</p>
    <div class="panel">
      <div class="panel-head"><h2>Партньори</h2></div>
      <div id="partnersHost" class="loading">Зареждане…</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Добави / намери партньор</h2></div>
      <div class="field"><label>Търсене (име или имейл)</label><input type="text" id="partnerSearchInput" placeholder="напр. Цветелина или Виктор"></div>
      <div id="searchResults"></div>
    </div>

    <div class="panel" id="detailHost" style="display:none;">
      <div class="panel-head"><h2 id="detailTitle">Партньор</h2></div>
      <p class="hint" id="teamSizeHint"></p>
      <div class="error-box" id="commissionError"></div>
      <div class="success-box" id="commissionSuccess"></div>
      <form id="commissionForm">
        <div class="field"><label>Тип компенсация</label>
          <select name="comp_type" id="compTypeSelect">
            <option value="percentage">Процент от заработката на екипа</option>
            <option value="fixed">Фиксирана сума на период</option>
            <option value="tiered_percentage">Стъпаловиден процент (при постигнати цели)</option>
            <option value="per_active_driver">На активен шофьор (седмично)</option>
          </select>
        </div>
        <div class="field" id="percentageField"><label>Процент (%)</label><input name="percentage" type="number" step="0.01" min="0" max="100"></div>
        <div class="field-row" id="fixedFields">
          <div class="field"><label>Фиксирана сума (€)</label><input name="fixed_amount" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Период</label>
            <select name="fixed_period"><option value="day">Дневно</option><option value="week">Седмично</option><option value="month">Месечно</option></select>
          </div>
        </div>
        <p class="hint" id="dayPeriodHint" style="display:none;">Поръчките/приходите се внасят само СЕДМИЧНО от Bolt/Glovo — "дневно" е приблизително (всяка отчетена седмица се брои за 7 дни), докато не заработи истински дневен импорт.</p>
        <div id="tieredFields" style="display:none;">
          <p class="hint">Прогресивни траншове по общата заработка на екипа за периода — всеки транш се таксува по собствената си ставка (като ДОД наопаки: възнаграждава преизпълнение). Напр. 5% до 1000 €, после 8% над 1000 €.</p>
          <div id="tierRowsHost"></div>
          <button type="button" class="btn btn-ghost btn-sm" id="addTierBtn">+ Добави транш</button>
        </div>
        <div class="field-row" id="perActiveDriverFields">
          <div class="field"><label>Сума на активен шофьор (€)</label><input name="per_driver_amount" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Праг за "активен" (€ за седмицата)</label><input name="qualifying_threshold" type="number" step="0.01" min="0" value="30"></div>
        </div>
        <p class="hint" id="perActiveDriverHint" style="display:none;">За всяка седмица от периода се брои по един служител от екипа на партньора, направил <strong>повече от</strong> зададения праг за тази седмица — комисионната е (брой активни шофьор-седмици) × (сума на активен шофьор). Тази сума обичайно е част от седмичната удръжка/такса, която фирмата събира от съответния шофьор, а не допълнителен разход.</p>
        <div class="field" id="teamGoalField"><label>Минимална обща заработка на екипа за периода (€, незадължително)</label><input name="team_qualifying_goal" type="number" step="0.01" min="0" placeholder="напр. 2000 — комисионна се дължи само ако екипът я достигне"></div>
        <div class="field"><label>Бележки</label><input name="notes"></div>
        <div class="field"><label><input type="checkbox" name="active" style="width:auto;display:inline-block;margin-right:6px;">Активна комисионна</label></div>
        <button type="submit" class="btn btn-primary btn-sm">Запази</button>
      </form>

      <div class="panel-head" style="margin-top:22px;"><h2>Статистика за период</h2></div>
      <div id="statsPeriodPicker"></div>
      <div class="field-row">
        <div class="field"><label>От (седмица, начало)</label><input type="date" id="statsFrom"></div>
        <div class="field"><label>До (седмица, начало)</label><input type="date" id="statsTo"></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="statsRefreshBtn">Обнови статистиката</button>
      <div id="statsHost" style="margin-top:14px;"></div>

      <div class="panel-head" style="margin-top:22px;"><h2>Плащане на комисионна</h2></div>
      <p class="hint">Записва действително платена комисионна — с период и сума, за да е ясно кога, за какво и колко е платено. Отразява се и като разход в общата каса (виж „Обща каса“). Само супер администратор.</p>
      ${CURRENT_USER && CURRENT_USER.role === 'super_admin' ? `
      <div class="error-box" id="paymentError"></div>
      <div class="success-box" id="paymentSuccess"></div>
      <form id="paymentForm">
        <div class="field-row">
          <div class="field"><label>Период от *</label><input name="period_from" type="date" required></div>
          <div class="field"><label>Период до *</label><input name="period_to" type="date" required></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Сума (€) *</label><input name="amount" type="number" step="0.01" min="0" required></div>
          <div class="field"><label>Бележка</label><input name="note" placeholder="за какво/уточнение"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Маркирай платено</button>
      </form>` : '<p class="hint">Само супер администратор може да маркира плащане.</p>'}

      <div class="panel-head" style="margin-top:18px;"><h3 style="margin:0;">История на плащанията</h3></div>
      <div id="paymentsHost" class="loading">Зареждане…</div>
    </div>
  `;

  document.getElementById('compTypeSelect').addEventListener('change', toggleCompFields);
  document.getElementById('addTierBtn').addEventListener('click', () => {
    const existing = collectTiers();
    existing.push({ from: '', rate: '' });
    renderTierRows(existing);
  });
  const fixedPeriodSelect = document.querySelector('#fixedFields select[name="fixed_period"]');
  if (fixedPeriodSelect) {
    fixedPeriodSelect.addEventListener('change', () => {
      document.getElementById('dayPeriodHint').style.display = fixedPeriodSelect.value === 'day' ? '' : 'none';
    });
  }
  document.getElementById('statsRefreshBtn').addEventListener('click', async () => { await loadStats(); prefillPaymentForm(); });

  document.getElementById('partnerSearchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(() => runSearch(q), 250);
  });
  runSearch(''); // показва първите служители веднага, без да чака въвеждане

  const statsFrom = document.getElementById('statsFrom');
  const statsTo = document.getElementById('statsTo');
  mountPeriodPicker(document.getElementById('statsPeriodPicker'), statsFrom, statsTo, {
    wireWeekEnd: false, weekPresetMode: 'single', useMonthPreset: true,
    onApply: async () => { if (selectedId) { await loadStats(); prefillPaymentForm(); } },
  });
  // по подразбиране предходната седмица — най-честият случай при преглед
  statsFrom.value = previousWeekStart();
  statsTo.value = previousWeekStart();

  document.getElementById('commissionForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('commissionError');
    const successBox = document.getElementById('commissionSuccess');
    errorBox.classList.remove('show'); successBox.classList.remove('show');
    const form = e.target;
    const patch = {
      comp_type: form.comp_type.value,
      percentage: form.percentage.value ? Number(form.percentage.value) : null,
      fixed_amount: form.fixed_amount.value ? Number(form.fixed_amount.value) : null,
      fixed_period: form.fixed_period.value,
      per_driver_amount: form.per_driver_amount.value ? Number(form.per_driver_amount.value) : null,
      qualifying_threshold: form.qualifying_threshold.value ? Number(form.qualifying_threshold.value) : 30,
      team_qualifying_goal: form.team_qualifying_goal.value ? Number(form.team_qualifying_goal.value) : null,
      tiers: form.comp_type.value === 'tiered_percentage' ? collectTiers() : [],
      notes: form.notes.value || null,
      active: form.active.checked,
    };
    try {
      const { commission } = await Api.put(`/api/hr/partners/${selectedId}`, patch);
      const idx = PARTNERS.findIndex(p => p.id === selectedId);
      if (idx !== -1) PARTNERS[idx].commission = commission;
      successBox.textContent = 'Комисионната е запазена.';
      successBox.classList.add('show');
      await loadPartners();
      await runSearch(lastSearchQuery);
      await loadStats();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  const paymentForm = document.getElementById('paymentForm');
  if (paymentForm) {
    paymentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('paymentError');
      const successBox = document.getElementById('paymentSuccess');
      errorBox.classList.remove('show'); successBox.classList.remove('show');
      const form = e.target;
      try {
        await Api.post(`/api/hr/partners/${selectedId}/commission-payments`, {
          period_from: form.period_from.value, period_to: form.period_to.value,
          amount: Number(form.amount.value), note: form.note.value || null,
        });
        successBox.textContent = 'Комисионната е маркирана като платена.';
        successBox.classList.add('show');
        await loadPayments();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }

  await loadPartners();
}
init();
</script>
</body>
</html>
