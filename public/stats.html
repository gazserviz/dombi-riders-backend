<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статистики — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/stats.html" data-title="Статистики на автопарка"></div>

<script src="/js/app.js"></script>
<script>
function barRow(label, pct, valueLabel, color) {
  return `
    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px;">
        <span>${label}</span><span style="color:var(--muted);">${valueLabel}</span>
      </div>
      <div class="progress-bar"><div class="fill" style="width:${Math.max(2,pct)}%;background:${color||''}"></div></div>
    </div>`;
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (!['admin','manager'].includes(user.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате статистики.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  const { fleet, vehicles } = await Api.get('/api/stats');
  const maxProfit = Math.max(1, ...vehicles.map(v => Math.abs(v.net_profit)));

  content.innerHTML = `
    <div class="toolbar no-print">
      <div class="spacer"></div>
      <button class="btn btn-ghost btn-sm" id="printBtn">🖨 Принтирай</button>
      <button class="btn btn-ghost btn-sm" id="exportCsvBtn">⬇ Експорт CSV</button>
    </div>
    <div class="print-header">
      <h1>Dombi Riders — Статистики на автопарка</h1>
      <p>Генерирано на ${fmtDateTime(new Date())} от ${user.full_name} (${ROLE_LABELS[user.role] || user.role})</p>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Коли в автопарка</div><div class="value">${fleet.vehicle_count}</div>
        <div class="sub">${fleet.available} свободни · ${fleet.assigned} зачислени · ${fleet.rented} под наем · ${fleet.in_service} на сервиз</div></div>
      <div class="stat-card"><div class="label">Балансова стойност</div><div class="value">${fmtMoney(fleet.total_book_value)}</div>
        <div class="sub">от общо ${fmtMoney(fleet.total_purchase_value)} покупна цена</div></div>
      <div class="stat-card"><div class="label">Обща себестойност до момента</div><div class="value warn">${fmtMoney(fleet.total_cost)}</div>
        <div class="sub">покупна цена + сервиз + периодични разходи</div></div>
      <div class="stat-card"><div class="label">Приходи от наем</div><div class="value green">${fmtMoney(fleet.total_income)}</div></div>
      <div class="stat-card"><div class="label">Нетна печалба</div><div class="value ${fleet.total_net_profit>=0?'green':'warn'}">${fmtMoney(fleet.total_net_profit)}</div></div>
      <div class="stat-card"><div class="label">Средна заетост</div><div class="value">${fleet.avg_utilization_pct}%</div>
        <div class="sub">дни зачислена / дни във флота</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2>Заетост по кола</h2>
        ${vehicles.map(v => barRow(`${v.plate_number} — ${v.make} ${v.model}`, v.utilization_pct, v.utilization_pct+'%')).join('') || '<p>Няма данни.</p>'}
      </div>
      <div class="panel">
        <h2>Печалба по кола</h2>
        ${vehicles.map(v => barRow(
          `${v.plate_number} — ${v.make} ${v.model}`,
          Math.abs(v.net_profit) / maxProfit * 100,
          fmtMoney(v.net_profit),
          v.net_profit >= 0 ? 'linear-gradient(90deg,#1fae4a,#4dff7a)' : 'linear-gradient(90deg,#ff6b6b,#ff9d6b)'
        )).join('') || '<p>Няма данни.</p>'}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Детайли по кола</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Кола</th><th>Себестойност</th><th>Балансова ст-т</th><th>Приходи</th><th>Разходи</th><th>Печалба</th><th>Заетост</th>
          </tr></thead>
          <tbody>
            ${vehicles.map(v => `
              <tr>
                <td><a href="/vehicle-detail.html?id=${v.vehicle_id}"><strong>${v.plate_number}</strong> — ${v.make} ${v.model}</a></td>
                <td>${fmtMoney(v.total_cost)}</td>
                <td>${fmtMoney(v.book_value)}</td>
                <td>${fmtMoney(v.income)}</td>
                <td>${fmtMoney(v.expense)}</td>
                <td style="color:${v.net_profit>=0?'var(--green)':'var(--danger)'};font-weight:700;">${fmtMoney(v.net_profit)}</td>
                <td>${v.utilization_pct}%</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
    <div class="print-footer">Dombi Riders ЕООД · Вътрешна система за управление · Отчетът е информативен и не замества счетоводна справка.</div>
  `;

  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('exportCsvBtn').addEventListener('click', () => {
    const headers = ['Кола','Марка','Модел','Себестойност','Балансова ст-т','Приходи','Разходи','Печалба','Заетост %'];
    const rows = vehicles.map(v => [
      v.plate_number, v.make, v.model,
      v.total_cost, v.book_value, v.income, v.expense, v.net_profit, v.utilization_pct,
    ]);
    const stamp = new Date().toISOString().slice(0, 10);
    downloadCsv(`dombi-riders-statistiki-${stamp}.csv`, headers, rows);
  });
}
init();
</script>
</body>
</html>
