<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник на активността — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .activity-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .activity-row:last-child{border-bottom:none;}
  .activity-row .ic{width:30px;height:30px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;}
  .activity-row .main{flex:1;min-width:0;}
  .activity-row .main a{color:var(--text);}
  .activity-row .meta{font-size:.74rem;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div id="app-shell" data-active="/activity.html" data-title="Дневник на активността"></div>

<script src="/js/app.js"></script>
<script>
const TYPE_ICONS = {
  vehicle: '🚗', service: '🔧', recurring_cost: '💳', assignment: '🧾',
  protocol: '📋', contract: '📄', payment: '💰',
};

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (user.role !== 'admin') {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате дневника на активността.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  try {
    const { items } = await Api.get('/api/activity');
    content.innerHTML = `
      <div class="panel">
        <div class="panel-head"><h2>Последни ${items.length} действия в системата</h2></div>
        <div>
          ${items.length ? items.map(it => `
            <div class="activity-row">
              <div class="ic">${TYPE_ICONS[it.type] || '•'}</div>
              <div class="main">
                <a href="${it.link}">${it.text}</a>
                <div class="meta">${fmtDateTime(it.at)}${it.actor ? ' · ' + it.actor : ''}</div>
              </div>
            </div>`).join('') : `<div class="empty-state">Няма регистрирана активност.</div>`}
        </div>
      </div>`;
  } catch (err) {
    content.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
</body>
</html>
