<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник на активността — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .activity-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .activity-row:last-child{border-bottom:none;}
  .activity-row .ic{width:30px;height:30px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.9rem;}
  .activity-row .main{flex:1;min-width:0;}
  .activity-row .main a{color:var(--text);}
  .activity-row .meta{font-size:.74rem;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div id="app-shell" data-active="/activity.html" data-title="Дневник на активността"></div>

<script src="/js/app.js"></script>
<script>
const TYPE_ICONS = {
  vehicle: '🚗', service: '🔧', recurring_cost: '💳', assignment: '🧾',
  protocol: '📋', contract: '📄', payment: '💰',
};
const TYPE_LABELS = {
  vehicle: 'Коли', service: 'Сервиз', recurring_cost: 'Периодичен разход',
  assignment: 'Зачисления', protocol: 'Протоколи', contract: 'Договори', payment: 'Плащания',
};

let ALL_USERS = [];

function renderRows(items) {
  return items.length ? items.map(it => `
    <div class="activity-row">
      <div class="ic">${TYPE_ICONS[it.type] || '•'}</div>
      <div class="main">
        <a href="${it.link}">${it.text}</a>
        <div class="meta">${fmtDateTime(it.at)}${it.actor ? ' · ' + it.actor : ''}${it.city ? ' · ' + it.city : ''}</div>
      </div>
    </div>`).join('') : `<div class="empty-state">Няма регистрирана активност за избраните филтри.</div>`;
}

async function loadActivity() {
  const listHost = document.getElementById('activityListHost');
  const headHost = document.getElementById('activityHead');
  listHost.innerHTML = `<div class="loading">Зареждане…</div>`;

  const params = new URLSearchParams();
  const from = document.getElementById('fromInput').value;
  const to = document.getElementById('toInput').value;
  const actorId = document.getElementById('employeeSelect').value;
  const city = document.getElementById('citySelect').value;
  const type = document.getElementById('typeSelect').value;
  if (from) params.set('from', from);
  if (to) params.set('to', to);
  if (actorId) params.set('actor_id', actorId);
  if (city) params.set('city', city);
  if (type) params.set('type', type);

  try {
    const { items } = await Api.get(`/api/activity?${params.toString()}`);
    headHost.textContent = `Последни ${items.length} действия в системата`;
    listHost.innerHTML = renderRows(items);
  } catch (err) {
    listHost.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (!['admin', 'super_admin'].includes(user.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате дневника на активността.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  try {
    const { users } = await Api.get('/api/users');
    ALL_USERS = users;
  } catch (err) {
    ALL_USERS = [];
  }

  content.innerHTML = `
    <div class="panel">
      <div class="panel-head"><h2>Филтри</h2></div>
      <div class="toolbar">
        <div class="field"><label>От</label><input type="date" id="fromInput"></div>
        <div class="field"><label>До</label><input type="date" id="toInput"></div>
        <div class="field"><label>Служител</label>
          <select id="employeeSelect">
            <option value="">— всички —</option>
            ${ALL_USERS.map(u => `<option value="${u.id}">${escapeHtml(u.full_name)}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Град</label>
          <select id="citySelect">${cityOptions('').replace('— няма —', '— всички —')}</select>
        </div>
        <div class="field"><label>Дейност</label>
          <select id="typeSelect">
            <option value="">— всички —</option>
            ${Object.keys(TYPE_ICONS).map(t => `<option value="${t}">${TYPE_ICONS[t]} ${TYPE_LABELS[t] || t}</option>`).join('')}
          </select>
        </div>
      </div>
      <div id="periodPickerHost"></div>
      <div class="toolbar" style="margin-top:8px;">
        <button type="button" class="btn btn-primary btn-sm" id="applyFilterBtn">Приложи филтри</button>
        <button type="button" class="btn btn-ghost btn-sm" id="clearFilterBtn">Изчисти</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2 id="activityHead">Дневник на активността</h2></div>
      <div id="activityListHost"></div>
    </div>`;

  mountPeriodPicker(
    document.getElementById('periodPickerHost'),
    document.getElementById('fromInput'),
    document.getElementById('toInput'),
    { useMonthPreset: true, weekPresetMode: 'range', wireWeekEnd: false, onApply: () => loadActivity() },
  );

  document.getElementById('applyFilterBtn').addEventListener('click', loadActivity);
  document.getElementById('employeeSelect').addEventListener('change', loadActivity);
  document.getElementById('citySelect').addEventListener('change', loadActivity);
  document.getElementById('typeSelect').addEventListener('change', loadActivity);
  document.getElementById('clearFilterBtn').addEventListener('click', () => {
    document.getElementById('fromInput').value = '';
    document.getElementById('toInput').value = '';
    document.getElementById('employeeSelect').value = '';
    document.getElementById('citySelect').value = '';
    document.getElementById('typeSelect').value = '';
    loadActivity();
  });

  await loadActivity();
}
init();
</script>
</body>
</html>
