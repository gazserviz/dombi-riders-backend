<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Договор — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .doc-wrap{max-width:820px;margin:0 auto;padding:30px 28px 60px;}
  .doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:20px;}
  @media print{.doc-header{border-bottom:2px solid #000;}}
  .doc-header h1{margin:0 0 4px;}
  .doc-meta{font-size:.82rem;color:var(--muted);}
  .doc-section{margin-bottom:20px;}
  .doc-section h3{margin-bottom:8px;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:.9rem;}
  .kv div span{color:var(--muted);}
  .sign-row{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px;}
  .sign-line{border-top:1px solid var(--muted);padding-top:8px;font-size:.8rem;color:var(--muted);text-align:center;}
  .doc-actions{max-width:820px;margin:20px auto 0;padding:0 28px;display:flex;gap:10px;}
  @media print{ .topbar,.sidebar{display:none !important;} .content{padding:0;} }
</style>
</head>
<body>
<div id="app-shell" data-active="/personnel.html" data-title="Договор"></div>

<script src="/js/app.js"></script>
<script src="/js/esign-ui.js"></script>
<script>
const params = new URLSearchParams(location.search);
const contractId = params.get('id');
const EC_TYPE_LABELS = { labor: 'Трудов договор', civil: 'Граждански договор' };
const EC_STATUS_LABELS = { draft: 'Чернова', active: 'Активен', terminated: 'Прекратен' };

async function init() {
  const user = await mountShell();
  if (!user) return;
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  try {
    // employment-contracts няма самостоятелен GET-по-id маршрут — взимаме
    // договора през досието на служителя, което връща и профила, и списъка.
    const profileId = params.get('profile_id');
    if (!profileId) throw new Error('Липсва profile_id в адреса');
    const { profile, employment_contracts } = await Api.get(`/api/hr/personnel/${profileId}`);
    const contract = employment_contracts.find(c => c.id === contractId);
    if (!contract) throw new Error('Договорът не е намерен');
    const isLabor = contract.contract_type === 'labor';

    content.innerHTML = `
      <div class="doc-actions no-print">
        <button class="btn btn-ghost btn-sm" onclick="history.back()">← Назад</button>
        <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Принтирай / запази като PDF</button>
      </div>
      <div class="doc-wrap">
        <div class="doc-header">
          <div>
            <h1>${EC_TYPE_LABELS[contract.contract_type] || contract.contract_type}</h1>
            <div class="doc-meta">№ ${contract.contract_number} · Статус: ${EC_STATUS_LABELS[contract.status] || contract.status}</div>
          </div>
          <div class="doc-meta" style="text-align:right;">
            <strong>Dombi Riders ЕООД</strong><br>
            ${fmtDate(contract.created_at)}
          </div>
        </div>

        ${isLabor ? `<div class="error-box show" style="margin-bottom:20px;">⚠️ Чернова за преглед. Действителен трудов договор изисква квалифициран електронен подпис (КЕП) от работодателя по чл. 62 КТ — не е правен съвет, консултирайте се с адвокат/счетоводител.</div>` : ''}

        <div class="doc-section">
          <h3>Работодател</h3>
          <p>Dombi Riders ЕООД, гр. София, действащ чрез оправомощен представител.</p>
        </div>

        <div class="doc-section">
          <h3>${isLabor ? 'Работник' : 'Изпълнител'}</h3>
          <div class="kv">
            <div><span>Име: </span><strong>${profile.full_name}</strong></div>
            ${profile.egn ? `<div><span>ЕГН: </span>${profile.egn}</div>` : ''}
            ${profile.address ? `<div><span>Адрес: </span>${profile.address}</div>` : ''}
            ${profile.phone ? `<div><span>Телефон: </span>${profile.phone}</div>` : ''}
            ${profile.email ? `<div><span>Имейл: </span>${profile.email}</div>` : ''}
          </div>
        </div>

        <div class="doc-section">
          <h3>Условия</h3>
          <div class="kv">
            <div><span>Вид договор: </span><strong>${EC_TYPE_LABELS[contract.contract_type] || contract.contract_type}</strong></div>
            ${isLabor ? `<div><span>Часове на ден: </span>${contract.hours_per_day}</div>` : ''}
            <div><span>Начална дата: </span>${fmtDate(contract.start_date)}</div>
            <div><span>Крайна дата: </span>${contract.end_date ? fmtDate(contract.end_date) : 'безсрочен'}</div>
            <div><span>Седмична удръжка: </span><strong>${fmtMoney(contract.weekly_deduction_amount)}</strong></div>
          </div>
        </div>

        <div class="sign-row">
          <div class="sign-line">Работодател (подпис)</div>
          <div class="sign-line">${isLabor ? 'Работник (подпис)' : 'Изпълнител (подпис)'}</div>
        </div>
      </div>

      ${esignPanelHtml('employment_contract', contractId, contract)}
    `;
    bindEsignPanel('employment_contract', contractId, () => init());
  } catch (err) {
    content.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
</body>
</html>
