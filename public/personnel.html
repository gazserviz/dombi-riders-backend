<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досиета на служители — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/personnel.html" data-title="Досиета на служители"></div>

<script src="/js/app.js"></script>
<script>
function daysLeftLabel(n) {
  if (n < 0) return `Просрочено с ${Math.abs(n)} дни`;
  if (n === 0) return 'Изтича днес';
  return `След ${n} дни`;
}

function employeeAlertBadge(next_alert) {
  if (!next_alert) return '<span class="badge badge-green">Няма изтичащи</span>';
  const cls = next_alert.days_left < 0 ? 'badge-danger' : 'badge-warn';
  return `<span class="badge ${cls}">${next_alert.label} · ${daysLeftLabel(next_alert.days_left)}</span>`;
}

function personnelTable(employees) {
  return `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Име</th><th>Имейл</th><th>Роля</th><th>Статус</th><th>Лична карта</th><th>Шофьорска книжка</th><th>Изтичащи документи</th></tr></thead>
        <tbody>
          ${employees.map(e => `
            <tr class="clickable" onclick="window.location='/personnel-detail.html?id=${e.id}'">
              <td><a class="employee-name-link" href="/personnel-detail.html?id=${e.id}" onclick="event.stopPropagation()">${e.full_name}</a></td>
              <td style="white-space:normal;word-break:break-all;">${e.email}</td>
              <td>${ROLE_LABELS[e.role] || e.role}</td>
              <td>${e.status === 'active' ? '<span class="badge badge-green">Активен</span>' : '<span class="badge badge-muted">Спрян</span>'}</td>
              <td>${e.id_card_expiry ? fmtDate(e.id_card_expiry) : '<span class="hint">не е въведена</span>'}</td>
              <td>${e.driver_license_expiry ? fmtDate(e.driver_license_expiry) : '<span class="hint">не е въведена</span>'}</td>
              <td>${employeeAlertBadge(e.next_alert)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (!['admin', 'manager'].includes(user.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате досиетата на служителите.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `
    <p class="hint" style="margin-bottom:16px;">
      Картотека на документите на всеки служител — лична карта, шофьорска книжка, трудови/граждански договори,
      договори за наем на коли и приемо-предавателни протоколи, с аларма за изтичащи документи (30 дни).
    </p>
    ${user.role === 'admin' ? `
    <div class="panel">
      <div class="panel-head"><h2>Удръжки по подразбиране (седмично, по вид договор)</h2></div>
      <p class="hint">Използват се автоматично при съставяне на нов трудов/граждански договор — винаги могат да бъдат променени ръчно за конкретен служител/седмица. Стойностите по подразбиране са 0 €, докато не бъдат зададени тук.</p>
      <div class="success-box" id="deductionsSuccess"></div>
      <form id="deductionsForm">
        <div class="field-row">
          <div class="field"><label>Трудов, 2 ч./ден</label><input name="labor_2" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Трудов, 4 ч./ден</label><input name="labor_4" type="number" step="0.01" min="0"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Трудов, 6 ч./ден</label><input name="labor_6" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Трудов, 8 ч./ден</label><input name="labor_8" type="number" step="0.01" min="0"></div>
        </div>
        <div class="field"><label>Граждански договор</label><input name="civil" type="number" step="0.01" min="0"></div>
        <button type="submit" class="btn btn-primary btn-sm">Запази удръжките</button>
      </form>
    </div>` : ''}
    <div class="panel">
      <div class="panel-head"><h2>Всички служители</h2></div>
      <div id="tableHost" class="loading">Зареждане…</div>
    </div>`;

  if (user.role === 'admin') {
    try {
      const { defaults } = await Api.get('/api/hr/deduction-defaults');
      const form = document.getElementById('deductionsForm');
      ['labor_2', 'labor_4', 'labor_6', 'labor_8', 'civil'].forEach(k => {
        if (defaults[k] != null) form[k].value = defaults[k];
      });
    } catch (e) { /* незадължително */ }
    document.getElementById('deductionsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successBox = document.getElementById('deductionsSuccess');
      successBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      Object.keys(data).forEach(k => { data[k] = data[k] === '' ? 0 : Number(data[k]); });
      try {
        await Api.put('/api/hr/deduction-defaults', data);
        successBox.textContent = 'Запазено.';
        successBox.classList.add('show');
      } catch (err) { alert(err.message); }
    });
  }

  try {
    const { employees } = await Api.get('/api/hr/personnel');
    document.getElementById('tableHost').innerHTML = personnelTable(employees);
  } catch (err) {
    document.getElementById('tableHost').innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
</body>
</html>
