<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досиета на служители — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* компактна таблица — Шофьорска книжка е премахната, а Телефон/Град/
     Платформа са добавени, затова стесняваме колоните, за да се съберат
     на един екран без хоризонтален скрол (виж заявката на клиента) */
  .personnel-table{table-layout:fixed;width:100%;}
  .personnel-table th,.personnel-table td{padding:9px 8px;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;}
  .personnel-table th:nth-child(1),.personnel-table td:nth-child(1){width:15%;}
  .personnel-table th:nth-child(2),.personnel-table td:nth-child(2){width:17%;}
  .personnel-table th:nth-child(3),.personnel-table td:nth-child(3){width:12%;}
  .personnel-table th:nth-child(4),.personnel-table td:nth-child(4){width:10%;}
  .personnel-table th:nth-child(5),.personnel-table td:nth-child(5){width:10%;}
  .personnel-table th:nth-child(6),.personnel-table td:nth-child(6){width:9%;}
  .personnel-table th:nth-child(7),.personnel-table td:nth-child(7){width:11%;}
  .personnel-table th:nth-child(8),.personnel-table td:nth-child(8){width:16%;white-space:normal;}
</style>
</head>
<body>
<div id="app-shell" data-active="/personnel.html" data-title="Досиета на служители"></div>

<script src="/js/app.js"></script>
<script>
function daysLeftLabel(n) {
  if (n < 0) return `Просрочено с ${Math.abs(n)} дни`;
  if (n === 0) return 'Изтича днес';
  return `След ${n} дни`;
}

function employeeAlertBadge(next_alert) {
  if (!next_alert) return '<span class="badge badge-green">Няма изтичащи</span>';
  const cls = next_alert.days_left < 0 ? 'badge-danger' : 'badge-warn';
  return `<span class="badge ${cls}">${next_alert.label} · ${daysLeftLabel(next_alert.days_left)}</span>`;
}

const PLATFORM_LABELS = { bolt: 'Bolt', glovo: 'Glovo' };

let ALL_EMPLOYEES = [];

function platformBadges(platforms) {
  if (!platforms || !platforms.length) return '<span class="hint">—</span>';
  return platforms.map(p => `<span class="badge badge-muted" style="margin-right:3px;">${PLATFORM_LABELS[p] || p}</span>`).join('');
}

// активните най-отгоре (по азбучен ред), след тях спрените (пак по азбучен ред)
function sortPersonnel(employees) {
  return [...employees].sort((a, b) => {
    const rankA = a.status === 'active' ? 0 : 1;
    const rankB = b.status === 'active' ? 0 : 1;
    if (rankA !== rankB) return rankA - rankB;
    return (a.full_name || '').localeCompare(b.full_name || '', 'bg');
  });
}

function personnelTable(employees) {
  if (!employees.length) return `<p class="hint">Няма служители, отговарящи на филтъра.</p>`;
  const sorted = sortPersonnel(employees);
  return `
    <div class="table-wrap">
      <table class="personnel-table">
        <thead><tr><th>Име</th><th>Имейл</th><th>Телефон</th><th>Град</th><th>Платформа</th><th>Роля</th><th>Статус</th><th>Изтичащи документи</th></tr></thead>
        <tbody>
          ${sorted.map(e => `
            <tr class="clickable" onclick="window.location='/personnel-detail.html?id=${e.id}'" title="${escapeHtml(e.full_name)}">
              <td><a class="employee-name-link" href="/personnel-detail.html?id=${e.id}" onclick="event.stopPropagation()">${e.full_name}</a>${driverIdLine(e)}</td>
              <td title="${escapeHtml(e.email)}">${e.email}</td>
              <td>${e.phone || '<span class="hint">—</span>'}</td>
              <td>${e.city || '<span class="hint">—</span>'}</td>
              <td>${platformBadges(e.platforms)}</td>
              <td>${ROLE_LABELS[e.role] || e.role}</td>
              <td>
                ${e.status === 'active' ? '<span class="badge badge-green">Активен</span>' : '<span class="badge badge-muted">Спрян</span>'}
                ${e.blacklisted ? '<span class="badge badge-danger" style="margin-left:4px;">ЧС</span>' : ''}
              </td>
              <td>${employeeAlertBadge(e.next_alert)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

function applyPersonnelFilters() {
  const q = (document.getElementById('personnelSearch').value || '').trim().toLowerCase();
  const status = document.getElementById('personnelStatusFilter').value;
  const blacklist = document.getElementById('personnelBlacklistFilter').value;
  const phoneQ = (document.getElementById('personnelPhoneFilter').value || '').trim().toLowerCase();
  const cityFilter = document.getElementById('personnelCityFilter').value;
  const managerFilter = document.getElementById('personnelManagerFilter').value;
  const platformFilter = document.getElementById('personnelPlatformFilter').value;
  const filtered = ALL_EMPLOYEES.filter(e => {
    if (status && e.status !== status) return false;
    if (blacklist === 'yes' && !e.blacklisted) return false;
    if (blacklist === 'no' && e.blacklisted) return false;
    if (q) {
      const hay = `${e.full_name || ''} ${e.email || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (phoneQ && !(e.phone || '').toLowerCase().includes(phoneQ)) return false;
    if (cityFilter && e.city !== cityFilter) return false;
    if (managerFilter === 'none' && e.manager_id) return false;
    if (managerFilter && managerFilter !== 'none' && e.manager_id !== managerFilter) return false;
    if (platformFilter === 'both') {
      if (!(e.platforms || []).includes('bolt') || !(e.platforms || []).includes('glovo')) return false;
    } else if (platformFilter && !(e.platforms || []).includes(platformFilter)) {
      return false;
    }
    return true;
  });
  document.getElementById('tableHost').innerHTML = personnelTable(filtered);
}

function managerFilterOptions() {
  const managers = ALL_EMPLOYEES.filter(e => ['admin', 'manager'].includes(e.role));
  return managers.map(m => `<option value="${m.id}">${escapeHtml(m.full_name)}</option>`).join('');
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (!['admin', 'manager', 'super_admin'].includes(user.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате досиетата на служителите.</div>`;
    return;
  }
  const content = document.getElementById('app-content');
  content.innerHTML = `
    <p class="hint" style="margin-bottom:16px;">
      Картотека на документите на всеки служител — лична карта, шофьорска книжка, трудови/граждански договори,
      договори за наем на коли и приемо-предавателни протоколи, с аларма за изтичащи документи (30 дни).
    </p>
    ${['admin', 'super_admin'].includes(user.role) ? `
    <div class="panel">
      <div class="panel-head"><h2>Удръжки по подразбиране (седмично, по вид договор)</h2></div>
      <p class="hint">Използват се автоматично при съставяне на нов трудов/граждански договор — винаги могат да бъдат променени ръчно за конкретен служител/седмица. Стойностите по подразбиране са 0 €, докато не бъдат зададени тук.</p>
      <div class="success-box" id="deductionsSuccess"></div>
      <form id="deductionsForm">
        <div class="field-row">
          <div class="field"><label>Трудов, 2 ч./ден</label><input name="labor_2" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Трудов, 4 ч./ден</label><input name="labor_4" type="number" step="0.01" min="0"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Трудов, 6 ч./ден</label><input name="labor_6" type="number" step="0.01" min="0"></div>
          <div class="field"><label>Трудов, 8 ч./ден</label><input name="labor_8" type="number" step="0.01" min="0"></div>
        </div>
        <div class="field"><label>Граждански договор</label><input name="civil" type="number" step="0.01" min="0"></div>
        <button type="submit" class="btn btn-primary btn-sm">Запази удръжките</button>
      </form>
    </div>` : ''}
    <div class="panel">
      <div class="panel-head"><h2>Всички служители</h2></div>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="flex:2;"><label>Търсене (име или имейл)</label><input type="text" id="personnelSearch" placeholder="напр. Иван Иванов"></div>
        <div class="field"><label>Статус</label>
          <select id="personnelStatusFilter">
            <option value="">Всички</option>
            <option value="active">Активни</option>
            <option value="suspended">Спрени</option>
          </select>
        </div>
        <div class="field"><label>Черен списък</label>
          <select id="personnelBlacklistFilter">
            <option value="">Всички</option>
            <option value="yes">В черен списък</option>
            <option value="no">Не е в черен списък</option>
          </select>
        </div>
      </div>
      <div class="field-row" style="align-items:flex-end;">
        <div class="field"><label>Телефон</label><input type="text" id="personnelPhoneFilter" placeholder="напр. 0888"></div>
        <div class="field"><label>Град</label>
          <select id="personnelCityFilter">
            <option value="">Всички</option>
            ${BG_CITIES.map(c => `<option value="${c}">${c}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Мениджър</label>
          <select id="personnelManagerFilter">
            <option value="">Всички</option>
            <option value="none">Без мениджър</option>
          </select>
        </div>
        <div class="field"><label>Платформа</label>
          <select id="personnelPlatformFilter">
            <option value="">Всички</option>
            <option value="bolt">Bolt</option>
            <option value="glovo">Glovo</option>
            <option value="both">И двете</option>
          </select>
        </div>
      </div>
      <div id="tableHost" class="loading">Зареждане…</div>
    </div>`;

  if (['admin', 'super_admin'].includes(user.role)) {
    try {
      const { defaults } = await Api.get('/api/hr/deduction-defaults');
      const form = document.getElementById('deductionsForm');
      ['labor_2', 'labor_4', 'labor_6', 'labor_8', 'civil'].forEach(k => {
        if (defaults[k] != null) form[k].value = defaults[k];
      });
    } catch (e) { /* незадължително */ }
    document.getElementById('deductionsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successBox = document.getElementById('deductionsSuccess');
      successBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      Object.keys(data).forEach(k => { data[k] = data[k] === '' ? 0 : Number(data[k]); });
      try {
        await Api.put('/api/hr/deduction-defaults', data);
        successBox.textContent = 'Запазено.';
        successBox.classList.add('show');
      } catch (err) { alert(err.message); }
    });
  }

  try {
    const { employees } = await Api.get('/api/hr/personnel');
    ALL_EMPLOYEES = employees;
    document.getElementById('tableHost').innerHTML = personnelTable(employees);
    document.getElementById('personnelManagerFilter').insertAdjacentHTML('beforeend', managerFilterOptions());
    document.getElementById('personnelSearch').addEventListener('input', applyPersonnelFilters);
    document.getElementById('personnelStatusFilter').addEventListener('change', applyPersonnelFilters);
    document.getElementById('personnelBlacklistFilter').addEventListener('change', applyPersonnelFilters);
    document.getElementById('personnelPhoneFilter').addEventListener('input', applyPersonnelFilters);
    document.getElementById('personnelCityFilter').addEventListener('change', applyPersonnelFilters);
    document.getElementById('personnelManagerFilter').addEventListener('change', applyPersonnelFilters);
    document.getElementById('personnelPlatformFilter').addEventListener('change', applyPersonnelFilters);
  } catch (err) {
    document.getElementById('tableHost').innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
</body>
</html>
