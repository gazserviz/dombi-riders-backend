<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Навигация на менюто — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/nav-settings.html" data-title="Навигация на менюто"></div>

<script src="/js/app.js"></script>
<script>
let STATE = []; // [{ base_group, label, items: [{href, icon, label, roles}] }]

// изгражда работно състояние от базовия NAV (пълен, без филтър по роля —
// админ трябва да може да преименува дори елементи, видими само за шофьори)
// слято със запазената конфигурация (label + ред), запазвайки base_group
// като стабилен ключ за съпоставяне.
function buildWorkingState(config) {
  const cfgGroups = (config && Array.isArray(config.groups)) ? config.groups : [];
  const baseByGroup = new Map(NAV.map(g => [g.group, g]));
  const usedGroups = new Set();
  const result = [];
  cfgGroups.forEach(cg => {
    const base = baseByGroup.get(cg.base_group || cg.group);
    if (!base) return;
    usedGroups.add(base.group);
    const baseItemsByHref = new Map(base.items.map(i => [i.href, i]));
    const usedHrefs = new Set();
    const items = [];
    (Array.isArray(cg.items) ? cg.items : []).forEach(ci => {
      const baseItem = baseItemsByHref.get(ci.href);
      if (!baseItem) return;
      usedHrefs.add(ci.href);
      items.push({ ...baseItem, label: ci.label || baseItem.label });
    });
    base.items.forEach(bi => { if (!usedHrefs.has(bi.href)) items.push({ ...bi }); });
    result.push({ base_group: base.group, label: cg.label || base.group, items });
  });
  NAV.forEach(bg => {
    if (!usedGroups.has(bg.group)) {
      result.push({ base_group: bg.group, label: bg.group, items: bg.items.map(i => ({ ...i })) });
    }
  });
  return result;
}

function render() {
  const host = document.getElementById('navEditorHost');
  host.innerHTML = STATE.map((g, gi) => `
    <div class="panel" style="margin-bottom:14px;">
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="flex:1;">
          <label>Име на групата</label>
          <input type="text" class="group-label-input" data-gi="${gi}" value="${escapeHtml(g.label)}" maxlength="60">
        </div>
        <div style="display:flex;gap:4px;margin-bottom:14px;">
          <button type="button" class="btn btn-ghost btn-sm group-up-btn" data-gi="${gi}" ${gi === 0 ? 'disabled' : ''} title="Премести групата нагоре">↑</button>
          <button type="button" class="btn btn-ghost btn-sm group-down-btn" data-gi="${gi}" ${gi === STATE.length - 1 ? 'disabled' : ''} title="Премести групата надолу">↓</button>
        </div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Икона</th><th>Показвано име</th><th>Страница (href)</th><th>Роли</th><th></th></tr></thead>
        <tbody>
          ${g.items.map((it, ii) => `
            <tr>
              <td>${it.icon}</td>
              <td><input type="text" class="item-label-input" data-gi="${gi}" data-ii="${ii}" value="${escapeHtml(it.label)}" maxlength="80" style="min-width:220px;"></td>
              <td><code style="font-size:.78rem;">${escapeHtml(it.href)}</code></td>
              <td class="hint">${it.roles.map(r => ROLE_LABELS[r] || r).join(', ')}</td>
              <td style="white-space:nowrap;">
                <button type="button" class="btn btn-ghost btn-sm item-up-btn" data-gi="${gi}" data-ii="${ii}" ${ii === 0 ? 'disabled' : ''} title="Нагоре">↑</button>
                <button type="button" class="btn btn-ghost btn-sm item-down-btn" data-gi="${gi}" data-ii="${ii}" ${ii === g.items.length - 1 ? 'disabled' : ''} title="Надолу">↓</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table></div>
    </div>`).join('');

  host.querySelectorAll('.group-label-input').forEach(inp => {
    inp.addEventListener('input', () => { STATE[Number(inp.dataset.gi)].label = inp.value; });
  });
  host.querySelectorAll('.item-label-input').forEach(inp => {
    inp.addEventListener('input', () => { STATE[Number(inp.dataset.gi)].items[Number(inp.dataset.ii)].label = inp.value; });
  });
  host.querySelectorAll('.group-up-btn').forEach(btn => {
    btn.addEventListener('click', () => { moveGroup(Number(btn.dataset.gi), -1); });
  });
  host.querySelectorAll('.group-down-btn').forEach(btn => {
    btn.addEventListener('click', () => { moveGroup(Number(btn.dataset.gi), 1); });
  });
  host.querySelectorAll('.item-up-btn').forEach(btn => {
    btn.addEventListener('click', () => { moveItem(Number(btn.dataset.gi), Number(btn.dataset.ii), -1); });
  });
  host.querySelectorAll('.item-down-btn').forEach(btn => {
    btn.addEventListener('click', () => { moveItem(Number(btn.dataset.gi), Number(btn.dataset.ii), 1); });
  });
}

function moveGroup(gi, dir) {
  const target = gi + dir;
  if (target < 0 || target >= STATE.length) return;
  [STATE[gi], STATE[target]] = [STATE[target], STATE[gi]];
  render();
}
function moveItem(gi, ii, dir) {
  const items = STATE[gi].items;
  const target = ii + dir;
  if (target < 0 || target >= items.length) return;
  [items[ii], items[target]] = [items[target], items[ii]];
  render();
}

async function saveConfig() {
  const msg = document.getElementById('navSaveMsg');
  msg.classList.remove('show');
  const groups = STATE.map(g => ({
    base_group: g.base_group,
    label: g.label,
    items: g.items.map(it => ({ href: it.href, label: it.label })),
  }));
  try {
    await Api.put('/api/nav-config', { groups });
    msg.textContent = 'Запазено — менюто ще се обнови при следващо зареждане на страница.';
    msg.classList.add('show');
  } catch (err) {
    alert(err.message);
  }
}

async function resetConfig() {
  if (!confirm('Да се възстанови ли менюто по подразбиране? Всички преименувания и пренареждания ще бъдат изтрити.')) return;
  try {
    await Api.post('/api/nav-config/reset', {});
    STATE = buildWorkingState(null);
    render();
    const msg = document.getElementById('navSaveMsg');
    msg.textContent = 'Възстановено по подразбиране.';
    msg.classList.add('show');
  } catch (err) {
    alert(err.message);
  }
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (user.role !== 'admin') {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Само администратор може да редактира менюто.</div>`;
    return;
  }
  document.getElementById('app-content').innerHTML = `
    <p class="hint" style="margin-bottom:16px;">
      Тук можете да преименувате групите и елементите на лявото меню, както и да ги пренаредите (нагоре/надолу).
      Страницата, иконата и видимостта по роля не се променят от тук — само показваното име и подредбата.
    </p>
    <div class="success-box" id="navSaveMsg"></div>
    <div class="toolbar no-print" style="margin-bottom:14px;">
      <button type="button" class="btn btn-primary btn-sm" id="navSaveBtn">Запази</button>
      <button type="button" class="btn btn-ghost btn-sm" id="navResetBtn">Възстанови по подразбиране</button>
    </div>
    <div id="navEditorHost"></div>
  `;
  document.getElementById('navSaveBtn').addEventListener('click', saveConfig);
  document.getElementById('navResetBtn').addEventListener('click', resetConfig);

  let config = null;
  try { ({ config } = await Api.get('/api/nav-config')); } catch (e) { /* без запазена конфигурация */ }
  STATE = buildWorkingState(config);
  render();
}
init();
</script>
</body>
</html>
