<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Потребители — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* компактна таблица с потребители — без хоризонтален скрол */
  .users-table{table-layout:fixed;width:100%;}
  .users-table th,.users-table td{padding:9px 8px;font-size:.82rem;white-space:normal;word-break:break-word;vertical-align:middle;}
  .users-table th:nth-child(1),.users-table td:nth-child(1){width:26%;}
  .users-table th:nth-child(2),.users-table td:nth-child(2){width:17%;}
  .users-table th:nth-child(3),.users-table td:nth-child(3){width:13%;}
  .users-table th:nth-child(4),.users-table td:nth-child(4){width:19%;}
  .users-table th:nth-child(5),.users-table td:nth-child(5){width:25%;}
  .users-table select{width:100%;font-size:.8rem;padding:6px 8px;}
  .user-cell .u-name{display:block;font-weight:700;}
  .user-cell .u-sub{display:block;font-size:.72rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .perm-group{display:flex;flex-direction:column;gap:4px;}
  .perm-group label{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer;}
  .perm-group input[type=checkbox]{margin:0;width:14px;height:14px;flex:none;}
  .row-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .row-actions .btn{width:100%;padding:6px 10px;font-size:.72rem;}
  .temp-pw-box{
    background:#4dff7a18;border:1px solid #4dff7a44;color:var(--text);
    padding:12px 14px;border-radius:10px;font-size:.84rem;margin-bottom:16px;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .temp-pw-box code{background:#00000040;padding:3px 9px;border-radius:6px;font-size:.9rem;color:var(--green);letter-spacing:.02em;}
  .temp-pw-box .tpw-actions{display:flex;gap:8px;flex:none;}
</style>
</head>
<body>
<div id="app-shell" data-active="/users.html" data-title="Потребители и роли"></div>

<script src="/js/app.js"></script>
<script>
const ROLE_DESC = {
  super_admin: 'Най-високо ниво — единствената роля, която може да определя правата и достъпа на всички останали (виж „Права и достъпи“). Винаги пълен достъп навсякъде.',
  admin: 'Пълен достъп по подразбиране — управлява потребители, роли и всички модули (обхватът може да бъде стеснен от супер администратор в „Права и достъпи“).',
  manager: 'Оперативен достъп — коли, договори, протоколи, статистики.',
  driver: 'Достъп само до собствените си зачисления и протоколи.',
};

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function tempPasswordBox(name, password) {
  return `
    <div class="temp-pw-box" id="tempPwBox">
      <span>Временна парола за <strong>${escapeHtml(name)}</strong>: <code id="tempPwValue">${escapeHtml(password)}</code></span>
      <span class="tpw-actions">
        <button type="button" class="btn btn-ghost btn-sm" id="tempPwCopyBtn">Копирай</button>
        <button type="button" class="btn btn-ghost btn-sm" id="tempPwCloseBtn">✕</button>
      </span>
    </div>`;
}

function wireTempPasswordBox(container) {
  const box = container.querySelector('#tempPwBox');
  if (!box) return;
  const copyBtn = box.querySelector('#tempPwCopyBtn');
  const closeBtn = box.querySelector('#tempPwCloseBtn');
  copyBtn.addEventListener('click', async () => {
    const value = box.querySelector('#tempPwValue').textContent;
    try {
      await navigator.clipboard.writeText(value);
      copyBtn.textContent = 'Копирано ✓';
      setTimeout(() => { copyBtn.textContent = 'Копирай'; }, 1500);
    } catch (err) {
      alert(value);
    }
  });
  closeBtn.addEventListener('click', () => box.remove());
}

// показва иметo/имейла/телефона на потребителя (статичен изглед на клетката) —
// използва се и при първоначалното изчертаване на таблицата, и при "Откажи"
// след натиснат бутон "Редактирай"
function userCellDisplay(u) {
  return `
    <span class="u-name">${escapeHtml(u.full_name)}</span>
    <span class="u-sub">${escapeHtml(u.email)}</span>
    ${u.phone ? `<span class="u-sub">${escapeHtml(u.phone)}</span>` : ''}
    ${driverIdLine(u)}`;
}

// инлайн форма за редакция на име/имейл/телефон — показва се на мястото на
// userCellDisplay при натиснат бутон "Редактирай"; паролата НЕ се редактира
// оттук (за нея си остава отделният бутон "Нова парола" — вижте по-долу)
function userCellEditForm(u) {
  return `
    <form class="edit-user-form" data-id="${u.id}">
      <div class="field" style="margin-bottom:6px;"><input name="full_name" value="${escapeHtml(u.full_name)}" required placeholder="Пълно име"></div>
      <div class="field" style="margin-bottom:6px;"><input name="email" type="email" value="${escapeHtml(u.email)}" required placeholder="Имейл"></div>
      <div class="field" style="margin-bottom:6px;"><input name="phone" value="${escapeHtml(u.phone || '')}" placeholder="Телефон"></div>
      <div style="display:flex;gap:6px;">
        <button type="submit" class="btn btn-primary btn-sm">Запази</button>
        <button type="button" class="btn btn-ghost btn-sm cancel-edit-btn">Откажи</button>
      </div>
    </form>`;
}

function usersTable(users, viewerIsSuperAdmin) {
  return `
    <div class="table-wrap">
      <table class="users-table">
        <thead><tr><th>Потребител</th><th>Роля</th><th>Статус</th><th title="Право да одобрява преводи между портфейли / да вижда собствената си заработка в модул Заплати">Права</th><th>Действия</th></tr></thead>
        <tbody>
          ${users.map(u => {
            // само супер администратор може да пипа профила на друг супер
            // администратор (роля/статус/парола) — виж защитата и в server.js
            const locked = u.role === 'super_admin' && !viewerIsSuperAdmin;
            return `
            <tr>
              <td class="user-cell" id="user-cell-${u.id}">${userCellDisplay(u)}</td>
              <td>
                ${locked
                  ? `<span class="badge badge-green">${ROLE_LABELS.super_admin}</span>`
                  : `<select class="role-select" data-id="${u.id}">
                      ${viewerIsSuperAdmin ? `<option value="super_admin" ${u.role==='super_admin'?'selected':''}>Супер администратор</option>` : ''}
                      <option value="admin" ${u.role==='admin'?'selected':''}>Администратор</option>
                      <option value="manager" ${u.role==='manager'?'selected':''}>Мениджър</option>
                      <option value="driver" ${u.role==='driver'?'selected':''}>Шофьор</option>
                    </select>`}
              </td>
              <td>${u.status==='active' ? '<span class="badge badge-green">Активен</span>' : '<span class="badge badge-muted">Спрян</span>'}</td>
              <td>
                <div class="perm-group">
                  ${['admin','super_admin'].includes(u.role)
                    ? '<span class="hint">Винаги (админ)</span>'
                    : `<label><input type="checkbox" class="approve-transfers-toggle" data-id="${u.id}" ${u.permissions && u.permissions.can_approve_transfers ? 'checked' : ''}> Преводи</label>`}
                  ${['admin','super_admin','manager'].includes(u.role)
                    ? (u.role === 'manager' ? '<span class="hint">Заработка: винаги</span>' : '')
                    : `<label><input type="checkbox" class="view-earnings-toggle" data-id="${u.id}" ${u.permissions && u.permissions.can_view_earnings ? 'checked' : ''}> Заработка</label>`}
                </div>
              </td>
              <td>
                <div class="row-actions">
                  <button class="btn btn-ghost btn-sm edit-user-btn" data-id="${u.id}" ${locked?'disabled':''}>✎ Редактирай</button>
                  <button class="btn btn-ghost btn-sm toggle-status-btn" data-id="${u.id}" data-status="${u.status}" ${locked?'disabled':''}>${u.status==='active'?'Спри':'Активирай'}</button>
                  <button class="btn btn-ghost btn-sm reset-password-btn" data-id="${u.id}" data-name="${escapeHtml(u.full_name)}" ${locked?'disabled':''}>🔑 Нова парола</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

async function init() {
  const user = await mountShell();
  if (!user) return;
  if (!['admin','super_admin'].includes(user.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Само администратор може да управлява потребители и роли.</div>`;
    return;
  }
  const isSuperAdmin = user.role === 'super_admin';
  const content = document.getElementById('app-content');
  content.innerHTML = `
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Нов потребител</h2></div>
        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>
        <div id="createTempPwHost"></div>
        <form id="userForm">
          <div class="field"><label>Пълно име *</label><input name="full_name" required></div>
          <div class="field"><label>Имейл *</label><input name="email" type="email" required></div>
          <div class="field"><label>Телефон</label><input name="phone"></div>
          <div class="field">
            <label>Първоначална парола</label>
            <input name="password" minlength="4" placeholder="име123">
            <p class="hint">По избор — ако оставите празно, ще се генерира автоматично (напр. „име123“) и ще се покаже след създаване.</p>
          </div>
          <div class="field"><label>Роля *</label>
            <select name="role" id="roleSelect">
              <option value="driver">Шофьор</option>
              <option value="manager">Мениджър</option>
              <option value="admin">Администратор</option>
              ${isSuperAdmin ? '<option value="super_admin">Супер администратор</option>' : ''}
            </select>
          </div>
          <p class="hint" id="roleDesc">${ROLE_DESC.driver}</p>
          <button type="submit" class="btn btn-primary btn-block">Създай потребител</button>
        </form>
      </div>
      <div class="panel">
        <h2>Роли в системата</h2>
        <div class="table-wrap"><table>
          ${isSuperAdmin ? `<tr><td><span class="badge badge-green">Супер админ</span></td><td>${ROLE_DESC.super_admin}</td></tr>` : ''}
          <tr><td><span class="badge badge-green">Админ</span></td><td>${ROLE_DESC.admin}</td></tr>
          <tr><td><span class="badge badge-warn">Мениджър</span></td><td>${ROLE_DESC.manager}</td></tr>
          <tr><td><span class="badge badge-muted">Шофьор</span></td><td>${ROLE_DESC.driver}</td></tr>
        </table></div>
        ${isSuperAdmin ? `<a href="/permissions.html" class="btn btn-ghost btn-sm" style="margin-top:10px;">🔐 Настрой права и достъпи →</a>` : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Всички потребители</h2></div>
      <div id="resetTempPwHost"></div>
      <div id="tableHost" class="loading">Зареждане…</div>
    </div>`;

  document.getElementById('roleSelect').addEventListener('change', (e) => {
    document.getElementById('roleDesc').textContent = ROLE_DESC[e.target.value];
  });

  async function refreshTable() {
    const { users } = await Api.get('/api/users');
    document.getElementById('tableHost').innerHTML = usersTable(users, isSuperAdmin);
    document.querySelectorAll('.role-select').forEach(sel => {
      sel.addEventListener('change', async () => {
        try { await Api.put(`/api/users/${sel.dataset.id}`, { role: sel.value }); }
        catch (err) { alert(err.message); refreshTable(); }
      });
    });
    document.querySelectorAll('.toggle-status-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const newStatus = btn.dataset.status === 'active' ? 'suspended' : 'active';
        try { await Api.put(`/api/users/${btn.dataset.id}`, { status: newStatus }); refreshTable(); }
        catch (err) { alert(err.message); }
      });
    });
    document.querySelectorAll('.approve-transfers-toggle').forEach(chk => {
      chk.addEventListener('change', async () => {
        const target = users.find(u => u.id === chk.dataset.id);
        const permissions = { ...(target.permissions || {}), can_approve_transfers: chk.checked };
        try { await Api.put(`/api/users/${chk.dataset.id}`, { permissions }); }
        catch (err) { alert(err.message); chk.checked = !chk.checked; }
      });
    });
    document.querySelectorAll('.view-earnings-toggle').forEach(chk => {
      chk.addEventListener('change', async () => {
        const target = users.find(u => u.id === chk.dataset.id);
        const permissions = { ...(target.permissions || {}), can_view_earnings: chk.checked };
        try { await Api.put(`/api/users/${chk.dataset.id}`, { permissions }); }
        catch (err) { alert(err.message); chk.checked = !chk.checked; }
      });
    });
    document.querySelectorAll('.edit-user-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = users.find(u => u.id === btn.dataset.id);
        const cell = document.getElementById(`user-cell-${btn.dataset.id}`);
        cell.innerHTML = userCellEditForm(target);
        const form = cell.querySelector('.edit-user-form');
        form.querySelector('.cancel-edit-btn').addEventListener('click', () => {
          cell.innerHTML = userCellDisplay(target);
        });
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const data = Object.fromEntries(new FormData(form).entries());
          try {
            await Api.put(`/api/users/${target.id}`, data);
            refreshTable();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    });
    document.querySelectorAll('.reset-password-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm(`Да се генерира нова парола за ${btn.dataset.name}?`)) return;
        try {
          const res = await Api.post(`/api/users/${btn.dataset.id}/reset-password`, {});
          const host = document.getElementById('resetTempPwHost');
          host.innerHTML = tempPasswordBox(btn.dataset.name, res.temp_password);
          wireTempPasswordBox(host);
          host.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (err) { alert(err.message); }
      });
    });
  }

  document.getElementById('userForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const tempPwHost = document.getElementById('createTempPwHost');
    errorBox.classList.remove('show'); successBox.classList.remove('show');
    tempPwHost.innerHTML = '';
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (!data.password) delete data.password;
    try {
      const res = await Api.post('/api/users', data);
      successBox.textContent = 'Потребителят е създаден.';
      successBox.classList.add('show');
      if (res.temp_password) {
        tempPwHost.innerHTML = tempPasswordBox(data.full_name, res.temp_password);
        wireTempPasswordBox(tempPwHost);
      }
      e.target.reset();
      refreshTable();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  refreshTable();
}
init();
</script>
</body>
</html>
