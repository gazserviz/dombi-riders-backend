<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досие на служител — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/personnel.html" data-title="Досие на служител"></div>

<script src="/js/app.js"></script>
<script src="/js/esign-ui.js"></script>
<script>
const EC_STATUS = {
  draft: ['Чернова', 'badge-muted'],
  active: ['Активен', 'badge-green'],
  terminated: ['Прекратен', 'badge-danger'],
};
function ecStatusBadge(s) { const [label, cls] = EC_STATUS[s] || [s, 'badge-muted']; return `<span class="badge ${cls}">${label}</span>`; }
const EC_TYPE_LABELS = { labor: 'Трудов', civil: 'Граждански' };

function qs(name) { return new URLSearchParams(location.search).get(name); }
function daysLeftLabel(n) {
  if (n < 0) return `Просрочено с ${Math.abs(n)} дни`;
  if (n === 0) return 'Изтича днес';
  return `След ${n} дни`;
}

let CURRENT_USER = null;
let TARGET_ID = null;
let IS_SELF = false;
let CAN_EDIT = false;
let MANAGERS = [];

function docFieldRow(label, value, expiry, photoFrontUrl, photoBackUrl) {
  let expiryHtml = '—';
  if (expiry) {
    const diff = new Date(expiry) - new Date();
    const daysLeft = Math.round(diff / 86400000);
    const soon = daysLeft < 30;
    expiryHtml = `${fmtDate(expiry)} ${soon ? `<span class="badge ${daysLeft < 0 ? 'badge-danger' : 'badge-warn'}" style="margin-left:6px;">${daysLeftLabel(daysLeft)}</span>` : ''}`;
  }
  const photoCell = [
    photoFrontUrl ? `<a href="${photoFrontUrl}" target="_blank">Лице</a>` : '<span class="hint">няма лице</span>',
    photoBackUrl ? `<a href="${photoBackUrl}" target="_blank">Гръб</a>` : '<span class="hint">няма гръб</span>',
  ].join(' · ');
  return `
    <tr>
      <td><strong>${label}</strong></td>
      <td>${value || '<span class="hint">—</span>'}</td>
      <td>${expiryHtml}</td>
      <td>${photoCell}</td>
    </tr>`;
}

async function loadFile() {
  const host = document.getElementById('fileHost');
  const { profile, manager, employment_contracts, rental_contracts, protocols, assignments } = await Api.get(`/api/hr/personnel/${TARGET_ID}`);

  document.getElementById('pageTitle') && (document.getElementById('pageTitle').textContent = profile.full_name);

  host.innerHTML = `
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head">
          <h2>${profile.full_name}</h2>
          <span>
            <span class="badge ${profile.status === 'active' ? 'badge-green' : 'badge-muted'}">${profile.status === 'active' ? 'Активен' : 'Спрян'}</span>
            ${profile.blacklisted ? '<span class="badge badge-danger" style="margin-left:6px;">Черен списък</span>' : ''}
          </span>
        </div>
        ${CAN_EDIT ? `
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
          <button type="button" class="btn btn-ghost btn-sm" id="toggleStatusBtn">${profile.status === 'active' ? 'Спри профила' : 'Активирай профила'}</button>
          <button type="button" class="btn btn-ghost btn-sm" id="sendPersonnelLinkBtn">Изпрати линк за допълване на досие</button>
          ${CURRENT_USER.role === 'admin' ? `
          <button type="button" class="btn btn-ghost btn-sm" id="toggleBlacklistBtn">${profile.blacklisted ? 'Извади от черен списък' : 'Вкарай в черен списък'}</button>
          ${!IS_SELF ? `<button type="button" class="btn btn-ghost btn-sm" id="deleteEmployeeBtn" style="color:var(--danger);">Изтрий служителя</button>` : ''}` : ''}
        </div>
        ${profile.blacklisted && profile.blacklist_reason ? `<p class="hint" style="margin-top:-8px;">Причина за черния списък: ${profile.blacklist_reason}</p>` : ''}
        ` : ''}
        <div class="table-wrap"><table>
          <tr><td><strong>Имейл</strong></td><td>${profile.email}</td></tr>
          <tr><td><strong>Телефон</strong></td><td>${profile.phone || '—'}</td></tr>
          <tr><td><strong>Роля</strong></td><td>${ROLE_LABELS[profile.role] || profile.role}</td></tr>
          <tr><td><strong>Мениджър</strong></td><td>${manager ? manager.full_name : '<span class="hint">не е зададен</span>'}</td></tr>
          <tr><td><strong>ЕГН</strong></td><td>${profile.egn ? `<span id="egnMasked">${'•'.repeat(Math.max(profile.egn.length - 4, 0))}${profile.egn.slice(-4)}</span><span id="egnFull" style="display:none;">${profile.egn}</span> <button type="button" class="btn btn-ghost btn-sm" id="egnToggleBtn" style="padding:2px 8px;font-size:.68rem;">Покажи</button>` : '<span class="hint">—</span>'}</td></tr>
          <tr><td><strong>Адрес</strong></td><td>${profile.address || '<span class="hint">—</span>'}</td></tr>
        </table></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Лични документи</h2></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Документ</th><th>Номер</th><th>Валиден до</th><th>Снимки</th></tr></thead>
          <tbody>
            ${docFieldRow('Лична карта', profile.id_card_number, profile.id_card_expiry, profile.id_card_photo_url, profile.id_card_photo_back_url)}
            ${docFieldRow('Шофьорска книжка', profile.driver_license_number, profile.driver_license_expiry, profile.driver_license_photo_url, profile.driver_license_photo_back_url)}
            <tr>
              <td><strong>Селфи</strong></td>
              <td colspan="2"><span class="hint">—</span></td>
              <td>${profile.selfie_photo_url ? `<a href="${profile.selfie_photo_url}" target="_blank">Преглед</a>` : '<span class="hint">няма</span>'}</td>
            </tr>
          </tbody>
        </table></div>
      </div>
    </div>

    ${CAN_EDIT ? `
    <div class="panel">
      <div class="panel-head"><h2>Редактиране на документи</h2></div>
      <div class="success-box" id="editSuccess"></div>
      <div class="error-box" id="editError"></div>
      <form id="editForm">
        <div class="field-row">
          <div class="field"><label>Име</label><input name="full_name" value="${profile.full_name || ''}" required></div>
          <div class="field"><label>Телефон</label><input name="phone" value="${profile.phone || ''}"></div>
        </div>
        ${CURRENT_USER.role === 'admin' ? `
        <div class="field-row">
          <div class="field"><label>Имейл</label><input name="email" type="email" value="${profile.email || ''}" required></div>
          <div class="field"><label>Роля</label>
            <select name="role">
              ${Object.keys(ROLE_LABELS).map(r => `<option value="${r}" ${profile.role === r ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('')}
            </select>
          </div>
        </div>` : ''}
        <div class="field-row">
          <div class="field"><label>ЕГН</label><input name="egn" value="${profile.egn || ''}"></div>
          <div class="field"><label>Адрес</label><input name="address" value="${profile.address || ''}"></div>
        </div>
        <div class="field"><label>Мениджър</label>
          <select name="manager_id">
            <option value="">— няма —</option>
            ${MANAGERS.filter(m => m.id !== profile.id).map(m => `<option value="${m.id}" ${profile.manager_id === m.id ? 'selected' : ''}>${m.full_name} (${ROLE_LABELS[m.role] || m.role})</option>`).join('')}
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label>Номер на лична карта</label><input name="id_card_number" value="${profile.id_card_number || ''}"></div>
          <div class="field"><label>Валидна до</label><input name="id_card_expiry" type="date" value="${profile.id_card_expiry || ''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Номер на шофьорска книжка</label><input name="driver_license_number" value="${profile.driver_license_number || ''}"></div>
          <div class="field"><label>Валидна до</label><input name="driver_license_expiry" type="date" value="${profile.driver_license_expiry || ''}"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Запази промените</button>
      </form>
      <div class="field-row" style="margin-top:16px;">
        <div>
          <div class="photo-upload-btn" id="uploadIdCardFrontBtn">🪪 Лична карта — лице</div>
          <input type="file" id="idCardFrontFile" accept="image/*" style="display:none;">
        </div>
        <div>
          <div class="photo-upload-btn" id="uploadIdCardBackBtn">🪪 Лична карта — гръб</div>
          <input type="file" id="idCardBackFile" accept="image/*" style="display:none;">
        </div>
      </div>
      <div class="field-row" style="margin-top:8px;">
        <div>
          <div class="photo-upload-btn" id="uploadLicenseFrontBtn">🚗 Книжка — лице</div>
          <input type="file" id="licenseFrontFile" accept="image/*" style="display:none;">
        </div>
        <div>
          <div class="photo-upload-btn" id="uploadLicenseBackBtn">🚗 Книжка — гръб</div>
          <input type="file" id="licenseBackFile" accept="image/*" style="display:none;">
        </div>
      </div>
      <div class="field-row" style="margin-top:8px;">
        <div>
          <div class="photo-upload-btn" id="uploadSelfieBtn">🤳 Селфи</div>
          <input type="file" id="selfieFile" accept="image/*" style="display:none;">
        </div>
      </div>
      <div class="hint" id="photoMsg"></div>
    </div>` : ''}

    ${(IS_SELF || CAN_EDIT) ? `
    <div class="panel">
      <div class="panel-head"><h2>Портфейл</h2></div>
      <div id="walletHost" class="loading">Зареждане…</div>
      ${CURRENT_USER.role === 'admin' ? `
      <h3 style="margin-top:20px;">Ръчна корекция на баланс</h3>
      <p class="hint">За начални салда, бонуси или корекции — не е истински банков превод, само вътрешна счетоводна корекция.</p>
      <div class="error-box" id="walletAdjError"></div>
      <div class="success-box" id="walletAdjSuccess"></div>
      <form id="walletAdjForm">
        <div class="field-row">
          <div class="field"><label>Сума (€) — може да е отрицателна за тегление *</label><input name="amount" type="number" step="0.01" required></div>
          <div class="field"><label>Бележка</label><input name="note" placeholder="напр. Начално салдо"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Приложи корекция</button>
      </form>` : ''}
    </div>` : ''}

    ${profile.role === 'driver' || profile.role === 'manager' ? `
    <div class="panel">
      <div class="panel-head"><h2>Финансова статистика</h2></div>
      <div id="earningsPeriodPicker"></div>
      <div class="field-row">
        <div class="field"><label>От (седмица, начало)</label><input type="date" id="earnFrom"></div>
        <div class="field"><label>До (седмица, начало)</label><input type="date" id="earnTo"></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="earnRefreshBtn">Обнови</button>
      <div id="earningsHost" style="margin-top:14px;" class="loading">Зареждане…</div>
    </div>` : ''}

    ${profile.role === 'manager' && (CURRENT_USER.role === 'admin' || IS_SELF) ? `
    <div class="panel">
      <div class="panel-head"><h2>Комисионна (дивидент) като мениджър</h2></div>
      <p class="hint">Компенсация за екипа шофьори, зачислени към този мениджър (виж полето „Мениджър“ в досието на всеки шофьор) — процент от заработката на екипа или фиксирана сума на седмица/месец. Пълната таблица с всички партньори е на страница „Партньорски комисионни“.</p>
      <div class="error-box" id="commissionError"></div>
      <div class="success-box" id="commissionSuccess"></div>
      <form id="commissionForm">
        <div class="field"><label>Тип компенсация</label>
          <select name="comp_type" id="compTypeSelect" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}>
            <option value="percentage">Процент от заработката на екипа</option>
            <option value="fixed">Фиксирана сума на период</option>
            <option value="per_active_driver">На активен шофьор (седмично)</option>
          </select>
        </div>
        <div class="field" id="percentageField"><label>Процент (%)</label><input name="percentage" type="number" step="0.01" min="0" max="100" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}></div>
        <div class="field-row" id="fixedFields">
          <div class="field"><label>Фиксирана сума (€)</label><input name="fixed_amount" type="number" step="0.01" min="0" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}></div>
          <div class="field"><label>Период</label>
            <select name="fixed_period" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}><option value="week">Седмично</option><option value="month">Месечно</option></select>
          </div>
        </div>
        <div class="field-row" id="perActiveDriverFields">
          <div class="field"><label>Сума на активен шофьор (€)</label><input name="per_driver_amount" type="number" step="0.01" min="0" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}></div>
          <div class="field"><label>Праг за "активен" (€ за седмицата)</label><input name="qualifying_threshold" type="number" step="0.01" min="0" value="30" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}></div>
        </div>
        <div class="field"><label>Бележки</label><input name="notes" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}></div>
        <div class="field"><label><input type="checkbox" name="active" style="width:auto;display:inline-block;margin-right:6px;" ${CURRENT_USER.role !== 'admin' ? 'disabled' : ''}>Активна комисионна</label></div>
        ${CURRENT_USER.role === 'admin' ? `<button type="submit" class="btn btn-primary btn-sm">Запази</button>` : ''}
      </form>
      <div class="panel-head" style="margin-top:18px;"><h3>Статистика за период</h3></div>
      <div id="commissionPeriodPicker"></div>
      <div class="field-row">
        <div class="field"><label>От</label><input type="date" id="commFrom"></div>
        <div class="field"><label>До</label><input type="date" id="commTo"></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="commRefreshBtn">Обнови статистиката</button>
      <div id="commissionStatsHost" style="margin-top:14px;"></div>
    </div>` : ''}

    <div class="panel">
      <div class="panel-head"><h2>Трудови / граждански договори</h2></div>
      ${employment_contracts.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Номер</th><th>Вид</th><th>Часове/ден</th><th>От</th><th>До</th><th>Седмична удръжка</th><th>Разписване</th><th>Скенер</th><th>Статус</th><th></th></tr></thead>
        <tbody>
          ${employment_contracts.map(c => `
            <tr>
              <td>${c.contract_number}</td>
              <td>${EC_TYPE_LABELS[c.contract_type] || c.contract_type}</td>
              <td>${c.hours_per_day || '—'}</td>
              <td>${fmtDate(c.start_date)}</td>
              <td>${c.end_date ? fmtDate(c.end_date) : '—'}</td>
              <td>${fmtMoney(c.weekly_deduction_amount)}</td>
              <td>${esignStatusBadge(c.signature_status)}</td>
              <td>
                ${c.scan_url ? `<a href="${c.scan_url}" target="_blank">Преглед</a>` : '<span class="hint">няма</span>'}
                ${CAN_EDIT ? `<br><button type="button" class="btn btn-ghost btn-sm ec-scan-btn" data-id="${c.id}" style="padding:2px 8px;font-size:.68rem;margin-top:4px;">${c.scan_url ? 'Смени' : 'Прикачи'}</button>
                <input type="file" class="ec-scan-file" data-id="${c.id}" accept="image/*,application/pdf" style="display:none;">` : ''}
              </td>
              <td>${CAN_EDIT ? `
                <select class="ec-status-select" data-id="${c.id}">
                  <option value="draft" ${c.status==='draft'?'selected':''}>Чернова</option>
                  <option value="active" ${c.status==='active'?'selected':''}>Активен</option>
                  <option value="terminated" ${c.status==='terminated'?'selected':''}>Прекратен</option>
                </select>` : ecStatusBadge(c.status)}</td>
              <td><a class="btn btn-ghost btn-sm" href="/employment-contract-print.html?id=${c.id}&profile_id=${TARGET_ID}">Отвори →</a></td>
            </tr>`).join('')}
        </tbody>
      </table></div>` : `<p class="hint">Няма договори все още.</p>`}

      ${CAN_EDIT ? `
      <h3 style="margin-top:20px;">Нов договор</h3>
      <p class="hint">Ако служителят вече има подписан на хартия договор извън системата, попълнете вида (за удръжката по подразбиране, може да се промени ръчно) и прикачете снимка/PDF на подписания оригинал.</p>
      <div class="error-box" id="ecError"></div>
      <form id="ecForm">
        <div class="field-row">
          <div class="field"><label>Вид *</label>
            <select name="contract_type" id="ecTypeSelect" required>
              <option value="labor">Трудов</option>
              <option value="civil">Граждански</option>
            </select>
          </div>
          <div class="field" id="ecHoursField"><label>Часове на ден *</label>
            <select name="hours_per_day">
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="6">6</option>
              <option value="8">8</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Начална дата *</label><input name="start_date" type="date" required></div>
          <div class="field"><label>Крайна дата</label><input name="end_date" type="date"></div>
        </div>
        <div class="field"><label>Седмична удръжка (€) — по подразбиране от вида, може да се промени ръчно</label><input name="weekly_deduction_amount" type="number" step="0.01" placeholder="оставете празно за стойността по подразбиране"></div>
        <div class="field"><label>Скенер на подписан договор (по избор)</label><input type="file" id="ecScanFile" accept="image/*,application/pdf"></div>
        <div class="hint" id="ecScanMsg"></div>
        <button type="submit" class="btn btn-primary btn-sm">Създай договор</button>
      </form>` : ''}
    </div>

    <div class="grid-2">
      <div class="panel">
        <div class="panel-head"><h2>Договори за наем на кола</h2></div>
        ${rental_contracts.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Номер</th><th>От</th><th>До</th><th>Статус</th><th></th></tr></thead>
          <tbody>
            ${rental_contracts.map(c => `
              <tr><td>${c.contract_number}</td><td>${fmtDate(c.start_date)}</td><td>${c.end_date ? fmtDate(c.end_date) : '—'}</td>
              <td>${c.status}</td><td><a class="btn btn-ghost btn-sm" href="/contract-print.html?id=${c.id}">Отвори →</a></td></tr>`).join('')}
          </tbody>
        </table></div>` : `<p class="hint">Няма договори за наем.</p>`}
      </div>
      <div class="panel">
        <div class="panel-head"><h2>Приемо-предавателни протоколи</h2></div>
        ${protocols.length ? `
        <div class="table-wrap"><table>
          <thead><tr><th>Номер</th><th>Дата</th><th>Вид</th><th></th></tr></thead>
          <tbody>
            ${protocols.map(p => `
              <tr><td>${p.protocol_number}</td><td>${fmtDate(p.date)}</td><td>${p.type === 'handover' ? 'Предаване' : 'Приемане'}</td>
              <td><a class="btn btn-ghost btn-sm" href="/protocol-print.html?id=${p.id}">Отвори →</a></td></tr>`).join('')}
          </tbody>
        </table></div>` : `<p class="hint">Няма протоколи.</p>`}
      </div>
    </div>
  `;

  const editForm = document.getElementById('editForm');
  if (editForm) editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('editError');
    const successBox = document.getElementById('editSuccess');
    errorBox.classList.remove('show'); successBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (!data.manager_id) data.manager_id = null;
    try {
      await Api.put(`/api/hr/personnel/${TARGET_ID}`, data);
      await loadFile();
      const sb = document.getElementById('editSuccess');
      sb.textContent = 'Запазено успешно.';
      sb.classList.add('show');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  function bindPersonnelPhotoUpload(btnId, fileId, endpoint, side, successMsg) {
    const btn = document.getElementById(btnId);
    if (btn) btn.addEventListener('click', () => document.getElementById(fileId).click());
    const fileInput = document.getElementById(fileId);
    if (fileInput) fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const msg = document.getElementById('photoMsg');
      msg.textContent = 'Качване…';
      try {
        const dataUrl = await readFileAsDataUrl(file);
        const body = { photo: dataUrl };
        if (side) body.side = side;
        await Api.post(`/api/hr/personnel/${TARGET_ID}/${endpoint}`, body);
        await loadFile();
        const m = document.getElementById('photoMsg');
        if (m) m.textContent = successMsg;
      } catch (err) { msg.textContent = err.message; }
    });
  }
  bindPersonnelPhotoUpload('uploadIdCardFrontBtn', 'idCardFrontFile', 'id-card-photo', 'front', 'Лицето на личната карта е качено.');
  bindPersonnelPhotoUpload('uploadIdCardBackBtn', 'idCardBackFile', 'id-card-photo', 'back', 'Гърбът на личната карта е качен.');
  bindPersonnelPhotoUpload('uploadLicenseFrontBtn', 'licenseFrontFile', 'license-photo', 'front', 'Лицето на книжката е качено.');
  bindPersonnelPhotoUpload('uploadLicenseBackBtn', 'licenseBackFile', 'license-photo', 'back', 'Гърбът на книжката е качен.');
  bindPersonnelPhotoUpload('uploadSelfieBtn', 'selfieFile', 'selfie-photo', null, 'Селфито е качено.');

  const ecTypeSelect = document.getElementById('ecTypeSelect');
  const ecHoursField = document.getElementById('ecHoursField');
  function syncHoursField() { if (ecHoursField) ecHoursField.style.display = ecTypeSelect.value === 'labor' ? '' : 'none'; }
  if (ecTypeSelect) { ecTypeSelect.addEventListener('change', syncHoursField); syncHoursField(); }

  const ecForm = document.getElementById('ecForm');
  if (ecForm) ecForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('ecError');
    errorBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    delete data.ecScanFile;
    data.profile_id = TARGET_ID;
    if (data.contract_type !== 'labor') delete data.hours_per_day;
    else data.hours_per_day = Number(data.hours_per_day);
    if (!data.end_date) delete data.end_date;
    if (!data.weekly_deduction_amount) delete data.weekly_deduction_amount;
    else data.weekly_deduction_amount = Number(data.weekly_deduction_amount);
    try {
      const { contract } = await Api.post('/api/hr/employment-contracts', data);
      const scanFile = document.getElementById('ecScanFile').files[0];
      if (scanFile) {
        const msg = document.getElementById('ecScanMsg');
        if (msg) msg.textContent = 'Качване на скенера…';
        try {
          const dataUrl = await readFileAsDataUrl(scanFile);
          await Api.post(`/api/hr/employment-contracts/${contract.id}/scan`, { file_base64: dataUrl });
        } catch (scanErr) {
          errorBox.textContent = 'Договорът е създаден, но скенерът не се качи: ' + scanErr.message;
          errorBox.classList.add('show');
        }
      }
      await loadFile();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  document.querySelectorAll('.ec-status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      try { await Api.put(`/api/hr/employment-contracts/${sel.dataset.id}`, { status: sel.value }); }
      catch (err) { alert(err.message); }
    });
  });

  document.querySelectorAll('.ec-scan-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector(`.ec-scan-file[data-id="${btn.dataset.id}"]`).click();
    });
  });
  document.querySelectorAll('.ec-scan-file').forEach(inp => {
    inp.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await readFileAsDataUrl(file);
        await Api.post(`/api/hr/employment-contracts/${inp.dataset.id}/scan`, { file_base64: dataUrl });
        await loadFile();
      } catch (err) { alert(err.message); }
    });
  });

  const egnToggleBtn = document.getElementById('egnToggleBtn');
  if (egnToggleBtn) egnToggleBtn.addEventListener('click', () => {
    const masked = document.getElementById('egnMasked');
    const full = document.getElementById('egnFull');
    const showing = full.style.display !== 'none';
    masked.style.display = showing ? '' : 'none';
    full.style.display = showing ? 'none' : '';
    egnToggleBtn.textContent = showing ? 'Покажи' : 'Скрий';
  });

  const toggleStatusBtn = document.getElementById('toggleStatusBtn');
  if (toggleStatusBtn) toggleStatusBtn.addEventListener('click', async () => {
    const newStatus = profile.status === 'active' ? 'suspended' : 'active';
    if (!confirm(newStatus === 'active' ? 'Активирай профила на служителя?' : 'Спри профила на служителя?')) return;
    try { await Api.put(`/api/hr/personnel/${TARGET_ID}`, { status: newStatus }); await loadFile(); }
    catch (err) { alert(err.message); }
  });

  const sendPersonnelLinkBtn = document.getElementById('sendPersonnelLinkBtn');
  if (sendPersonnelLinkBtn) sendPersonnelLinkBtn.addEventListener('click', async () => {
    try {
      const { link } = await Api.post(`/api/hr/personnel/${TARGET_ID}/send-link`, {});
      try { await navigator.clipboard.writeText(link); } catch (e) { /* без достъп до клипборда — показваме линка директно */ }
      prompt('Линкът е копиран (ако браузърът позволи). Изпрати го на служителя през Viber/SMS/имейл, за да допълни/обнови досието си:', link);
    } catch (err) { alert(err.message); }
  });

  const toggleBlacklistBtn = document.getElementById('toggleBlacklistBtn');
  if (toggleBlacklistBtn) toggleBlacklistBtn.addEventListener('click', async () => {
    try {
      if (profile.blacklisted) {
        if (!confirm('Да извадим ли служителя от черния списък?')) return;
        await Api.post(`/api/hr/personnel/${TARGET_ID}/blacklist`, { blacklisted: false });
      } else {
        const reason = prompt('Причина за вкарване в черен списък (по избор):') || '';
        await Api.post(`/api/hr/personnel/${TARGET_ID}/blacklist`, { blacklisted: true, reason });
      }
      await loadFile();
    } catch (err) { alert(err.message); }
  });

  const deleteEmployeeBtn = document.getElementById('deleteEmployeeBtn');
  if (deleteEmployeeBtn) deleteEmployeeBtn.addEventListener('click', async () => {
    if (!confirm(`Сигурни ли сте, че искате да изтриете служителя ${profile.full_name}? Това действие е необратимо.`)) return;
    try {
      await Api.del(`/api/hr/personnel/${TARGET_ID}`);
      window.location = '/personnel.html';
    } catch (err) { alert(err.message); }
  });

  if (IS_SELF || CAN_EDIT) loadWallet();
  if (document.getElementById('earningsHost')) initEarningsPanel();
  if (document.getElementById('commissionForm')) initCommissionPanel();
}

// -------- Финансова статистика (заработка / удръжки / изплащане) ------------
function initEarningsPanel() {
  const fromInput = document.getElementById('earnFrom');
  const toInput = document.getElementById('earnTo');
  fromInput.value = addDaysStr(currentWeekStart(), -7 * 8); // последните ~8 седмици по подразбиране
  toInput.value = todayStr();
  mountPeriodPicker(document.getElementById('earningsPeriodPicker'), fromInput, toInput, {
    useMonthPreset: true, onApply: () => loadEarnings(),
  });
  document.getElementById('earnRefreshBtn').addEventListener('click', loadEarnings);
  loadEarnings();
}

const PLATFORM_LABELS = { bolt: 'Bolt', glovo: 'Glovo' };
function platformBreakdownLine(e) {
  const pb = e.platform_breakdown;
  if (!pb || !Object.keys(pb).length) return '';
  return `<div class="hint" style="font-size:.72rem;margin-top:2px;">${Object.entries(pb).map(([k, v]) => `${PLATFORM_LABELS[k] || k}: ${fmtMoney(v)}`).join(' · ')}</div>`;
}

async function loadEarnings() {
  const host = document.getElementById('earningsHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const from = document.getElementById('earnFrom').value;
  const to = document.getElementById('earnTo').value;
  try {
    const { entries, earnings_visible } = await Api.get(`/api/hr/payroll?profile_id=${TARGET_ID}`);
    const periodEntries = entries.filter(e => (!from || e.week_start >= from) && (!to || e.week_start <= to));
    const totalOrders = periodEntries.reduce((s, e) => s + Number(e.order_count || 0), 0);
    if (!earnings_visible) {
      host.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card"><div class="label">Поръчки за периода</div><div class="value">${totalOrders}</div></div>
        </div>
        <p class="hint">Сумите не са видими за вас за този профил.</p>`;
      return;
    }
    const totalGross = periodEntries.reduce((s, e) => s + Number(e.gross_earnings || 0), 0);
    const totalDeduction = periodEntries.reduce((s, e) => s + Number(e.deduction_amount || 0), 0);
    const totalNet = periodEntries.reduce((s, e) => s + Number(e.net_amount || 0), 0);
    const totalPaid = periodEntries.filter(e => e.paid).reduce((s, e) => s + Number(e.net_amount || 0), 0);
    const totalUnpaid = totalNet - totalPaid;
    // сборове по платформа (Bolt/Glovo/...) — от платформената разбивка,
    // запазена при импорта (виж platform_breakdown в payroll_entries)
    const platformTotals = {};
    periodEntries.forEach(e => {
      if (!e.platform_breakdown) return;
      Object.entries(e.platform_breakdown).forEach(([k, v]) => {
        platformTotals[k] = (platformTotals[k] || 0) + Number(v || 0);
      });
    });
    const platformTotalsLine = Object.keys(platformTotals).length
      ? `<p class="hint" style="margin-top:-14px;margin-bottom:10px;">По платформа: ${Object.entries(platformTotals).map(([k, v]) => `<strong>${PLATFORM_LABELS[k] || k}</strong>: ${fmtMoney(v)}`).join(' · ')}</p>` : '';
    host.innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Поръчки за периода</div><div class="value">${totalOrders}</div></div>
        <div class="stat-card"><div class="label">Изкарани пари (от платформата)</div><div class="value">${fmtMoney(totalGross)}</div></div>
        <div class="stat-card"><div class="label">Приход за фирмата (седмични такси)</div><div class="value green">${fmtMoney(totalDeduction)}</div></div>
        <div class="stat-card"><div class="label">За изплащане на служителя общо</div><div class="value">${fmtMoney(totalNet)}</div></div>
        <div class="stat-card"><div class="label">Изплатено вече</div><div class="value green">${fmtMoney(totalPaid)}</div></div>
        <div class="stat-card"><div class="label">Остава да се плати</div><div class="value ${totalUnpaid > 0 ? 'warn' : ''}">${fmtMoney(totalUnpaid)}</div></div>
      </div>
      ${platformTotalsLine}
      <p class="hint" style="margin-top:8px;">„Приход за фирмата“ е сборът от седмичните такси/удръжки, събрани от служителя — реалният паричен приход на фирмата от него. Удръжката е една обща седмична такса по договора, не се разделя по платформа. Не изважда споделени разходи (кола, сервиз и др.), затова не е чиста печалба — пълният отчет с разходи е на страница „Счетоводство“.</p>
      ${periodEntries.length ? `
      <div class="table-wrap" style="margin-top:10px;"><table>
        <thead><tr><th>Седмица</th><th>Поръчки</th><th>Заработка</th><th>Удръжка</th><th>За изплащане</th><th>Платено</th><th></th></tr></thead>
        <tbody>
          ${periodEntries.sort((a, b) => (a.week_start < b.week_start ? 1 : -1)).map(e => `
            <tr>
              <td>${weekRangeLabel(e.week_start, e.week_end)}</td>
              <td>${e.order_count || 0}</td>
              <td>${fmtMoney(e.gross_earnings)}${platformBreakdownLine(e)}</td>
              <td>${fmtMoney(e.deduction_amount)}</td>
              <td><strong>${fmtMoney(e.net_amount)}</strong></td>
              <td>${e.paid ? '<span class="badge badge-green">Платено</span>' : '<span class="badge badge-warn">Дължимо</span>'}</td>
              <td>${(CURRENT_USER.role === 'admin' && !e.paid) ? `<button type="button" class="btn btn-ghost btn-sm earn-mark-paid-btn" data-id="${e.id}" style="padding:2px 8px;font-size:.68rem;">Маркирай платено</button>` : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>` : `<p class="hint">Няма записи за избрания период.</p>`}
    `;
    host.querySelectorAll('.earn-mark-paid-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await Api.post(`/api/hr/payroll/${btn.dataset.id}/mark-paid`, { paid: true }); await loadEarnings(); }
        catch (err) { alert(err.message); }
      });
    });
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

// -------- Комисионна (дивидент) на мениджър от неговия екип ------------------
function toggleCommissionFields() {
  const form = document.getElementById('commissionForm');
  const type = form.comp_type.value;
  document.getElementById('percentageField').style.display = type === 'percentage' ? '' : 'none';
  document.getElementById('fixedFields').style.display = type === 'fixed' ? '' : 'none';
  document.getElementById('perActiveDriverFields').style.display = type === 'per_active_driver' ? '' : 'none';
}

async function initCommissionPanel() {
  const compTypeSelect = document.getElementById('compTypeSelect');
  compTypeSelect.addEventListener('change', toggleCommissionFields);

  const commFrom = document.getElementById('commFrom');
  const commTo = document.getElementById('commTo');
  commFrom.value = previousWeekStart();
  commTo.value = previousWeekStart();
  mountPeriodPicker(document.getElementById('commissionPeriodPicker'), commFrom, commTo, {
    wireWeekEnd: false, weekPresetMode: 'single', useMonthPreset: true, onApply: () => loadCommissionStats(),
  });
  document.getElementById('commRefreshBtn').addEventListener('click', loadCommissionStats);

  try {
    const { commission } = await Api.get(`/api/hr/partners/${TARGET_ID}`);
    const form = document.getElementById('commissionForm');
    form.comp_type.value = (commission && commission.comp_type) || 'percentage';
    form.percentage.value = (commission && commission.percentage != null) ? commission.percentage : '';
    form.fixed_amount.value = (commission && commission.fixed_amount != null) ? commission.fixed_amount : '';
    form.fixed_period.value = (commission && commission.fixed_period) || 'month';
    form.per_driver_amount.value = (commission && commission.per_driver_amount != null) ? commission.per_driver_amount : '';
    form.qualifying_threshold.value = (commission && commission.qualifying_threshold != null) ? commission.qualifying_threshold : 30;
    form.notes.value = (commission && commission.notes) || '';
    form.active.checked = commission ? commission.active !== false : true;
    toggleCommissionFields();
  } catch (err) {
    const eb = document.getElementById('commissionError');
    eb.textContent = err.message;
    eb.classList.add('show');
  }

  if (CURRENT_USER.role === 'admin') {
    document.getElementById('commissionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('commissionError');
      const successBox = document.getElementById('commissionSuccess');
      errorBox.classList.remove('show'); successBox.classList.remove('show');
      const form = e.target;
      const patch = {
        comp_type: form.comp_type.value,
        percentage: form.percentage.value ? Number(form.percentage.value) : null,
        fixed_amount: form.fixed_amount.value ? Number(form.fixed_amount.value) : null,
        fixed_period: form.fixed_period.value,
        per_driver_amount: form.per_driver_amount.value ? Number(form.per_driver_amount.value) : null,
        qualifying_threshold: form.qualifying_threshold.value ? Number(form.qualifying_threshold.value) : 30,
        notes: form.notes.value || null,
        active: form.active.checked,
      };
      try {
        await Api.put(`/api/hr/partners/${TARGET_ID}`, patch);
        successBox.textContent = 'Комисионната е запазена.';
        successBox.classList.add('show');
        await loadCommissionStats();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }

  await loadCommissionStats();
}

async function loadCommissionStats() {
  const host = document.getElementById('commissionStatsHost');
  if (!host) return;
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const from = document.getElementById('commFrom').value;
  const to = document.getElementById('commTo').value;
  const qs = new URLSearchParams();
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);
  try {
    const stats = await Api.get(`/api/hr/partners/${TARGET_ID}/stats?${qs.toString()}`);
    const isPerActiveDriver = stats.commission && stats.commission.comp_type === 'per_active_driver';
    host.innerHTML = `
      <p class="hint">⚠️ Базата за изчисление засега е заработката (заплати) на екипа за периода — приблизителна стойност, докато не бъде готов реалният приход по служител. Не е окончателна счетоводна сума.</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Шофьори в екипа</div><div class="value">${stats.team_size}</div></div>
        <div class="stat-card"><div class="label">Отчетени седмици</div><div class="value">${stats.weeks_covered}</div></div>
        <div class="stat-card"><div class="label">Общо поръчки</div><div class="value">${stats.total_orders}</div></div>
        <div class="stat-card"><div class="label">Заработка на екипа</div><div class="value">${fmtMoney(stats.total_gross_earnings)}</div></div>
        ${isPerActiveDriver ? `<div class="stat-card"><div class="label">Активни шофьор-седмици (&gt; ${stats.qualifying_threshold} €)</div><div class="value">${stats.total_qualifying_driver_weeks}</div></div>` : ''}
        <div class="stat-card"><div class="label">Дължима комисионна</div><div class="value green">${fmtMoney(stats.commission_owed)}</div></div>
      </div>`;
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

const WALLET_TX_TYPE_LABELS = {
  transfer: 'Превод между потребители',
  admin_adjustment: 'Ръчна корекция от админ',
  adjustment: 'Корекция',
};
function walletTxBadge(t) {
  const positive = Number(t.amount) >= 0;
  return `<span class="badge ${positive ? 'badge-green' : 'badge-danger'}">${positive ? '+' : ''}${fmtMoney(t.amount)}</span>`;
}

async function loadWallet() {
  const host = document.getElementById('walletHost');
  if (!host) return;
  try {
    const { balance, transactions } = await Api.get(`/api/wallet/users/${TARGET_ID}`);
    host.innerHTML = `
      <div class="stat-card" style="margin-bottom:16px;">
        <div class="label">Текущо салдо</div>
        <div class="value">${fmtMoney(balance)}</div>
      </div>
      ${transactions.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Кога</th><th>Вид</th><th>Сума</th><th>Бележка</th></tr></thead>
        <tbody>
          ${transactions.map(t => `
            <tr><td>${fmtDateTime(t.created_at)}</td><td>${WALLET_TX_TYPE_LABELS[t.type] || t.type}</td>
            <td>${walletTxBadge(t)}</td><td>${t.note || '—'}</td></tr>`).join('')}
        </tbody>
      </table></div>` : `<p class="hint">Няма транзакции все още.</p>`}
    `;
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }

  // формата стои извън #walletHost (не се пресъздава при всяко презареждане на
  // салдото), затова закачаме listener-а само веднъж (пази от натрупване на
  // дублирани listener-и и двойно изпращане при повторни корекции)
  const walletAdjForm = document.getElementById('walletAdjForm');
  if (walletAdjForm && !walletAdjForm.dataset.bound) {
    walletAdjForm.dataset.bound = '1';
    walletAdjForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('walletAdjError');
      const successBox = document.getElementById('walletAdjSuccess');
      errorBox.classList.remove('show'); successBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.user_id = TARGET_ID;
      try {
        await Api.post('/api/wallet/adjustments', data);
        successBox.textContent = 'Корекцията е приложена.';
        successBox.classList.add('show');
        e.target.reset();
        await loadWallet();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }
}

async function init() {
  // "Моите досие" (шофьор, без ?id=) е отделен nav елемент от "Досиета на
  // служители" (админ/мениджър списък) — маркираме правилния активен линк
  // в sidebar-а, преди mountShell() да прочете data-active атрибута.
  const shellEl = document.getElementById('app-shell');
  if (shellEl) shellEl.dataset.active = qs('id') ? '/personnel.html' : '/personnel-detail.html';

  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;

  TARGET_ID = qs('id') || CURRENT_USER.id;
  IS_SELF = TARGET_ID === CURRENT_USER.id;
  CAN_EDIT = ['admin', 'manager'].includes(CURRENT_USER.role);

  if (!IS_SELF && !CAN_EDIT) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате това досие.</div>`;
    return;
  }

  if (CAN_EDIT) {
    try {
      const { users } = await Api.get('/api/users');
      MANAGERS = users;
    } catch (e) { MANAGERS = []; }
  }

  document.getElementById('app-content').innerHTML = `
    <div style="margin-bottom:12px;"><a href="/personnel.html" class="btn btn-ghost btn-sm">← Всички служители</a></div>
    <div id="fileHost" class="loading">Зареждане…</div>`;

  try {
    await loadFile();
  } catch (err) {
    document.getElementById('fileHost').innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
