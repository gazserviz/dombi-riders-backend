<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Досие на служител — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<script>(function(){try{if(localStorage.getItem('dombi_theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
</head>
<body>
<div id="app-shell" data-active="/personnel.html" data-title="Досие на служител"></div>

<script src="/js/app.js"></script>
<script src="/js/esign-ui.js"></script>
<script>
const EC_STATUS = {
  draft: ['Чернова', 'badge-muted'],
  active: ['Активен', 'badge-green'],
  terminated: ['Прекратен', 'badge-danger'],
};
function ecStatusBadge(s) { const [label, cls] = EC_STATUS[s] || [s, 'badge-muted']; return `<span class="badge ${cls}">${label}</span>`; }
const EC_TYPE_LABELS = { labor: 'Трудов', civil: 'Граждански' };
// статуси на договор за наем на кола — огледално на STATUS_LABELS в
// contracts.html, за да съвпадат етикетите навсякъде в системата
const RC_STATUS = {
  draft: ['Чернова', 'badge-muted'],
  active: ['Активен', 'badge-green'],
  completed: ['Приключен', 'badge-muted'],
  terminated: ['Прекратен', 'badge-danger'],
};
function rcStatusBadge(s) { const [label, cls] = RC_STATUS[s] || [s, 'badge-muted']; return `<span class="badge ${cls}">${label}</span>`; }
// обобщение на удръжката за реда в таблицата с договори — процентна (с
// опционален втори праг) или фиксирана сума, вж. computeContractDeduction в
// lib/db.js за точната формула, която стои зад тези числа.
function deductionSummary(c) {
  if (c.deduction_type === 'percentage') {
    const base = `${c.deduction_percentage ?? 0}%`;
    if (c.deduction_threshold_amount != null && c.deduction_percentage_above_threshold != null) {
      return `${base} <span class="hint">до ${fmtMoney(c.deduction_threshold_amount)}, ${c.deduction_percentage_above_threshold}% над това</span>`;
    }
    return `${base} <span class="hint">от заработката</span>`;
  }
  return fmtMoney(c.weekly_deduction_amount);
}

// компактно обобщение "на какъв договор е служителят към момента" — изрично
// искане на потребителя да се вижда директно в досието (не само ровене в
// таблиците по-долу): активен трудов/граждански договор + активен наем на
// кола (ако е Dombi куриер — наемът се удържа автоматично от заплатата, вж.
// getDefaultPayrollDeductions в lib/db.js; за друг наемател/лично ползване —
// плаща се отделно в брой).
const RATE_PERIOD_DAYS = { day: 1, week: 7, month: 30 };
const RATE_PERIOD_LABELS = { day: 'ден', week: 'седмица', month: 'месец' };
function activeContractSummaries(employmentContracts, rentalContracts) {
  const activeEc = (employmentContracts || []).find(c => c.status === 'active');
  const ecLabel = activeEc
    ? `${EC_TYPE_LABELS[activeEc.contract_type] || activeEc.contract_type}${activeEc.hours_per_day ? ' · ' + activeEc.hours_per_day + ' ч./ден' : ''} · Удръжка: ${deductionSummary(activeEc)}`
    : '<span class="hint">Няма активен трудов/граждански договор</span>';

  const activeRental = (rentalContracts || []).find(c => c.status === 'active');
  let rentalLabel = '<span class="hint">Няма активен наем на кола</span>';
  if (activeRental) {
    const days = RATE_PERIOD_DAYS[activeRental.rate_period] || 7;
    const weekly = Math.round((Number(activeRental.rate_amount || 0) / days) * 7 * 100) / 100;
    const note = activeRental.renter_type === 'dombi_courier' ? 'удържа се от заплатата' : 'плаща се отделно в брой';
    rentalLabel = `${activeRental.vehicle_plate_number || '—'} · ${fmtMoney(activeRental.rate_amount)} / ${RATE_PERIOD_LABELS[activeRental.rate_period] || activeRental.rate_period} <span class="hint">(≈ ${fmtMoney(weekly)}/седмица, ${note})</span>`;
  }
  return { ecLabel, rentalLabel };
}

function qs(name) { return new URLSearchParams(location.search).get(name); }
function daysLeftLabel(n) {
  if (n < 0) return `Просрочено с ${Math.abs(n)} дни`;
  if (n === 0) return 'Изтича днес';
  return `След ${n} дни`;
}

let CURRENT_USER = null;
let TARGET_ID = null;
let IS_SELF = false;
let CAN_EDIT = false;
let MANAGERS = [];
// заредени еднократно в init() (CAN_EDIT) — за селектора "Кола" във формата
// "Зачисли нает автомобил" по-долу; огледално на MANAGERS по-горе
let ALL_VEHICLES = [];
// кой в момента държи дадена кола (вж. зареждането в init() по-долу) —
// обединява активните зачисления (vehicle_assignments) И самостоятелните
// активни договори за наем без assignment_id (вж. коментара над
// assignmentsTab във vehicle-detail.html за същия модел/бъг), за да хванем
// И колите, заети направо през тази форма от друго досие. Ползва се в
// бързото поле "Нает автомобил" по-долу, за да предупредим администратора,
// ако избере кола, вече заета от друг, вместо тихо да я прехвърлим.
let VEHICLE_HOLDER_BY_ID = {};
// запазени тук (от loadFile), за да могат initEarningsPanel/loadEarnings да
// покажат "на какъв договор е" служителят в компактния обобщен изглед, без
// да правят отделна заявка само за това
let CURRENT_EMPLOYMENT_CONTRACTS = [];
let CURRENT_RENTAL_CONTRACTS = [];

// бутон "✕" за премахване на качена снимка на документ (напр. качена по
// грешка/сгрешена/разменена лице↔гръб) — вика DELETE към съответния endpoint
// (виж removeDocPhotoBtn делегирания listener по-долу); показва се само на
// CAN_EDIT (админ/мениджър), а не на самия служител през личния му изглед
function removeDocPhotoBtn(endpoint, side) {
  if (!CAN_EDIT) return '';
  return `<button type="button" class="btn btn-ghost btn-sm doc-remove-btn" data-endpoint="${endpoint}" ${side ? `data-side="${side}"` : ''} title="Премахни снимката" style="padding:1px 6px;font-size:.66rem;color:var(--danger);margin-left:4px;">✕</button>`;
}

function docFieldRow(label, value, expiry, photoFrontUrl, photoBackUrl, endpoint) {
  let expiryHtml = '—';
  if (expiry) {
    const diff = new Date(expiry) - new Date();
    const daysLeft = Math.round(diff / 86400000);
    const soon = daysLeft < 30;
    expiryHtml = `${fmtDate(expiry)} ${soon ? `<span class="badge ${daysLeft < 0 ? 'badge-danger' : 'badge-warn'}" style="margin-left:6px;">${daysLeftLabel(daysLeft)}</span>` : ''}`;
  }
  const photoCell = [
    photoFrontUrl
      ? `<a href="${photoFrontUrl}" target="_blank">Лице</a> ${docActionButtons(photoFrontUrl, `${label}-лице${(photoFrontUrl.match(/\.[a-zA-Z0-9]+$/)||['.jpg'])[0]}`, `${label} — лице`)}${removeDocPhotoBtn(endpoint, 'front')}`
      : '<span class="hint">няма лице</span>',
    photoBackUrl
      ? `<a href="${photoBackUrl}" target="_blank">Гръб</a> ${docActionButtons(photoBackUrl, `${label}-гръб${(photoBackUrl.match(/\.[a-zA-Z0-9]+$/)||['.jpg'])[0]}`, `${label} — гръб`)}${removeDocPhotoBtn(endpoint, 'back')}`
      : '<span class="hint">няма гръб</span>',
  ].join('<br>');
  return `
    <tr>
      <td><strong>${label}</strong></td>
      <td>${value || '<span class="hint">—</span>'}</td>
      <td>${expiryHtml}</td>
      <td>${photoCell}</td>
    </tr>`;
}

async function loadFile() {
  const host = document.getElementById('fileHost');
  const { profile, manager, employment_contracts, rental_contracts, protocols, assignments } = await Api.get(`/api/hr/personnel/${TARGET_ID}`);
  CURRENT_EMPLOYMENT_CONTRACTS = employment_contracts;
  CURRENT_RENTAL_CONTRACTS = rental_contracts;
  const contractSummaries = activeContractSummaries(employment_contracts, rental_contracts);
  // текущите активни договор/наем — за бързите полета "Договор и кола" във
  // формата "Редактиране на документи" по-долу (изрично искане на
  // потребителя да може да смени таксата/вида/колата точно оттам, без да се
  // налага да скролва до отделните таблици с договори)
  const activeEc = (employment_contracts || []).find(c => c.status === 'active');
  const activeRental = (rental_contracts || []).find(c => c.status === 'active');

  document.getElementById('pageTitle') && (document.getElementById('pageTitle').textContent = profile.full_name);

  host.innerHTML = `
    <div class="grid-2">
      <div class="panel">
        <div class="panel-head">
          <h2>${profile.full_name}</h2>
          <span>
            <span class="badge ${profile.status === 'active' ? 'badge-green' : 'badge-muted'}">${profile.status === 'active' ? 'Активен' : 'Спрян'}</span>
            ${profile.blacklisted ? '<span class="badge badge-danger" style="margin-left:6px;">Черен списък</span>' : ''}
          </span>
        </div>
        ${CAN_EDIT ? `
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
          <button type="button" class="btn btn-ghost btn-sm" id="toggleStatusBtn">${profile.status === 'active' ? 'Спри профила' : 'Активирай профила'}</button>
          <button type="button" class="btn btn-ghost btn-sm" id="sendPersonnelLinkBtn">Изпрати линк за допълване на досие</button>
          ${['admin', 'super_admin'].includes(CURRENT_USER.role) ? `
          <button type="button" class="btn btn-ghost btn-sm" id="toggleBlacklistBtn">${profile.blacklisted ? 'Извади от черен списък' : 'Вкарай в черен списък'}</button>
          ${!IS_SELF ? `<button type="button" class="btn btn-ghost btn-sm" id="deleteEmployeeBtn" style="color:var(--danger);">Изтрий служителя</button>` : ''}` : ''}
        </div>
        ${profile.blacklisted && profile.blacklist_reason ? `<p class="hint" style="margin-top:-8px;">Причина за черния списък: ${profile.blacklist_reason}</p>` : ''}
        ` : ''}
        <div class="table-wrap"><table>
          <tr><td><strong>Имейл</strong></td><td>${profile.email}</td></tr>
          <tr><td><strong>Телефон</strong></td><td>${profile.phone || '—'}</td></tr>
          <tr><td><strong>Роля</strong></td><td>${ROLE_LABELS[profile.role] || profile.role}</td></tr>
          <tr><td><strong>Мениджър</strong></td><td>${manager ? manager.full_name : '<span class="hint">не е зададен</span>'}</td></tr>
          <tr><td><strong>ЕГН</strong></td><td>${profile.egn ? `<span id="egnMasked">${'•'.repeat(Math.max(profile.egn.length - 4, 0))}${profile.egn.slice(-4)}</span><span id="egnFull" style="display:none;">${profile.egn}</span> <button type="button" class="btn btn-ghost btn-sm" id="egnToggleBtn" style="padding:2px 8px;font-size:.68rem;">Покажи</button>` : '<span class="hint">—</span>'}</td></tr>
          ${profile.role === 'driver' ? `
          <tr><td><strong>Glovo ID</strong></td><td>${profile.external_ids && profile.external_ids.glovo_courier_id ? escapeHtml(profile.external_ids.glovo_courier_id) : '<span class="hint">—</span>'}</td></tr>
          <tr><td><strong>Bolt ID</strong></td><td>${profile.external_ids && profile.external_ids.bolt_courier_uid ? escapeHtml(profile.external_ids.bolt_courier_uid) : '<span class="hint">—</span>'}</td></tr>
          <tr><td><strong>Текущ договор</strong></td><td>${contractSummaries.ecLabel} <a href="#employmentContracts" class="hint" style="margin-left:6px;">(промени по-долу)</a></td></tr>
          <tr><td><strong>Наем на кола</strong></td><td>${contractSummaries.rentalLabel} <a href="#rentalContracts" class="hint" style="margin-left:6px;">(промени по-долу)</a></td></tr>
          ` : ''}
          <tr><td><strong>Адрес</strong></td><td>${profile.address || '<span class="hint">—</span>'}</td></tr>
          <tr><td><strong>Град</strong></td><td>${profile.city || '<span class="hint">—</span>'}</td></tr>
          <tr><td><strong>Начало на работа</strong></td><td>${profile.start_date ? fmtDate(profile.start_date) : '<span class="hint">—</span>'}</td></tr>
          <tr><td><strong>Край на работа</strong></td><td>${profile.end_date ? fmtDate(profile.end_date) : '<span class="hint">—</span>'}</td></tr>
        </table></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h2>Лични документи</h2></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Документ</th><th>Номер</th><th>Валиден до</th><th>Снимки</th></tr></thead>
          <tbody>
            ${docFieldRow('Лична карта', profile.id_card_number, profile.id_card_expiry, profile.id_card_photo_url, profile.id_card_photo_back_url, 'id-card-photo')}
            ${docFieldRow('Шофьорска книжка', profile.driver_license_number, profile.driver_license_expiry, profile.driver_license_photo_url, profile.driver_license_photo_back_url, 'license-photo')}
            <tr>
              <td><strong>Селфи</strong></td>
              <td colspan="2"><span class="hint">—</span></td>
              <td>${profile.selfie_photo_url ? `<a href="${profile.selfie_photo_url}" target="_blank">Преглед</a>${removeDocPhotoBtn('selfie-photo')}` : '<span class="hint">няма</span>'}</td>
            </tr>
          </tbody>
        </table></div>
      </div>
    </div>

    ${CAN_EDIT ? `
    <div class="panel">
      <div class="panel-head"><h2>Редактиране на документи</h2></div>
      <div class="success-box" id="editSuccess"></div>
      <div class="error-box" id="editError"></div>
      <form id="editForm">
        <div class="field-row">
          <div class="field"><label>Име</label><input name="full_name" value="${profile.full_name || ''}" required></div>
          <div class="field"><label>Телефон</label><input name="phone" value="${profile.phone || ''}"></div>
        </div>
        ${['admin', 'super_admin'].includes(CURRENT_USER.role) ? `
        <div class="field-row">
          <div class="field"><label>Имейл</label><input name="email" type="email" value="${profile.email || ''}" required></div>
          <div class="field"><label>Роля</label>
            <select name="role">
              ${Object.keys(ROLE_LABELS).map(r => `<option value="${r}" ${profile.role === r ? 'selected' : ''}>${ROLE_LABELS[r]}</option>`).join('')}
            </select>
          </div>
        </div>` : ''}
        <div class="field-row">
          <div class="field"><label>ЕГН</label><input name="egn" value="${profile.egn || ''}"></div>
          <div class="field"><label>Адрес</label><input name="address" value="${profile.address || ''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Град</label>
            <select name="city">${cityOptions(profile.city)}</select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Начало на работа</label><input name="start_date" type="date" value="${profile.start_date || ''}"></div>
          <div class="field"><label>Край на работа</label><input name="end_date" type="date" value="${profile.end_date || ''}"></div>
        </div>
        <div class="field"><label>Мениджър</label>
          <select name="manager_id">
            <option value="">— няма —</option>
            ${MANAGERS.filter(m => m.id !== profile.id).map(m => `<option value="${m.id}" ${profile.manager_id === m.id ? 'selected' : ''}>${m.full_name} (${ROLE_LABELS[m.role] || m.role})</option>`).join('')}
          </select>
        </div>
        ${profile.role === 'driver' ? `
        <h3 style="margin-top:16px;margin-bottom:2px;">Договор и кола</h3>
        <p class="hint" style="margin-top:0;">Прилага се върху текущия активен договор/наем, или създава нов — ако искате пълен контрол над удръжката (процентна, прагове и др.) или наема (депозит, период), използвайте „Редакция на всички параметри“ в таблиците по-долу.</p>
        <div class="field-row">
          <div class="field"><label>Тип договор</label>
            <select name="ec_contract_type" id="editEcType">
              <option value="">— без промяна —</option>
              <option value="labor" ${activeEc && activeEc.contract_type === 'labor' ? 'selected' : ''}>Трудов</option>
              <option value="civil" ${activeEc && activeEc.contract_type === 'civil' ? 'selected' : ''}>Граждански</option>
            </select>
          </div>
          <div class="field" id="editEcHoursField" style="display:${activeEc && activeEc.contract_type !== 'civil' ? '' : 'none'}"><label>Часове на ден</label>
            <select name="ec_hours_per_day">
              ${[2, 4, 6, 8].map(h => `<option value="${h}" ${activeEc && Number(activeEc.hours_per_day) === h ? 'selected' : ''}>${h}</option>`).join('')}
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Седмична такса / удръжка (€)</label><input name="ec_weekly_deduction_amount" type="number" step="0.01" min="0" value="${activeEc && activeEc.deduction_type !== 'percentage' ? (activeEc.weekly_deduction_amount ?? '') : ''}" placeholder="оставете празно за без промяна"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Нает автомобил</label>
            <select name="rc_vehicle_id" id="editRcVehicle">
              <option value="">— без промяна —</option>
              <option value="__none__">— няма / прекрати наема —</option>
              ${ALL_VEHICLES.map(v => `<option value="${v.id}" ${activeRental && activeRental.vehicle_id === v.id ? 'selected' : ''}>${v.plate_number} — ${v.make} ${v.model}${v.status !== 'available' && !(activeRental && activeRental.vehicle_id === v.id) ? ' (' + (VEHICLE_STATUS_LABELS[v.status] || [v.status])[0] + ')' : ''}</option>`).join('')}
            </select>
            <div class="hint" id="editRcVehicleHint" style="display:none;margin-top:4px;color:var(--warn, #b8860b);"></div>
          </div>
          <div class="field"><label>Наем (€ / седмица)</label><input name="rc_rate_amount" type="number" step="0.01" min="0" value="${activeRental ? (activeRental.rate_amount ?? '') : ''}" placeholder="при нова/сменена кола"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Начална дата на наема</label><input name="rc_start_date" type="date" value="${activeRental ? (activeRental.start_date || todayStr()) : todayStr()}">
            <div class="hint">При нова/сменена кола — от кога започва наемът. При същата кола — коригира началната дата на текущия договор (напр. назад във времето, ако е пропусната по-рано).</div>
          </div>
        </div>
        ` : ''}
        <div class="field-row">
          <div class="field"><label>Номер на лична карта</label><input name="id_card_number" value="${profile.id_card_number || ''}"></div>
          <div class="field"><label>Валидна до</label><input name="id_card_expiry" type="date" value="${profile.id_card_expiry || ''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Дата на издаване на лична карта</label><input name="id_card_issue_date" type="date" value="${profile.id_card_issue_date || ''}"></div>
          <div class="field"><label>Издадена от (МВР – град)</label><input name="id_card_issued_by" value="${profile.id_card_issued_by || ''}" placeholder="напр. МВР София"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Номер на шофьорска книжка</label><input name="driver_license_number" value="${profile.driver_license_number || ''}"></div>
          <div class="field"><label>Валидна до</label><input name="driver_license_expiry" type="date" value="${profile.driver_license_expiry || ''}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Осигурителен статус (за декларация за осигуряване)</label>
            <select name="insurance_status">
              <option value="">— не е зададен —</option>
              <option value="осигурен на друго основание" ${profile.insurance_status === 'осигурен на друго основание' ? 'selected' : ''}>Осигурен на друго основание</option>
              <option value="неосигурен" ${profile.insurance_status === 'неосигурен' ? 'selected' : ''}>Неосигурен</option>
              <option value="самоосигуряващо се лице" ${profile.insurance_status === 'самоосигуряващо се лице' ? 'selected' : ''}>Самоосигуряващо се лице</option>
              <option value="студент/учащ" ${profile.insurance_status === 'студент/учащ' ? 'selected' : ''}>Студент/учащ</option>
              <option value="пенсионер" ${profile.insurance_status === 'пенсионер' ? 'selected' : ''}>Пенсионер</option>
            </select>
          </div>
          <div class="field"><label>Брутна сума (€, по декларация)</label><input name="insurance_gross_amount" type="number" step="0.01" min="0" value="${profile.insurance_gross_amount ?? ''}"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Запази промените</button>
      </form>
      <div class="field-row" style="margin-top:16px;">
        <div>
          <div class="photo-upload-btn" id="uploadIdCardFrontBtn">🪪 Лична карта — лице</div>
          <input type="file" id="idCardFrontFile" accept="image/*" style="display:none;">
        </div>
        <div>
          <div class="photo-upload-btn" id="uploadIdCardBackBtn">🪪 Лична карта — гръб</div>
          <input type="file" id="idCardBackFile" accept="image/*" style="display:none;">
        </div>
      </div>

  const editEcType = document.getElementById('editEcType');
  const editEcHoursField = document.getElementById('editEcHoursField');
  if (editEcType) editEcType.addEventListener('change', () => {
    if (editEcHoursField) editEcHoursField.style.display = editEcType.value === 'civil' ? 'none' : '';
  });

  // предупреждава веднага при избор на кола, вече заета от ДРУГ служител —
  // вж. VEHICLE_HOLDER_BY_ID по-горе; само информативно тук, реалното
  // потвърждение е при самото запазване (editForm submit по-долу), за да не
  // се налага да преизбира колата, ако просто размисли.
  const editRcVehicle = document.getElementById('editRcVehicle');
  const editRcVehicleHint = document.getElementById('editRcVehicleHint');
  if (editRcVehicle && editRcVehicleHint) editRcVehicle.addEventListener('change', () => {
    const holder = VEHICLE_HOLDER_BY_ID[editRcVehicle.value];
    if (holder && holder.driverId !== TARGET_ID) {
      editRcVehicleHint.textContent = `⚠ Тази кола в момента е зачислена на ${holder.name} от ${fmtDate(holder.since)}. При запазване ще бъдете попитани дали да прекратите предишното зачисление/договор.`;
      editRcVehicleHint.style.display = '';
    } else {
      editRcVehicleHint.style.display = 'none';
    }
  });

  const editForm = document.getElementById('editForm');
  if (editForm) editForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('editError');
    const successBox = document.getElementById('editSuccess');
    errorBox.classList.remove('show'); successBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (!data.manager_id) data.manager_id = null;
    // полетата "Договор и кола" не са профилни полета — извадени отделно и
    // обработени след запазването на профила (изрично искане на потребителя
    // да може да смени таксата/вида на договора и зачисления автомобил
    // директно от тази форма, без да се налага да скролва/кръстосва менюта)
    const ecType = data.ec_contract_type || ''; delete data.ec_contract_type;
    const ecHours = data.ec_hours_per_day || ''; delete data.ec_hours_per_day;
    const ecDeduction = data.ec_weekly_deduction_amount || ''; delete data.ec_weekly_deduction_amount;
    const rcVehicle = data.rc_vehicle_id || ''; delete data.rc_vehicle_id;
    const rcRate = data.rc_rate_amount || ''; delete data.rc_rate_amount;
    const rcStartDate = data.rc_start_date || todayStr(); delete data.rc_start_date;

    // Ако избраната кола в момента е зачислена/наета на ДРУГ служител, питаме
    // изрично преди да продължим, вместо тихо да отнемем колата от него
    // (изрично искане на потребителя: при заета кола да излезе съобщение на
    // кой и от коя дата е назначена, и да пита дали да прекрати предишния
    // договор). При отказ пропускаме САМО частта за колата — останалите
    // промени по досието пак се запазват.
    let skipVehicleChange = false;
    let holderToTerminate = null;
    if (rcVehicle && rcVehicle !== '__none__') {
      const holder = VEHICLE_HOLDER_BY_ID[rcVehicle];
      if (holder && holder.driverId !== TARGET_ID) {
        const vLabel = (ALL_VEHICLES.find(v => v.id === rcVehicle) || {}).plate_number || 'Колата';
        const ok = confirm(`${vLabel} в момента е зачислена на ${holder.name} от ${fmtDate(holder.since)}.\n\nДа прекратя ли предишното зачисление/договор и да я прехвърля на ${data.full_name || 'този служител'}?`);
        if (ok) holderToTerminate = holder;
        else skipVehicleChange = true;
      }
    }
    try {
      await Api.put(`/api/hr/personnel/${TARGET_ID}`, data);
      const warnings = [];

      if (ecType || ecDeduction) {
        const curEc = CURRENT_EMPLOYMENT_CONTRACTS.find(c => c.status === 'active');
        try {
          if (curEc) {
            const patch = {};
            if (ecType) patch.contract_type = ecType;
            const effectiveType = ecType || curEc.contract_type;
            if (effectiveType === 'labor' && ecHours) patch.hours_per_day = Number(ecHours);
            if (effectiveType === 'civil') patch.hours_per_day = null;
            if (ecDeduction !== '') patch.weekly_deduction_amount = Number(ecDeduction);
            await Api.put(`/api/hr/employment-contracts/${curEc.id}`, patch);
          } else if (ecType) {
            const ecData = { profile_id: TARGET_ID, contract_type: ecType, start_date: todayStr(), status: 'active' };
            if (ecType === 'labor') ecData.hours_per_day = Number(ecHours || 8);
            if (ecDeduction) ecData.weekly_deduction_amount = Number(ecDeduction);
            await Api.post('/api/hr/employment-contracts', ecData);
          }
        } catch (err) { warnings.push('Договорът не се обнови: ' + err.message); }
      }

      if (rcVehicle && skipVehicleChange) {
        warnings.push('Смяната на кола беше отменена — колата остава при предишния държач.');
      } else if (rcVehicle) {
        const curRental = CURRENT_RENTAL_CONTRACTS.find(c => c.status === 'active');
        try {
          if (rcVehicle === '__none__') {
            if (curRental) await Api.put(`/api/contracts/${curRental.id}`, { status: 'terminated' });
          } else if (curRental && curRental.vehicle_id === rcVehicle) {
            // същата кола — позволяваме и корекция на началната дата на вече
            // съществуващия активен договор (напр. назад във времето, ако е
            // била пропусната/грешна при самото зачисляване); преди тази
            // поправка полето се игнорираше тук и администраторът нямаше
            // начин да коригира датата на вече зачислена кола (изрично
            // съобщен проблем от потребителя: "не ми дава назначаване със
            // задна дата")
            const patch = {};
            if (rcRate) patch.rate_amount = Number(rcRate);
            if (rcStartDate && rcStartDate !== curRental.start_date) patch.start_date = rcStartDate;
            if (Object.keys(patch).length) await Api.put(`/api/contracts/${curRental.id}`, patch);
          } else {
            if (curRental) await Api.put(`/api/contracts/${curRental.id}`, { status: 'terminated' });
            // прекратяваме и зачислението/договора на ПРЕДИШНИЯ държач на тази
            // кола, ако администраторът потвърди прехвърлянето по-горе —
            // иначе колата би останала с ДВЕ едновременно активни зачисления.
            if (holderToTerminate) {
              if (holderToTerminate.source === 'assignment') {
                await Api.post(`/api/assignments/${holderToTerminate.recordId}/end`, {});
              } else {
                await Api.put(`/api/contracts/${holderToTerminate.recordId}`, { status: 'terminated' });
              }
            }
            await Api.post('/api/contracts', {
              vehicle_id: rcVehicle,
              renter_type: 'dombi_courier',
              renter_driver_id: TARGET_ID,
              start_date: rcStartDate,
              rate_amount: Number(rcRate || 0),
              rate_period: 'week',
              deposit_amount: 0,
              status: 'active',
            });
          }
        } catch (err) { warnings.push('Колата не се обнови: ' + err.message); }
      }

      await loadFile();
      const sb = document.getElementById('editSuccess');
      sb.textContent = 'Запазено успешно.' + (warnings.length ? ' Внимание: ' + warnings.join(' ') : '');
      sb.classList.add('show');
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  function bindPersonnelPhotoUpload(btnId, fileId, endpoint, side, successMsg) {
    const btn = document.getElementById(btnId);

    const fileInput = document.getElementById(fileId);
    if (fileInput) fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const msg = document.getElementById('photoMsg');
      msg.textContent = 'Качване…';
      try {
        const dataUrl = await readFileAsDataUrl(file);
        const body = { photo: dataUrl };
        if (side) body.side = side;
        await Api.post(`/api/hr/personnel/${TARGET_ID}/${endpoint}`, body);
        await loadFile();
        const m = document.getElementById('photoMsg');
        if (m) m.textContent = successMsg;
      } catch (err) { msg.textContent = err.message; }
    });
  }

    if (ecCivilFields) ecCivilFields.style.display = ecTypeSelect.value === 'civil' ? '' : 'none';

  // Събира плоските own_vehicle_*/equipment_*_N полета от формата в
  // own_vehicle обект и equipment масив, както ги очакват
  // buildCivilAdContractPdf/Docx (lib/pdf-builder.js, lib/doc-builder.js) —
  // FormData не поддържа вложени структури, затова сглобяваме ръчно тук.
  function collectCivilFields(data) {
    const ov = {};
    if (data.own_vehicle_type) ov.type = data.own_vehicle_type;
    if (data.own_vehicle_make) ov.make = data.own_vehicle_make;
    if (data.own_vehicle_model) ov.model = data.own_vehicle_model;
    if (data.own_vehicle_plate) ov.plate = data.own_vehicle_plate;
    if (data.own_vehicle_reg_year) ov.reg_year = data.own_vehicle_reg_year;
    if (data.own_vehicle_fuel) ov.fuel = data.own_vehicle_fuel;
    if (data.own_vehicle_consumption) ov.consumption = data.own_vehicle_consumption;
    ov.electric = !!data.own_vehicle_electric;
    delete data.own_vehicle_type; delete data.own_vehicle_make; delete data.own_vehicle_model;
    delete data.own_vehicle_plate; delete data.own_vehicle_reg_year; delete data.own_vehicle_fuel;
    delete data.own_vehicle_consumption; delete data.own_vehicle_electric;
    if (Object.keys(ov).length) data.own_vehicle = ov;

    const equipment = [];
    for (let i = 1; i <= 2; i++) {
      const name = data[`equipment_name_${i}`];
      const value = data[`equipment_value_${i}`];
      delete data[`equipment_name_${i}`]; delete data[`equipment_value_${i}`];
      if (name) equipment.push({ name, value: value ? Number(value) : 0 });
    }
    if (equipment.length) data.equipment = equipment;

    ['rate_per_km', 'rate_per_delivery', 'cap_km', 'cap_deliveries', 'term_years', 'notice_period_months', 'deposit_amount'].forEach(k => {
      if (data[k] === '') delete data[k];
      else if (data[k] != null) data[k] = Number(data[k]);
    });
    return data;
  }

  document.querySelectorAll('.ec-edit-type-select').forEach(sel => {

  document.querySelectorAll('.ec-deduction-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = form.dataset.id;
      const data = Object.fromEntries(new FormData(form).entries());
      // пълна редакция на договора — изрично искане на потребителя "опция за
      // промяна на всички параметри", не само удръжката (виж PUT
      // /api/hr/employment-contracts/:id в server.js, приема произволен patch)
      const patch = {
        contract_type: data.contract_type,
        end_date: data.end_date || null,
        deduction_type: data.deduction_type,
      };
      if (data.start_date) patch.start_date = data.start_date; // началната дата си остава задължителна, не я нулираме
      patch.hours_per_day = data.contract_type === 'labor' ? Number(data.hours_per_day) : null;
      if (data.deduction_type === 'percentage') {
        patch.deduction_percentage = data.deduction_percentage ? Number(data.deduction_percentage) : 0;
        patch.deduction_threshold_amount = data.deduction_threshold_amount ? Number(data.deduction_threshold_amount) : null;
        patch.deduction_percentage_above_threshold = data.deduction_percentage_above_threshold ? Number(data.deduction_percentage_above_threshold) : null;
      } else {
        patch.weekly_deduction_amount = data.weekly_deduction_amount ? Number(data.weekly_deduction_amount) : 0;
        patch.deduction_percentage = null;
        patch.deduction_threshold_amount = null;
        patch.deduction_percentage_above_threshold = null;
      }
      if (data.contract_type === 'civil') {
        const civilData = collectCivilFields({ ...data });
        ['rate_per_km', 'rate_per_delivery', 'cap_km', 'cap_deliveries', 'term_years', 'notice_period_months', 'deposit_amount', 'equipment', 'own_vehicle']
          .forEach(k => { if (civilData[k] !== undefined) patch[k] = civilData[k]; });
      }
      try {
        await Api.put(`/api/hr/employment-contracts/${id}`, patch);
        await loadFile();
      } catch (err) { alert('Грешка: ' + err.message); }
    });
  });

  // редакция на наем на кола — разгъващ се ред под съответния запис,
  // огледално на ec-deduction-row/ec-deduction-form по-горе (виж коментара
  // там); PUT /api/contracts/:id приема произволен patch (db.updateContract)
  document.querySelectorAll('.rc-edit-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = document.querySelector(`.rc-edit-row[data-id="${btn.dataset.id}"]`);
      if (row) row.style.display = row.style.display === 'none' ? '' : 'none';
    });
  });
  document.querySelectorAll('.rc-edit-cancel').forEach(btn => {
    btn.addEventListener('click', () => {
      const row = document.querySelector(`.rc-edit-row[data-id="${btn.dataset.id}"]`);
      if (row) row.style.display = 'none';
    });
  });
  document.querySelectorAll('.rc-edit-form').forEach(form => {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = form.dataset.id;
      const data = Object.fromEntries(new FormData(form).entries());
      const patch = {
        rate_amount: data.rate_amount ? Number(data.rate_amount) : 0,
        rate_period: data.rate_period,
        deposit_amount: data.deposit_amount ? Number(data.deposit_amount) : 0,
        status: data.status,
        end_date: data.end_date || null,
      };
      if (data.start_date) patch.start_date = data.start_date;
      try {
        await Api.put(`/api/contracts/${id}`, patch);
        await loadFile();
      } catch (err) { alert('Грешка: ' + err.message); }
    });
  });

  // зачисляване на нов нает автомобил директно от досието — създава
  // активен договор за наем (renter_type: 'dombi_courier') без да се минава
  // през отделния екран "Нов договор" (вж. contract-new.html); изрично
  // искане на потребителя "директно зачисляване на автомобил от... досието"
  const rcNewForm = document.getElementById('rcNewForm');
  if (rcNewForm) {
    rcNewForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('rcNewError');
      errorBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      const patch = {
        vehicle_id: data.vehicle_id,
        renter_type: 'dombi_courier',
        renter_driver_id: TARGET_ID,
        start_date: data.start_date,
        rate_amount: Number(data.rate_amount || 0),
        rate_period: data.rate_period,
        deposit_amount: Number(data.deposit_amount || 0),
        status: 'active',
      };
      try {
        await Api.post('/api/contracts', patch);
        await loadFile();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }

  const ecForm = document.getElementById('ecForm');
  if (ecForm) ecForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById('ecError');
    errorBox.classList.remove('show');
    const data = Object.fromEntries(new FormData(e.target).entries());
    delete data.ecScanFile;
    data.profile_id = TARGET_ID;
    if (data.contract_type !== 'labor') delete data.hours_per_day;
    else data.hours_per_day = Number(data.hours_per_day);
    if (!data.end_date) delete data.end_date;
    if (data.contract_type === 'civil') {
      collectCivilFields(data);
    } else {
      ['rate_per_km', 'rate_per_delivery', 'cap_km', 'cap_deliveries', 'term_years', 'notice_period_months', 'deposit_amount',
        'own_vehicle_type', 'own_vehicle_make', 'own_vehicle_model', 'own_vehicle_plate', 'own_vehicle_reg_year',
        'own_vehicle_fuel', 'own_vehicle_consumption', 'own_vehicle_electric',
        'equipment_name_1', 'equipment_value_1', 'equipment_name_2', 'equipment_value_2'].forEach(k => delete data[k]);
    }
    if (data.deduction_type === 'percentage') {
      delete data.weekly_deduction_amount;
      data.deduction_percentage = data.deduction_percentage ? Number(data.deduction_percentage) : 0;
      if (!data.deduction_threshold_amount) delete data.deduction_threshold_amount;
      else data.deduction_threshold_amount = Number(data.deduction_threshold_amount);
      if (!data.deduction_percentage_above_threshold) delete data.deduction_percentage_above_threshold;
      else data.deduction_percentage_above_threshold = Number(data.deduction_percentage_above_threshold);
    } else {
      delete data.deduction_percentage;
      delete data.deduction_threshold_amount;
      delete data.deduction_percentage_above_threshold;
      if (!data.weekly_deduction_amount) delete data.weekly_deduction_amount;
      else data.weekly_deduction_amount = Number(data.weekly_deduction_amount);
    }
    try {
      const { contract } = await Api.post('/api/hr/employment-contracts', data);
      const scanFile = document.getElementById('ecScanFile').files[0];
      if (scanFile) {
        const msg = document.getElementById('ecScanMsg');
        if (msg) msg.textContent = 'Качване на скенера…';
        try {
          const dataUrl = await readFileAsDataUrl(scanFile);
          await Api.post(`/api/hr/employment-contracts/${contract.id}/scan`, { file_base64: dataUrl });
        } catch (scanErr) {
          errorBox.textContent = 'Договорът е създаден, но скенерът не се качи: ' + scanErr.message;
          errorBox.classList.add('show');
        }
      }
      await loadFile();
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    }
  });

  document.querySelectorAll('.ec-status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      try { await Api.put(`/api/hr/employment-contracts/${sel.dataset.id}`, { status: sel.value }); }
      catch (err) { alert(err.message); }
    });
  });

  document.querySelectorAll('.ec-scan-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector(`.ec-scan-file[data-id="${btn.dataset.id}"]`).click();
    });
  });
  document.querySelectorAll('.ec-scan-file').forEach(inp => {
    inp.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await readFileAsDataUrl(file);
        await Api.post(`/api/hr/employment-contracts/${inp.dataset.id}/scan`, { file_base64: dataUrl });
        await loadFile();
      } catch (err) { alert(err.message); }
    });
  });

  const egnToggleBtn = document.getElementById('egnToggleBtn');
  if (egnToggleBtn) egnToggleBtn.addEventListener('click', () => {
    const masked = document.getElementById('egnMasked');
    const full = document.getElementById('egnFull');
    const showing = full.style.display !== 'none';
    masked.style.display = showing ? '' : 'none';
    full.style.display = showing ? 'none' : '';
    egnToggleBtn.textContent = showing ? 'Покажи' : 'Скрий';
  });

  const toggleStatusBtn = document.getElementById('toggleStatusBtn');
  if (toggleStatusBtn) toggleStatusBtn.addEventListener('click', async () => {
    const newStatus = profile.status === 'active' ? 'suspended' : 'active';
    if (!confirm(newStatus === 'active' ? 'Активирай профила на служителя?' : 'Спри профила на служителя?')) return;
    try { await Api.put(`/api/hr/personnel/${TARGET_ID}`, { status: newStatus }); await loadFile(); }
    catch (err) { alert(err.message); }
  });

  const sendPersonnelLinkBtn = document.getElementById('sendPersonnelLinkBtn');
  if (sendPersonnelLinkBtn) sendPersonnelLinkBtn.addEventListener('click', async () => {
    try {
      const { link } = await Api.post(`/api/hr/personnel/${TARGET_ID}/send-link`, {});
      try { await navigator.clipboard.writeText(link); } catch (e) { /* без достъп до клипборда — показваме линка директно */ }
      prompt('Линкът е копиран (ако браузърът позволи). Изпрати го на служителя през Viber/SMS/имейл, за да допълни/обнови досието си:', link);
    } catch (err) { alert(err.message); }
  });

  const toggleBlacklistBtn = document.getElementById('toggleBlacklistBtn');
  if (toggleBlacklistBtn) toggleBlacklistBtn.addEventListener('click', async () => {
    try {
      if (profile.blacklisted) {
        if (!confirm('Да извадим ли служителя от черния списък?')) return;
        await Api.post(`/api/hr/personnel/${TARGET_ID}/blacklist`, { blacklisted: false });
      } else {
        const reason = prompt('Причина за вкарване в черен списък (по избор):') || '';
        await Api.post(`/api/hr/personnel/${TARGET_ID}/blacklist`, { blacklisted: true, reason });
      }
      await loadFile();
    } catch (err) { alert(err.message); }
  });

  const deleteEmployeeBtn = document.getElementById('deleteEmployeeBtn');
  if (deleteEmployeeBtn) deleteEmployeeBtn.addEventListener('click', async () => {
    if (!confirm(`Сигурни ли сте, че искате да изтриете служителя ${profile.full_name}? Това действие е необратимо.`)) return;
    try {
      await Api.del(`/api/hr/personnel/${TARGET_ID}`);
      window.location = '/personnel.html';
    } catch (err) { alert(err.message); }
  });

  const walletAdjToggleBtn = document.getElementById('walletAdjToggleBtn');
  if (walletAdjToggleBtn) walletAdjToggleBtn.addEventListener('click', () => {
    const p = document.getElementById('walletAdjPanel');
    p.style.display = p.style.display === 'none' ? '' : 'none';
  });

  if (IS_SELF || CAN_EDIT) loadWallet();
  if (document.getElementById('earningsHost')) initEarningsPanel();
  if (document.getElementById('commissionForm')) initCommissionPanel();
}

// -------- Финансова статистика (заработка / удръжки / изплащане) ------------
function initEarningsPanel() {
  const fromInput = document.getElementById('earnFrom');
  const toInput = document.getElementById('earnTo');
  fromInput.value = addDaysStr(currentWeekStart(), -7 * 8); // последните ~8 седмици по подразбиране
  toInput.value = todayStr();
  mountPeriodPicker(document.getElementById('earningsPeriodPicker'), fromInput, toInput, {
    useMonthPreset: true, onApply: () => loadEarnings(),
  });
  document.getElementById('earnRefreshBtn').addEventListener('click', loadEarnings);
  loadEarnings();
}

const PLATFORM_LABELS = { bolt: 'Bolt', glovo: 'Glovo' };
function platformBreakdownLine(e) {
  const pb = e.platform_breakdown;
  if (!pb || !Object.keys(pb).length) return '';
  return `<small>${Object.entries(pb).map(([k, v]) => `${PLATFORM_LABELS[k] || k}: ${fmtMoney(v)}`).join(' · ')}</small>`;
}

// активният трудов/граждански договор (ако има) — за компактния изглед
// "на какъв договор е служителят" + часове/ден (виж заявка на клиента);
// НЕ е реално отчетено работно време (системата няма модул за това), а
// договореният график по действащия договор.
function activeEmploymentContractLabel() {
  const active = (CURRENT_EMPLOYMENT_CONTRACTS || []).find(c => c.status === 'active');
  if (!active) return { contract: '—', hours: '—' };
  const type = EC_TYPE_LABELS[active.contract_type] || active.contract_type;
  return { contract: type, hours: active.hours_per_day ? `${active.hours_per_day} ч./ден` : '—' };
}

async function loadEarnings() {
  const host = document.getElementById('earningsHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const from = document.getElementById('earnFrom').value;
  const to = document.getElementById('earnTo').value;
  const { contract, hours } = activeEmploymentContractLabel();
  try {
    const [{ entries, earnings_visible }, walletRes] = await Promise.all([
      Api.get(`/api/hr/payroll?profile_id=${TARGET_ID}`),
      (IS_SELF || CAN_EDIT) ? Api.get(`/api/wallet/users/${TARGET_ID}`).catch(() => null) : Promise.resolve(null),
    ]);
    const balance = walletRes ? walletRes.balance : null;
    const periodEntries = entries.filter(e => (!from || e.week_start >= from) && (!to || e.week_start <= to));
    const totalOrders = periodEntries.reduce((s, e) => s + Number(e.order_count || 0), 0);
    if (!earnings_visible) {
      host.innerHTML = `
        <div class="stat-grid">
          <div class="stat-card"><div class="label">Поръчки за периода</div><div class="value">${totalOrders}</div></div>
          <div class="stat-card"><div class="label">Договор / график</div><div class="value" style="font-size:1rem;">${contract} · ${hours}</div></div>
        </div>
        <p class="hint">Сумите не са видими за вас за този профил.</p>`;
      return;
    }
    const totalGross = periodEntries.reduce((s, e) => s + Number(e.gross_earnings || 0), 0);
    const totalDeduction = periodEntries.reduce((s, e) => s + Number(e.deduction_amount || 0), 0);
    const totalCarRent = periodEntries.reduce((s, e) => s + Number(e.car_rent_amount || 0), 0);
    const totalNet = periodEntries.reduce((s, e) => s + Number(e.net_amount || 0), 0);
    const totalPaid = periodEntries.filter(e => e.paid).reduce((s, e) => s + Number(e.net_amount || 0), 0);
    const totalUnpaid = totalNet - totalPaid;
    // сборове по платформа (Bolt/Glovo/...) — от платформената разбивка,
    // запазена при импорта (виж platform_breakdown в payroll_entries)
    const platformTotals = {};
    periodEntries.forEach(e => {
      if (!e.platform_breakdown) return;
      Object.entries(e.platform_breakdown).forEach(([k, v]) => {
        platformTotals[k] = (platformTotals[k] || 0) + Number(v || 0);
      });
    });
    const platformTotalsLine = Object.keys(platformTotals).length
      ? `<p class="hint" style="margin-top:-14px;margin-bottom:10px;">По платформа: ${Object.entries(platformTotals).map(([k, v]) => `<strong>${PLATFORM_LABELS[k] || k}</strong>: ${fmtMoney(v)}`).join(' · ')}</p>` : '';
    host.innerHTML = `
      <div class="stat-grid">
        ${balance !== null ? `<div class="stat-card"><div class="label">Текущо салдо</div><div class="value">${fmtMoney(balance)}</div></div>` : ''}
        <div class="stat-card"><div class="label">Поръчки за периода</div><div class="value">${totalOrders}</div></div>
        <div class="stat-card"><div class="label">Договор / график</div><div class="value" style="font-size:1rem;">${contract} · ${hours}</div></div>
        <div class="stat-card"><div class="label">Изкарани пари (от платформата)</div><div class="value">${fmtMoney(totalGross)}</div></div>
        <div class="stat-card"><div class="label">Приход за фирмата (седмични такси)</div><div class="value green">${fmtMoney(totalDeduction)}</div></div>
        ${totalCarRent ? `<div class="stat-card"><div class="label">Наем на кола (удържан)</div><div class="value">${fmtMoney(totalCarRent)}</div></div>` : ''}
        <div class="stat-card"><div class="label">За изплащане на служителя общо</div><div class="value">${fmtMoney(totalNet)}</div></div>
        <div class="stat-card"><div class="label">Изплатено вече</div><div class="value green">${fmtMoney(totalPaid)}</div></div>
        <div class="stat-card"><div class="label">Остава да се плати</div><div class="value ${totalUnpaid > 0 ? 'warn' : ''}">${fmtMoney(totalUnpaid)}</div></div>
      </div>
      ${platformTotalsLine}
      <p class="hint" style="margin-top:8px;">„Приход за фирмата“ е сборът от седмичните такси/удръжки по договора — реалният паричен приход на фирмата от служителя. Наемът на кола е отделна удръжка (вижда се като отделен ред по-долу и по-горе, ако е приложим) — заедно двете намаляват „Изкарани пари“ до „За изплащане“. Не изважда споделени разходи (сервиз и др.), затова не е чиста печалба — пълният отчет е на страница „Счетоводство“.</p>
      ${periodEntries.length ? `
      <div class="table-wrap" style="margin-top:10px;"><table>
        <thead><tr><th>Седмица</th><th>Поръчки</th><th>Заработка</th><th>Удръжка</th><th>Наем кола</th><th>За изплащане</th><th>Платено</th><th></th></tr></thead>
        <tbody>
          ${periodEntries.sort((a, b) => (a.week_start < b.week_start ? 1 : -1)).map(e => `
            <tr>
              <td>${weekRangeLabel(e.week_start, e.week_end)}</td>
              <td>${e.order_count || 0}</td>
              <td><div class="stack">${fmtMoney(e.gross_earnings)}${platformBreakdownLine(e)}</div></td>
              <td>${fmtMoney(e.deduction_amount)}</td>
              <td>${fmtMoney(e.car_rent_amount)}</td>
              <td><strong>${fmtMoney(e.net_amount)}</strong></td>
              <td>${e.paid ? '<span class="badge badge-green">Платено</span>' : '<span class="badge badge-warn">Дължимо</span>'}</td>
              <td>${(['admin', 'super_admin'].includes(CURRENT_USER.role) && !e.paid) ? `<button type="button" class="btn btn-ghost btn-sm earn-mark-paid-btn" data-id="${e.id}" style="padding:2px 8px;font-size:.68rem;">Маркирай платено</button>` : ''}</td>
            </tr>`).join('')}
        </tbody>
      </table></div>` : `<p class="hint">Няма записи за избрания период.</p>`}
    `;
    host.querySelectorAll('.earn-mark-paid-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await Api.post(`/api/hr/payroll/${btn.dataset.id}/mark-paid`, { paid: true }); await loadEarnings(); }
        catch (err) { alert(err.message); }
      });
    });
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

// -------- Комисионна (дивидент) на мениджър от неговия екип ------------------
function toggleCommissionFields() {
  const form = document.getElementById('commissionForm');
  const type = form.comp_type.value;
  document.getElementById('percentageField').style.display = type === 'percentage' ? '' : 'none';
  document.getElementById('fixedFields').style.display = type === 'fixed' ? '' : 'none';
  document.getElementById('perActiveDriverFields').style.display = type === 'per_active_driver' ? '' : 'none';
}

async function initCommissionPanel() {
  const compTypeSelect = document.getElementById('compTypeSelect');
  compTypeSelect.addEventListener('change', toggleCommissionFields);

  const commFrom = document.getElementById('commFrom');
  const commTo = document.getElementById('commTo');
  commFrom.value = previousWeekStart();
  commTo.value = previousWeekStart();
  mountPeriodPicker(document.getElementById('commissionPeriodPicker'), commFrom, commTo, {
    wireWeekEnd: false, weekPresetMode: 'single', useMonthPreset: true, onApply: () => loadCommissionStats(),
  });
  document.getElementById('commRefreshBtn').addEventListener('click', loadCommissionStats);

  try {
    const { commission } = await Api.get(`/api/hr/partners/${TARGET_ID}`);
    const form = document.getElementById('commissionForm');
    form.comp_type.value = (commission && commission.comp_type) || 'percentage';
    form.percentage.value = (commission && commission.percentage != null) ? commission.percentage : '';
    form.fixed_amount.value = (commission && commission.fixed_amount != null) ? commission.fixed_amount : '';
    form.fixed_period.value = (commission && commission.fixed_period) || 'month';
    form.per_driver_amount.value = (commission && commission.per_driver_amount != null) ? commission.per_driver_amount : '';
    form.qualifying_threshold.value = (commission && commission.qualifying_threshold != null) ? commission.qualifying_threshold : 30;
    form.notes.value = (commission && commission.notes) || '';
    form.active.checked = commission ? commission.active !== false : true;
    toggleCommissionFields();
  } catch (err) {
    const eb = document.getElementById('commissionError');
    eb.textContent = err.message;
    eb.classList.add('show');
  }

  if (['admin', 'super_admin'].includes(CURRENT_USER.role)) {
    document.getElementById('commissionForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('commissionError');
      const successBox = document.getElementById('commissionSuccess');
      errorBox.classList.remove('show'); successBox.classList.remove('show');
      const form = e.target;
      const patch = {
        comp_type: form.comp_type.value,
        percentage: form.percentage.value ? Number(form.percentage.value) : null,
        fixed_amount: form.fixed_amount.value ? Number(form.fixed_amount.value) : null,
        fixed_period: form.fixed_period.value,
        per_driver_amount: form.per_driver_amount.value ? Number(form.per_driver_amount.value) : null,
        qualifying_threshold: form.qualifying_threshold.value ? Number(form.qualifying_threshold.value) : 30,
        notes: form.notes.value || null,
        active: form.active.checked,
      };
      try {
        await Api.put(`/api/hr/partners/${TARGET_ID}`, patch);
        successBox.textContent = 'Комисионната е запазена.';
        successBox.classList.add('show');
        await loadCommissionStats();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }

  await loadCommissionStats();
}

async function loadCommissionStats() {
  const host = document.getElementById('commissionStatsHost');
  if (!host) return;
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const from = document.getElementById('commFrom').value;
  const to = document.getElementById('commTo').value;
  const qs = new URLSearchParams();
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);
  try {
    const stats = await Api.get(`/api/hr/partners/${TARGET_ID}/stats?${qs.toString()}`);
    const isPerActiveDriver = stats.commission && stats.commission.comp_type === 'per_active_driver';
    host.innerHTML = `
      <p class="hint">⚠️ Базата за изчисление засега е заработката (заплати) на екипа за периода — приблизителна стойност, докато не бъде готов реалният приход по служител. Не е окончателна счетоводна сума.</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">Шофьори в екипа</div><div class="value">${stats.team_size}</div></div>
        <div class="stat-card"><div class="label">Отчетени седмици</div><div class="value">${stats.weeks_covered}</div></div>
        <div class="stat-card"><div class="label">Общо поръчки</div><div class="value">${stats.total_orders}</div></div>
        <div class="stat-card"><div class="label">Заработка на екипа</div><div class="value">${fmtMoney(stats.total_gross_earnings)}</div></div>
        ${isPerActiveDriver ? `<div class="stat-card"><div class="label">Активни шофьор-седмици (&gt; ${stats.qualifying_threshold} €)</div><div class="value">${stats.total_qualifying_driver_weeks}</div></div>` : ''}
        <div class="stat-card"><div class="label">Дължима комисионна</div><div class="value green">${fmtMoney(stats.commission_owed)}</div></div>
      </div>`;
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}

const WALLET_TX_TYPE_LABELS = {
  transfer: 'Превод между потребители',
  admin_adjustment: 'Ръчна корекция от админ',
  adjustment: 'Корекция',
};
function walletTxBadge(t) {
  const positive = Number(t.amount) >= 0;
  return `<span class="badge ${positive ? 'badge-green' : 'badge-danger'}">${positive ? '+' : ''}${fmtMoney(t.amount)}</span>`;
}

let CURRENT_WALLET_BALANCE = null;

async function loadWallet() {
  const host = document.getElementById('walletHost');
  if (!host) return;
  try {
    const { balance, transactions } = await Api.get(`/api/wallet/users/${TARGET_ID}`);
    CURRENT_WALLET_BALANCE = balance;
    host.innerHTML = `
      <p style="margin:0 0 10px;font-size:.9rem;">Текущо салдо: <strong style="font-size:1.1rem;">${fmtMoney(balance)}</strong></p>
      ${transactions.length ? `
      <div class="table-wrap"><table>
        <thead><tr><th>Кога</th><th>Вид</th><th>Сума</th><th>Бележка</th></tr></thead>
        <tbody>
          ${transactions.map(t => `
            <tr><td>${fmtDateTime(t.created_at)}</td><td>${WALLET_TX_TYPE_LABELS[t.type] || t.type}</td>
            <td>${walletTxBadge(t)}</td><td>${t.note || '—'}</td></tr>`).join('')}
        </tbody>
      </table></div>` : `<p class="hint">Няма транзакции все още.</p>`}
    `;
  } catch (err) {
    host.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }

  // формата стои извън #walletHost (не се пресъздава при всяко презареждане на
  // салдото), затова закачаме listener-а само веднъж (пази от натрупване на
  // дублирани listener-и и двойно изпращане при повторни корекции)
  const walletAdjForm = document.getElementById('walletAdjForm');
  if (walletAdjForm && !walletAdjForm.dataset.bound) {
    walletAdjForm.dataset.bound = '1';
    walletAdjForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('walletAdjError');
      const successBox = document.getElementById('walletAdjSuccess');
      errorBox.classList.remove('show'); successBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.user_id = TARGET_ID;
      try {
        await Api.post('/api/wallet/adjustments', data);
        successBox.textContent = 'Корекцията е приложена.';
        successBox.classList.add('show');
        e.target.reset();
        await loadWallet();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }
}

async function init() {
  // "Моите досие" (шофьор, без ?id=) е отделен nav елемент от "Досиета на
  // служители" (админ/мениджър списък) — маркираме правилния активен линк
  // в sidebar-а, преди mountShell() да прочете data-active атрибута.
  const shellEl = document.getElementById('app-shell');
  if (shellEl) shellEl.dataset.active = qs('id') ? '/personnel.html' : '/personnel-detail.html';

  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;

  TARGET_ID = qs('id') || CURRENT_USER.id;
  IS_SELF = TARGET_ID === CURRENT_USER.id;
  CAN_EDIT = ['admin', 'manager', 'super_admin'].includes(CURRENT_USER.role);

  if (!IS_SELF && !CAN_EDIT) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате това досие.</div>`;
    return;
  }

  if (CAN_EDIT) {
    try {
      const { users } = await Api.get('/api/users');
      MANAGERS = users;
    } catch (e) { MANAGERS = []; }
    try {
      const { vehicles } = await Api.get('/api/vehicles');
      ALL_VEHICLES = vehicles;
    } catch (e) { ALL_VEHICLES = []; }
    try {
      // /api/wallet/directory — за разлика от /api/users (на обикновен
      // мениджър показва само неговия пряк екип), връща ВСИЧКИ активни
      // потребители с име, за да можем да покажем точно кой държи колата,
      // дори ако е от екипа на друг мениджър.
      const [{ assignments }, { contracts }, { users: directory }] = await Promise.all([
        Api.get('/api/assignments'), Api.get('/api/contracts'), Api.get('/api/wallet/directory'),
      ]);
      const nameById = Object.fromEntries(directory.map(u => [u.id, u.full_name]));
      VEHICLE_HOLDER_BY_ID = {};
      assignments.filter(a => a.status === 'active').forEach(a => {
        VEHICLE_HOLDER_BY_ID[a.vehicle_id] = {
          name: a.driver_id ? (nameById[a.driver_id] || a.driver_id) : (a.external_name || '—'),
          driverId: a.driver_id || null, since: a.start_date, recordId: a.id, source: 'assignment',
        };
      });
      contracts.filter(c => c.status === 'active' && !c.assignment_id && !VEHICLE_HOLDER_BY_ID[c.vehicle_id]).forEach(c => {
        VEHICLE_HOLDER_BY_ID[c.vehicle_id] = {
          name: c.renter_name || '—', driverId: c.renter_driver_id || null, since: c.start_date, recordId: c.id, source: 'contract',
        };
      });
    } catch (e) { VEHICLE_HOLDER_BY_ID = {}; }
  }

  document.getElementById('app-content').innerHTML = `
    <div style="margin-bottom:12px;"><a href="/personnel.html" class="btn btn-ghost btn-sm">← Всички служители</a></div>
    <div id="fileHost" class="loading">Зареждане…</div>`;

  try {
    await loadFile();
  } catch (err) {
    document.getElementById('fileHost').innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
