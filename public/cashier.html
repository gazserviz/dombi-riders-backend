<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Обща каса — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app-shell" data-active="/cashier.html" data-title="Обща каса"></div>

<script src="/js/app.js"></script>
<script>
const TXN_TYPE_LABELS = {
  car_rent_income: 'Наем на кола (автоматично)',
  cashier_manual: 'Ръчно движение',
  admin_adjustment: 'Ръчна корекция',
  transfer: 'Превод',
};
function txnTypeLabel(t) { return TXN_TYPE_LABELS[t] || t; }

let CURRENT_USER = null;

function summaryHtml(cashier, balance) {
  if (!cashier) {
    return `<div class="panel"><p class="hint">Все още не е избран касиер — общата каса няма да натрупва наеми от коли, докато супер администраторът не избере кой служител я управлява.</p></div>`;
  }
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Касиер</div><div class="value" style="font-size:1.1rem;">${cashier.full_name}</div>
        <div class="sub">${ROLE_LABELS[cashier.role] || cashier.role}</div></div>
      <div class="stat-card"><div class="label">Текущо салдо в касата</div><div class="value ${balance >= 0 ? 'green' : 'warn'}">${fmtMoney(balance)}</div></div>
    </div>`;
}

function transactionsHtml(transactions) {
  if (!transactions.length) return '<p class="hint">Няма движения все още.</p>';
  return `
    <div class="table-wrap"><table>
      <thead><tr><th>Дата</th><th>Тип</th><th>Бележка</th><th>Сума</th></tr></thead>
      <tbody>
        ${transactions.map(t => `
          <tr>
            <td>${fmtDateTime(t.created_at)}</td>
            <td>${txnTypeLabel(t.type)}</td>
            <td>${t.note || ''}</td>
            <td style="color:${Number(t.amount) >= 0 ? 'var(--green)' : 'var(--danger)'};font-weight:700;">${Number(t.amount) >= 0 ? '+' : ''}${fmtMoney(t.amount)}</td>
          </tr>`).join('')}
      </tbody>
    </table></div>`;
}

function manualFormHtml() {
  return `
    <div class="panel">
      <div class="panel-head"><h2>Ръчно движение (само супер администратор)</h2></div>
      <p class="hint">Положителна сума = внасяне в касата, отрицателна = теглене от касата.</p>
      <div class="error-box" id="manualError"></div>
      <div class="success-box" id="manualSuccess"></div>
      <form id="manualForm">
        <div class="field-row">
          <div class="field"><label>Сума (€) *</label><input name="amount" type="number" step="0.01" required></div>
          <div class="field"><label>Бележка</label><input name="note" placeholder="напр. теглене в брой"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Запиши движение</button>
      </form>
    </div>`;
}

function settingsFormHtml(cashierProfileId, candidates) {
  return `
    <div class="panel">
      <div class="panel-head"><h2>Настройка на касиера (само супер администратор)</h2></div>
      <p class="hint">Изберете кой служител (администратор/мениджър) управлява общата каса — неговият портфейл става касата на фирмата.</p>
      <div class="error-box" id="settingsError"></div>
      <div class="field"><select id="cashierSelect">
        <option value="">— няма избран —</option>
        ${candidates.map(c => `<option value="${c.id}" ${c.id === cashierProfileId ? 'selected' : ''}>${c.full_name} (${ROLE_LABELS[c.role] || c.role})</option>`).join('')}
      </select></div>
      <button type="button" class="btn btn-ghost btn-sm" id="saveCashierBtn" style="margin-top:8px;">Запази</button>
    </div>`;
}

async function loadCashier() {
  const host = document.getElementById('cashierHost');
  host.innerHTML = `<div class="loading">Зареждане…</div>`;
  const { cashier, balance, transactions } = await Api.get('/api/cashier');
  const isSuperAdmin = CURRENT_USER.role === 'super_admin';

  host.innerHTML = `
    ${summaryHtml(cashier, balance)}
    ${isSuperAdmin ? manualFormHtml() : ''}
    <div class="panel">
      <div class="panel-head"><h2>Движения</h2></div>
      ${transactionsHtml(transactions)}
    </div>
  `;

  if (isSuperAdmin) {
    document.getElementById('manualForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('manualError');
      const successBox = document.getElementById('manualSuccess');
      errorBox.classList.remove('show'); successBox.classList.remove('show');
      const data = Object.fromEntries(new FormData(e.target).entries());
      try {
        await Api.post('/api/cashier/adjustments', { amount: Number(data.amount), note: data.note || null });
        successBox.textContent = 'Записано.';
        successBox.classList.add('show');
        e.target.reset();
        await loadCashier();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  }
}

async function loadSettings() {
  const host = document.getElementById('settingsHost');
  try {
    const { cashier_profile_id, candidates } = await Api.get('/api/cashier/settings');
    host.innerHTML = settingsFormHtml(cashier_profile_id, candidates);
    document.getElementById('saveCashierBtn').addEventListener('click', async () => {
      const errorBox = document.getElementById('settingsError');
      errorBox.classList.remove('show');
      const profileId = document.getElementById('cashierSelect').value || null;
      try {
        await Api.put('/api/cashier/settings', { profile_id: profileId });
        await loadCashier();
        await loadSettings();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  } catch (err) {
    host.innerHTML = '';
  }
}

async function init() {
  CURRENT_USER = await mountShell();
  if (!CURRENT_USER) return;
  if (!['admin', 'manager', 'super_admin'].includes(CURRENT_USER.role)) {
    document.getElementById('app-content').innerHTML = `<div class="error-box show">Нямате права да преглеждате общата каса.</div>`;
    return;
  }
  document.getElementById('app-content').innerHTML = `
    <div id="settingsHost"></div>
    <div id="cashierHost" class="loading">Зареждане…</div>
  `;
  if (CURRENT_USER.role === 'super_admin') await loadSettings();
  await loadCashier();
}
init();
</script>
</body>
</html>
