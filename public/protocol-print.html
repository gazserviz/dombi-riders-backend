<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Протокол — Dombi Riders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<style>
  .doc-wrap{max-width:820px;margin:0 auto;padding:30px 28px 60px;}
  .doc-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--line);padding-bottom:16px;margin-bottom:20px;}
  @media print{.doc-header{border-bottom:2px solid #000;}}
  .doc-header h1{margin:0 0 4px;}
  .doc-meta{font-size:.82rem;color:var(--muted);}
  .doc-section{margin-bottom:20px;}
  .doc-section h3{margin-bottom:8px;}
  .kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:.9rem;}
  .kv div span{color:var(--muted);}
  .sign-row{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:50px;}
  .sign-line{border-top:1px solid var(--muted);padding-top:8px;font-size:.8rem;color:var(--muted);text-align:center;}
  .doc-actions{max-width:820px;margin:20px auto 0;padding:0 28px;display:flex;gap:10px;}
  .photo-grid img{width:150px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  @media print{ .topbar,.sidebar{display:none !important;} .content{padding:0;} }
</style>
</head>
<body>
<div id="app-shell" data-active="/vehicles.html" data-title="Протокол"></div>

<script src="/js/app.js"></script>
<script src="/js/esign-ui.js"></script>
<script>
const params = new URLSearchParams(location.search);
const protocolId = params.get('id');

async function init() {
  const user = await mountShell();
  if (!user) return;
  const content = document.getElementById('app-content');
  content.innerHTML = `<div class="loading">Зареждане…</div>`;

  try {
    const { protocol } = await Api.get(`/api/protocols/${protocolId}`);
    const { vehicle } = await Api.get(`/api/vehicles/${protocol.vehicle_id}`);
    let driverLabel = '—';
    if (protocol.assignment_id) {
      try {
        const { assignments } = await Api.get(`/api/assignments?vehicle_id=${protocol.vehicle_id}`);
        const a = assignments.find(x => x.id === protocol.assignment_id);
        if (a) {
          if (a.driver_id) {
            const { users } = await Api.get('/api/users');
            const u = users.find(x => x.id === a.driver_id);
            driverLabel = u ? u.full_name : a.driver_id;
          } else {
            driverLabel = `${a.external_name || '—'} (външен)`;
          }
        }
      } catch (e) { /* игнорираме — незадължителна информация */ }
    }

    content.innerHTML = `
      <div class="doc-actions no-print">
        <button class="btn btn-ghost btn-sm" onclick="history.back()">← Назад</button>
        <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Принтирай / запази като PDF</button>
      </div>
      <div class="doc-wrap">
        <div class="doc-header">
          <div>
            <h1>Приемо-предавателен протокол</h1>
            <div class="doc-meta">№ ${protocol.protocol_number} · ${protocol.type === 'handover' ? 'Предаване на автомобил' : 'Приемане на автомобил'}</div>
          </div>
          <div class="doc-meta" style="text-align:right;">
            <strong>Dombi Riders ЕООД</strong><br>
            ${fmtDateTime(protocol.date)}
          </div>
        </div>

        <div class="doc-section">
          <h3>Автомобил</h3>
          <div class="kv">
            <div><span>Рег. номер: </span><strong>${vehicle ? vehicle.plate_number : protocol.vehicle_id}</strong></div>
            <div><span>Марка / Модел: </span>${vehicle ? vehicle.make + ' ' + vehicle.model : '—'}</div>
            <div><span>VIN / Рама: </span>${vehicle ? (vehicle.vin || '—') : '—'}</div>
            <div><span>Година: </span>${vehicle ? (vehicle.year || '—') : '—'}</div>
          </div>
        </div>

        <div class="doc-section">
          <h3>Състояние при предаването</h3>
          <div class="kv">
            <div><span>Пробег: </span><strong>${protocol.odometer_km ?? '—'} км</strong></div>
            <div><span>Ниво на гориво: </span>${protocol.fuel_level_pct != null ? protocol.fuel_level_pct + '%' : '—'}</div>
            <div><span>Шофьор / наемател: </span>${driverLabel}</div>
          </div>
        </div>

        ${protocol.exterior_notes ? `<div class="doc-section"><h3>Външно състояние — забележки</h3><p>${protocol.exterior_notes}</p></div>` : ''}
        ${protocol.interior_notes ? `<div class="doc-section"><h3>Вътрешно състояние — забележки</h3><p>${protocol.interior_notes}</p></div>` : ''}

        ${(protocol.photos || []).length ? `
        <div class="doc-section">
          <h3>Снимки на състоянието</h3>
          <div class="photo-grid" style="display:flex;flex-wrap:wrap;gap:10px;">
            ${protocol.photos.map(p => `<img src="${p.url}" onerror="this.style.display='none'">`).join('')}
          </div>
        </div>` : ''}

        <div class="sign-row">
          <div class="sign-line">Предал (подпис)</div>
          <div class="sign-line">Приел (подпис)</div>
        </div>
      </div>

      ${esignPanelHtml('protocol', protocolId, protocol)}
    `;
    bindEsignPanel('protocol', protocolId, init);
  } catch (err) {
    content.innerHTML = `<div class="error-box show">${err.message}</div>`;
  }
}
init();
</script>
</body>
</html>
